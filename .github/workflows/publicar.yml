# Publica la carpeta app/ en GitHub Pages cada vez que cambia main.
# Una sola vez en GitHub (ver docs/instalar-en-el-celular.md):
#   Settings → Pages → Source: GitHub Actions
#   Settings → Secrets and variables → Actions → Variables: SUPABASE_URL y SUPABASE_CLAVE (la publishable)
name: Publicar app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Revisar
        run: bash scripts/verificar.sh
      - name: Armar config.js y versión
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_CLAVE: ${{ vars.SUPABASE_CLAVE }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_CLAVE" ]; then
            printf 'window.GYM_CONFIG={url:"%s",clave:"%s"};\n' "$SUPABASE_URL" "$SUPABASE_CLAVE" > app/config.js
          else
            echo "::warning::Faltan las variables SUPABASE_URL / SUPABASE_CLAVE: la app pedirá pegarlas en el celular."
          fi
          v="$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          sed -i "s/__VERSION__/$v/" app/index.html app/sw.js
          rm -f app/config.ejemplo.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
