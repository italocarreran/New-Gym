<title>Slot · App de gimnasio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: una columna tipo app de celular (máx. 480px), barra de pestañas fija abajo, todo operable con el pulgar */
:root {
  --bg: #EEF1F5;
  --surface: #FFFFFF;
  --surface-2: #E4E9F0;
  --ink: #131820;
  --muted: #5A6472;
  --line: #D5DCE5;
  --accent: #1E4FD8;
  --accent-soft: #DCE5FB;
  --accent-ink: #FFFFFF;
  --ok: #1D8048;
  --ok-soft: #DDF1E5;
  --warn: #9A6410;
  --warn-soft: #FBEFD9;
  --bad: #B8322A;
  --bad-soft: #F8E0DE;
  --tag: #6B4FC4;
  --tag-soft: #ECE6FA;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1015; --surface: #161A21; --surface-2: #20262F; --ink: #E8ECF2; --muted: #96A0AD; --line: #2A313B;
    --accent: #7096FF; --accent-soft: #1C2A4D; --accent-ink: #0B1020;
    --ok: #4CC683; --ok-soft: #143222; --warn: #E8AE4C; --warn-soft: #3A2C12; --bad: #F2766B; --bad-soft: #3D1A18;
    --tag: #B39DFF; --tag-soft: #2A2245; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1015; --surface: #161A21; --surface-2: #20262F; --ink: #E8ECF2; --muted: #96A0AD; --line: #2A313B;
  --accent: #7096FF; --accent-soft: #1C2A4D; --accent-ink: #0B1020;
  --ok: #4CC683; --ok-soft: #143222; --warn: #E8AE4C; --warn-soft: #3A2C12; --bad: #F2766B; --bad-soft: #3D1A18;
  --tag: #B39DFF; --tag-soft: #2A2245; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1; }
h2 { font-size: 22px; line-height: 1.05; }
h3 { font-size: 18px; }
p { margin: 0; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* encabezado */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.toggle { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
.toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.toggle[aria-pressed="true"] .dot { background: var(--tag); }

/* nota de "qué problema resuelve" */
.why-tag { display: flex; gap: 8px; align-items: flex-start; background: var(--tag-soft); color: var(--tag); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; font-weight: 500; }
.why-tag b { font-weight: 700; white-space: nowrap; }
.hide-tags .why-tag { display: none; }

/* tira de la sesión */
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.chip-slot { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 4px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.chip-slot .n { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1; }
.chip-slot .l { font-size: 10px; line-height: 1.15; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-slot.cur { border-color: var(--accent); background: var(--accent-soft); }
.chip-slot.done { background: var(--ok-soft); border-color: transparent; }
.chip-slot.done .n { color: var(--ok); }
.chip-slot.cut { opacity: .45; text-decoration: line-through; }
.prio { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; }
.prio.alta { background: var(--accent); color: var(--accent-ink); }
.prio.media { background: var(--accent-soft); color: var(--accent); }
.prio.baja { background: var(--surface-2); color: var(--muted); }

/* tarjeta principal */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.slot-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.slot-line { font-size: 19px; min-width: 0; }
.slot-type { font-family: var(--body); font-size: 13px; font-weight: 500; }
.pico { border: none; background: var(--surface-2); border-radius: 8px; width: 34px; height: 30px; display: grid; place-items: center; padding: 0; flex-shrink: 0; }
.pico svg { width: 18px; height: 16px; }
.pico.alta { color: var(--bad); background: var(--bad-soft); }
.pico.media { color: var(--warn); background: var(--warn-soft); }
.pico.baja { color: var(--muted); }
.plegend { display: flex; flex-direction: column; gap: 8px; }
.plegend div { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 10px; align-items: center; font-size: 13.5px; }
.plegend div.cur { font-weight: 600; }
.slot-head .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.target { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1; text-align: right; white-space: nowrap; }
.target small { display: block; font-family: var(--body); font-size: 11px; font-weight: 500; color: var(--muted); }

.alts { display: flex; flex-direction: column; gap: 6px; }
.alt { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; background: var(--surface); text-align: left; width: 100%; }
.alt .letter { font-family: var(--display); font-weight: 700; font-size: 20px; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); }
.alt.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.alt.on .letter { background: var(--accent); color: var(--accent-ink); }
.alt.busy { opacity: .55; }
.setlist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cells { display: grid; grid-template-columns: 1.15fr 1fr .9fr; gap: 3px; }
.cellw { display: flex; align-items: center; gap: 3px; min-width: 0; }
.cellw .u { font-size: 10px; color: var(--muted); font-weight: 500; }
.unit-sw { display: inline-flex; justify-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; }
.unit-sw button { border: none; background: transparent; border-radius: 5px; padding: 2px 8px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: none; letter-spacing: 0; }
.unit-sw button.on { background: var(--accent); color: var(--accent-ink); }
.cell { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 2px; text-align: center; font-family: var(--display); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cell::placeholder { color: var(--muted); opacity: .6; }
.cell:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.sl-row.cur .cell { border-color: var(--accent); }
.sl-row.done .cell { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.sl-row { display: grid; grid-template-columns: 28px minmax(0,1fr) 60px; gap: 4px; row-gap: 2px; align-items: center; padding: 8px 8px; border-top: 1px solid var(--line); font-size: 13.5px; }
.sl-row:first-child { border-top: none; }
.sl-row .num { font-family: var(--display); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sl-row small { display: block; font-size: 11px; color: var(--muted); }
.antes { align-self: stretch; margin: -8px -8px -8px 2px; padding: 0 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--surface-2); border-left: 1px solid var(--line); font-size: 11px; line-height: 1.3; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.antes b { font-family: var(--display); font-size: 14px; font-weight: 600; color: var(--ink); }
.sl-h .antes { margin-block: -6px; font-size: 10px; }
.chk { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--line); background: var(--surface); color: var(--muted); font-family: var(--display); font-weight: 700; font-size: 13px; display: grid; place-items: center; padding: 0; }
.chk.cur { border-color: var(--accent); color: var(--accent); }
.chk.on { background: var(--ok); border-color: var(--ok); color: var(--surface); font-size: 15px; }
.chk:disabled { opacity: .5; cursor: default; }
.sl-add { display: flex; padding: 0 8px; border-top: 1px solid var(--line); }
.sl-add button { border: none; background: transparent; color: var(--accent); font-weight: 600; font-size: 11.5px; padding: 5px 2px; }
.sl-swipe { position: relative; overflow: hidden; border-top: 1px solid var(--line); }
.sl-swipe .sl-row { border-top: none; background: var(--surface); position: relative; z-index: 1; transition: transform .2s ease; touch-action: pan-y; }
.sl-swipe .sl-row.cur { background: var(--accent-soft); }
.sl-swipe.open .sl-row { transform: translateX(-84px); }
.sl-del { position: absolute; top: 0; bottom: 0; right: 0; width: 84px; border: none; background: var(--bad); color: #fff; font-weight: 600; font-size: 13px; }
.sl-foot { font-size: 11.5px; color: var(--muted); margin-top: -4px; }
.sl-h { background: var(--surface-2); font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-block: 6px; }
.sl-row.cur { background: var(--accent-soft); }
.sl-row.cur .num:last-child { color: var(--accent); font-size: 14px; }
.sl-row.done .num:last-child { color: var(--ok); }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.opt-top { display: flex; justify-content: space-between; align-items: center; }
.opt-l { font-family: var(--display); font-weight: 700; font-size: 13px; width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; background: var(--surface-2); }
.opt-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.opt-dot.taken { background: var(--bad); }
.opt-n { font-size: 12.5px; font-weight: 600; line-height: 1.2; }
.opt-s { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt-b { font-size: 10px; font-weight: 700; color: var(--bad); text-transform: uppercase; letter-spacing: .05em; }
.opt.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
.opt.on .opt-l { background: var(--accent); color: var(--accent-ink); }
.opt.busy { opacity: .6; }
.opts.mini { gap: 4px; }
.opt-more { justify-content: center; align-items: center; font-weight: 700; font-size: 16px; padding: 0 !important; color: var(--muted); }
.opts.mini .opt { flex-direction: row; align-items: center; gap: 5px; padding: 5px 6px; border-radius: 9px; }
.opts.mini .opt-top { order: 0; }
.opts.mini .opt-l { width: 16px; height: 16px; font-size: 11px; border-radius: 4px; }
.opts.mini .opt-dot, .opts.mini .opt-s, .opts.mini .opt-b { display: none; }
.opts.mini .opt-n { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.opt.busy .opt-n { text-decoration: line-through; }
.alt.busy .name { text-decoration: line-through; }
.alt .name { font-weight: 600; font-size: 14.5px; }
.alt .sub { font-size: 12px; color: var(--muted); }
.state { font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
.state.free { background: var(--ok-soft); color: var(--ok); }
.state.taken { background: var(--bad-soft); color: var(--bad); }

.explain { background: var(--surface-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
.explain .row { display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 8px; }
.explain .k { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 2px; }

.btn { border: none; border-radius: 12px; padding: 13px 14px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface-2); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.block { width: 100%; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.last { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.last .val { font-family: var(--display); font-size: 20px; font-weight: 600; }
.note { border-radius: 10px; padding: 9px 11px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.ok { background: var(--ok-soft); color: var(--ok); }
.note.info { background: var(--accent-soft); color: var(--accent); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note b { font-weight: 700; }

/* registro */
.log { display: flex; flex-direction: column; gap: 12px; }
.guide { border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 4px 10px 10px 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.guide.fail { border-left-color: var(--bad); background: var(--bad-soft); }
.guide .g1 { font-family: var(--display); font-size: 19px; font-weight: 700; line-height: 1.1; }
.guide .g2 { font-size: 13px; color: var(--muted); }
.steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stepper { border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.stepper .lab { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.stepper .ctl { display: grid; grid-template-columns: 40px minmax(0,1fr) 40px; align-items: center; width: 100%; }
.stepper .ctl button { height: 40px; border: none; border-radius: 10px; background: var(--surface-2); font-size: 20px; font-weight: 600; }
.stepper .v { font-family: var(--display); font-size: 30px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.rir { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rir button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.rir button .big { font-family: var(--display); font-size: 22px; font-weight: 700; line-height: 1; }
.rir button .tiny { font-size: 10.5px; color: var(--muted); }
.rir button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rir button.on .tiny { color: var(--accent-ink); opacity: .85; }
.sets-done { display: flex; gap: 6px; flex-wrap: wrap; }
.set-pill { font-family: var(--display); font-size: 15px; font-weight: 600; background: var(--surface-2); border-radius: 8px; padding: 3px 8px; }
.set-pill.f { background: var(--bad-soft); color: var(--bad); }

.rest { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; }
.rest .t { font-family: var(--display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.rest button { background: transparent; border: 1px solid currentColor; border-radius: 8px; padding: 4px 10px; font-size: 12px; color: inherit; }

.banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.banner .btn { padding: 8px 10px; font-size: 13px; background: var(--warn); color: var(--surface); white-space: nowrap; }

/* tiempo */
.time-opts { display: flex; gap: 6px; flex-wrap: wrap; }
.time-opts button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.time-opts button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.plan-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); align-items: center; }
.plan-row:first-child { border-top: none; }
.plan-row .what { font-weight: 600; font-size: 14px; }
.plan-row .impact { font-size: 12.5px; color: var(--muted); }
.plan-row .tag-keep { color: var(--ok); font-weight: 600; font-size: 12px; }
.plan-row .tag-cut { color: var(--bad); font-weight: 600; font-size: 12px; }

/* semana */
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: flex; flex-direction: column; gap: 4px; }
.bar-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.bar-top .m { font-weight: 600; font-size: 14px; }
.bar-top .v { font-family: var(--display); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 14px; border-radius: 7px; background: var(--surface-2); overflow: hidden; }
.bar .zone { position: absolute; top: 0; bottom: 0; background: var(--ok-soft); border-left: 2px solid var(--ok); border-right: 2px solid var(--ok); }
.bar .proj { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 5px; background: var(--accent-soft); outline: 1px dashed var(--accent); outline-offset: -1px; }
.bar .fill { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 5px; background: var(--accent); }
.bar-row.behind .fill { background: var(--bad); }
.bar-row.behind .m::after { content: "Atrasado"; margin-left: 8px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--bad); background: var(--bad-soft); padding: 2px 6px; border-radius: 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 8px; border-radius: 3px; display: inline-block; }
.d4 { display: flex; flex-direction: column; }
.d4-row { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.d4-row:first-child { border-top: none; }
.d4-row .i { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--muted); }
.d4-row .s { font-family: var(--display); font-weight: 700; font-size: 18px; }

/* guía */
.rule { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rule > div { border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.rule .c { background: var(--accent-soft); }
.rule .a { background: var(--surface-2); }
.rule .big { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1; }
.scale { display: flex; flex-direction: column; gap: 4px; }
.scale-row { display: grid; grid-template-columns: 46px minmax(0,1fr); gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); font-size: 13.5px; }
.scale-row .k { font-family: var(--display); font-weight: 700; font-size: 20px; }
.scale-row.hl { background: var(--ok-soft); }
.scale-row.fl { background: var(--bad-soft); }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
details summary { cursor: pointer; font-weight: 600; font-size: 12px; color: var(--accent); }
details[open] summary { margin-bottom: 6px; }

/* hoja inferior */
.sheet-bg { position: fixed; inset: 0; background: rgba(5, 8, 12, .5); display: flex; align-items: flex-end; justify-content: center; z-index: 30; }
.sheet { background: var(--surface); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }

/* pestañas */

const EX = {

  mancPlana:{ n:'Press plano con mancuernas', eq:'Mancuernas', p:['pecho'], s:['tri','front'], why:'Mismo empuje horizontal y mismo músculo. Baja un poco más y cada brazo trabaja por su cuenta.', adj:'Cada mancuerna pesa cerca del 40% de la barra. Si haces 70 kg en barra, parte con 26-28 kg por mano.', tec:'Baja hasta sentir el estiramiento en el pecho, con los codos a unos 45° del cuerpo.', last:{w:28,r:[9,8,7],rir:[2,1,1],pos:1,d:'jue 2 nov'} },

  inclSmith:{ n:'Press inclinado en Smith o máquina', eq:'Máquina', p:['pecho'], s:['tri','front'], why:'Mismo ángulo de empuje y mismo músculo, con recorrido guiado.', adj:'Parte con el peso de las dos mancuernas sumadas, menos 10%.', tec:'Banco a 30°, la barra baja a la parte alta del pecho.', last:null, sugW:40 },
  flexPeso:{ n:'Flexiones con peso', eq:'Sin máquina', p:['pecho'], s:['tri','front'], why:'No hay que esperar a nadie. Mismo empuje y mismo músculo; súbele dificultad con un disco.', adj:'Si haces más de 15 sin peso, pide que te pongan un disco de 10 kg en la espalda.', tec:'Cuerpo recto como tabla, pecho casi al suelo en cada repetición.', last:null, sugW:10 },
  cruces:{ n:'Cruces en polea', eq:'Polea', p:['pecho'], s:[], why:'Mismo movimiento de cerrar los brazos que el pec deck, con tensión constante, y cambias el peso en segundos.', adj:'Si vienes del pec deck, el número no se compara. Busca un peso que te deje 12-15 con 1-2 en reserva.', tec:'Codos levemente doblados y fijos. Imagina que abrazas un árbol.', last:{w:15,r:[15,13],rir:[2,0],pos:3,d:'jue 16 nov'} },
  pecdeck:{ n:'Pec deck (apertura en máquina)', eq:'Máquina', p:['pecho'], s:[], why:'Mismo movimiento de apertura con el recorrido guiado. Fácil de aprender.', adj:'La primera vez busca un peso en que llegues a 12-15 con 1-2 en reserva.', tec:'Espalda pegada al respaldo, junta las manos sin chocar los brazos.', last:{w:45,r:[15,14],rir:[2,1],pos:3,d:'jue 9 nov'} },
  aperturas:{ n:'Aperturas con mancuernas', eq:'Mancuernas', p:['pecho'], s:[], why:'Mismo patrón de cerrar los brazos. Más tensión cuando el brazo está abierto y menos al cerrar.', adj:'Usa 30-40% menos que en la polea por lado. Parte liviano: el estiramiento abajo es fuerte.', tec:'Baja abriendo los brazos hasta la altura del pecho, no más.', last:null, sugW:10 },
  latMan:{ n:'Elevaciones laterales con mancuernas', eq:'Mancuernas', p:['lat'], s:[], why:'El ejercicio más directo para el hombro lateral, que da el ancho de hombros.', adj:'Peso liviano y muchas repeticiones. Si balanceas el cuerpo, baja el peso.', tec:'Sube los brazos hacia los lados hasta la altura de los hombros, con el codo apenas doblado.', last:{w:10,r:[15,14,12],rir:[2,1,0],pos:4,d:'jue 16 nov'} },
  latPolea:{ n:'Laterales en polea', eq:'Polea', p:['lat'], s:[], why:'Mismo movimiento. La polea mantiene tensión también abajo, donde la mancuerna no pesa.', adj:'A un brazo, parte con 5-7 kg.', tec:'Polea baja, cable por delante del cuerpo, sube hacia el lado.', last:null, sugW:5 },
  latMaq:{ n:'Máquina de laterales', eq:'Máquina', p:['lat'], s:[], why:'Mismo músculo con recorrido guiado.', adj:'La primera vez busca un peso que te deje 15-20.', tec:'Codos contra los rodillos, sube hasta la altura del hombro.', last:null, sugW:20 },
  pressHom:{ n:'Press de hombro con mancuernas', eq:'Mancuernas', p:['front'], s:['tri','lat'], why:'Empuje vertical: trabaja el hombro frontal y ayuda al lateral y al tríceps.', adj:'Sentado con respaldo, para no arquear la espalda.', tec:'Empuja hacia arriba sin chocar las mancuernas arriba.', last:{w:22,r:[12,11],rir:[3,3],jump:true,pos:5,d:'jue 16 nov'} },
  pressHomMaq:{ n:'Press de hombro en máquina', eq:'Máquina', p:['front'], s:['tri','lat'], why:'Mismo empuje vertical con recorrido guiado.', adj:'Parte con el peso de las dos mancuernas sumadas.', tec:'Asiento a una altura en que las manijas queden a la altura de los hombros.', last:null, sugW:40 },
  arnold:{ n:'Press Arnold', eq:'Mancuernas', p:['front'], s:['tri','lat'], why:'Mismo empuje vertical; el giro de muñeca suma recorrido para el hombro.', adj:'Usa 10-15% menos que en el press normal.', tec:'Parte con las palmas hacia ti y gíralas mientras subes.', last:null, sugW:16 },
  triPolea:{ n:'Tríceps en polea', eq:'Polea', p:['tri'], s:[], why:'Aísla el tríceps sin cansar el pecho ni el hombro.', adj:'Con cuerda o barra recta: elige el que no te moleste el codo.', tec:'Codos pegados al cuerpo; solo se mueve el antebrazo.', last:{w:35,r:[10,8,7],rir:[1,0,0],jump:true,pos:6,d:'jue 16 nov'} },
  fondos:{ n:'Fondos asistidos', eq:'Máquina', p:['tri'], s:['pecho'], why:'Mismo músculo usando tu cuerpo como peso. El pecho ayuda un poco.', adj:'En la máquina asistida, más contrapeso es más fácil. Parte con uno que te deje 10-15.', tec:'Cuerpo vertical para cargar más el tríceps.', last:null, sugW:30 },
  frances:{ n:'Press francés', eq:'Barra Z', p:['tri'], s:[], why:'Trabaja el tríceps estirado, que es donde más crece. Solo necesitas una barra Z.', adj:'Parte con la barra Z vacía o con poco peso; cuida los codos.', tec:'Baja la barra hacia la frente doblando solo los codos.', last:null, sugW:20 },
  sentadilla:{ n:'Sentadilla con barra', eq:'Barra', p:['cuad'], s:['isq'], why:'Compuesto base de pierna.', adj:'Parte con un peso que te deje 8 con 2 en reserva.', tec:'Pies al ancho de hombros, baja con la espalda neutra.', last:null, sugW:60 },
  prensa:{ n:'Prensa de piernas', eq:'Máquina', p:['cuad'], s:['isq'], why:'Mismo músculo que la sentadilla, con la espalda apoyada.', adj:'El peso de la prensa no se compara con la barra.', tec:'No despegues la espalda baja del respaldo.', last:null, sugW:120 },
  remoBarra:{ n:'Remo con barra', eq:'Barra', p:['espalda'], s:['bi','post'], why:'Tirón horizontal pesado.', adj:'Espalda casi paralela al suelo.', tec:'Lleva la barra al ombligo.', last:null, sugW:50 },
  dominadas:{ n:'Dominadas', eq:'Barra fija', p:['espalda'], s:['bi'], why:'Tirón vertical con tu peso.', adj:'Si no llegas a 6, usa la máquina asistida.', tec:'Baja completo, sube hasta el mentón.', last:null, sugW:0 },
  curlZ:{ n:'Curl con barra Z', eq:'Barra Z', p:['bi'], s:[], why:'Aísla el bíceps.', adj:'Sin balancear el cuerpo.', tec:'Codos quietos al costado.', last:null, sugW:25 },
  facePull:{ n:'Face pull', eq:'Polea', p:['post'], s:[], why:'Trabaja el hombro posterior sin cansar la espalda.', adj:'Peso liviano, controla la vuelta.', tec:'Tira la cuerda hacia la frente abriendo los codos.', last:null, sugW:15 },
  pantorrilla:{ n:'Pantorrillas de pie', eq:'Máquina', p:['pant'], s:[], why:'Aísla la pantorrilla.', adj:'Pausa de un segundo abajo.', tec:'Baja hasta estirar y sube en punta de pies.', last:null, sugW:60 }
};

const DAY = [
  { name:'Press pesado', sets:3, reps:[6,8], prio:'alta', type:'comp', alts:['banca','mancPlana','smith'] },
  { name:'Press inclinado', sets:3, reps:[8,10], prio:'alta', type:'comp', alts:['incl','inclSmith','flexPeso'] },
  { name:'Aislado pecho', sets:2, reps:[12,15], prio:'baja', type:'iso', alts:['cruces','pecdeck','aperturas'] },
  { name:'Hombro lateral', sets:3, reps:[12,20], prio:'baja', type:'iso', alts:['latMan','latPolea','latMaq'] },
  { name:'Press hombro', sets:2, reps:[8,12], prio:'media', type:'comp', alts:['pressHom','pressHomMaq','arnold'] },
  { name:'Tríceps', sets:3, reps:[10,15], prio:'baja', type:'iso', alts:['triPolea','fondos','frances'] }
];
const SHORT = { banca:'Banca barra', mancPlana:'Mancuernas plano', smith:'Máquina / Smith', incl:'Inclinado manc.', inclSmith:'Inclinado Smith', flexPeso:'Flexiones c/ peso', cruces:'Cruces polea', pecdeck:'Pec deck', aperturas:'Aperturas manc.', latMan:'Laterales manc.', latPolea:'Laterales polea', latMaq:'Laterales máq.', pressHom:'Press manc.', pressHomMaq:'Press máquina', arnold:'Arnold', triPolea:'Polea', fondos:'Fondos asist.', frances:'Press francés' };
const PRANK = { alta:3, media:2, baja:1 };
const afterAltEdit = () => { if (S.tab === 'rutina') { resetSession(); return; } S.alt[S.ed] = 0; DAY[S.ed].alts.forEach(x => delete S.busy[x]); S.draft = makeDraft(S.si); S.swap = null; };
const resetSession = () => { Object.assign(S, { chosen:{}, extra:{}, si:0, alt:{}, busy:{}, logs:[], order:[], returnTo:null, minutes:null, msg:null, swap:null, restEnd:null, sheet:null }); S.draft = makeDraft(0); };
const move = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
const D4LIB = { cuad:'Prensa o extensión de cuádriceps', pant:'Pantorrillas de pie', pecho:'Press plano con mancuernas', lat:'Elevaciones laterales', post:'Face pull', tri:'Tríceps en polea', bi:'Curl en polea', espalda:'Remo en polea', isq:'Curl femoral' };

// ---------- Estado ----------
const S = {
  tab:'hoy', tags:true, pre:{}, chosen:{}, unit:'kg', si:0, alt:{}, busy:{}, logs:[], order:[], returnTo:null,
  minutes:null, draft:null, msg:null, swap:null, restEnd:null, restLen:0, sheet:null, showWhy:false
};

const fmt = n => (Math.round(n*10)/10).toString().replace('.', ',');
const toU = kg => kg == null || kg === '' ? kg : S.unit === 'lb' ? Math.round(kg * 2.20462 * 2) / 2 : kg;
const fromU = v => S.unit === 'lb' ? Math.round(v / 2.20462 * 100) / 100 : v;
const altIdx = si => S.alt[si] ?? 0;
const exOf = si => EX[DAY[si].alts[altIdx(si)]];
const exIdOf = si => DAY[si].alts[altIdx(si)];
const logsFor = si => S.logs.filter(l => l.si === si);
const nS = si => DAY[si].sets + ((S.extra || {})[si] || 0);
const isDone = si => logsFor(si).length >= nS(si);
const pos = si => { const i = S.order.indexOf(si); return i >= 0 ? i + 1 : S.order.length + 1; };
const muscles = si => { const e = exOf(si); return [...e.p, ...e.s]; };
const share = (a, b) => muscles(a).filter(m => muscles(b).includes(m));
const restSecs = si => DAY[si].type === 'comp' ? 150 : 75;
const slotMins = (si, setsLeft) => (setsLeft ?? nS(si)) * (45 + restSecs(si)) / 60 + 2;

// Sobrecarga progresiva (progresión doble): +1 rep por serie hasta el tope del rango;
// si la vez anterior llegaste al tope en todas, sube el peso y vuelve al piso del rango.
// Regla de progresión:
// - Cada serie busca 1-2 en reserva; es normal que las reps bajen de serie en serie (10, 9, 8).
// - Se sube el peso cuando la ÚLTIMA serie llega al tope del rango con 1-2 en reserva (en aislados, hasta el fallo).
// - El salto es ~5-8% (o el salto mínimo del equipo); con el peso nuevo la última serie cae cerca del mínimo.
// - La sesión siguiente a un salto lo valida: 3+ en reserva = salto chico; bajo el mínimo = salto grande.
const stepOf = e => e.eq === 'Mancuernas' ? 2 : (e.eq === 'Sin máquina' ? 5 : 2.5);
const roundTo = (x, st) => Math.round(x / st) * st;
function plan(si) {
  const d = DAY[si], e = exOf(si), [lo, hi] = d.reps, n = nS(si);
  if (!e.last) return { why: 'nuevo', w: e.sugW ?? 0, reps: Array.from({length: n}, () => lo) };
  const L = e.last, lr = L.r, rr = L.rir || lr.map(() => 2), k = lr.length - 1, st = stepOf(e);
  const descend = Array.from({length: n}, (_, i) => Math.min(hi, lo + (n - 1 - i)));
  // validación de un salto reciente
  if (L.jump && lr.some(x => x < lo)) {
    const w = Math.max(st, Math.min(L.w - st, roundTo(L.w * 0.95, st)));
    return { why: 'grande', w, reps: descend, from: L.w };
  }
  if (L.jump && rr[k] >= 3) {
    const w = Math.max(L.w + st, roundTo(L.w * 1.05, st));
    return { why: 'chico', w, reps: descend, from: L.w };
  }
  // subir peso: la última serie llegó al tope con 1-2 en reserva (aislados: 0-2)
  const minRir = d.type === 'iso' ? 0 : 1;
  if (lr[k] >= hi && rr[k] >= minRir && rr[k] <= 2) {
    const w = Math.max(L.w + st, roundTo(L.w * 1.06, st));
    return { why: 'peso', w, reps: descend, from: L.w, pct: Math.round((w / L.w - 1) * 100) };
  }
  // mismo peso: suma una rep donde sobró reserva
  const reps = Array.from({length: n}, (_, i) => {
    const base = lr[i] ?? lr[k], ri = rr[i] ?? rr[k];
    return Math.min(hi, Math.max(base, base + (ri >= 3 ? 2 : ri >= 2 ? 1 : 0)));
  });
  return { why: 'rep', w: L.w, reps };
}
function target(si, i) { const p = plan(si); return { w: p.w, r: p.reps[i] ?? p.reps[p.reps.length - 1], why: p.why }; }
const defRir = (si, i) => DAY[si].type === 'iso' && i === nS(si) - 1 ? 0 : 2;
function makeDraft(si) {
  const n = logsFor(si).length, prev = logsFor(si).slice(-1)[0], t = target(si, n);
  const w = prev ? prev.w : t.w;
  const r = t.r;
  const pre = S.pre[`${si}-${n}`] || {};
  return { w: pre.w ?? w, r: pre.r ?? r, rir: pre.rir ?? defRir(si, n) };
}

function weekly(includePlan) {
  const t = { ...BASE };
  const add = (e, k) => { e.p.forEach(m => t[m] += k); e.s.forEach(m => t[m] += k * 0.5); };
  S.logs.forEach(l => add(EX[l.ex], 1));
  if (includePlan) DAY.forEach((d, si) => {
    if (cutSet().has(si)) return;
    const left = nS(si) - logsFor(si).length; if (left > 0) add(exOf(si), left);
  });
  return t;
}

function timePlan() {
  const pending = DAY.map((d, si) => si).filter(si => !isDone(si));
  const rows = pending.map(si => ({ si, mins: slotMins(si, nS(si) - logsFor(si).length) }));
  const cut = new Set();
  if (S.minutes != null) {
    let total = rows.reduce((a, r) => a + r.mins, 0);
    const order = [...rows].filter(r => logsFor(r.si).length === 0 && r.si !== S.si)
      .sort((a, b) => PRANK[DAY[a.si].prio] - PRANK[DAY[b.si].prio] || b.si - a.si);
    for (const r of order) { if (total <= S.minutes) break; if (DAY[r.si].prio === 'alta') break; cut.add(r.si); total -= r.mins; }
  }
  return { rows, cut };
}
const cutSet = () => timePlan().cut;

function findFiller(si) {
  const behind = weekly(false);
  return DAY.map((d, j) => j).filter(j => j !== si && !isDone(j) && DAY[j].type === 'iso' && logsFor(j).length === 0 && share(j, si).length === 0)
    .sort((a, b) => (behind[exOf(a).p[0]] / (META[exOf(a).p[0]]?.[0] || 1)) - (behind[exOf(b).p[0]] / (META[exOf(b).p[0]]?.[0] || 1)))[0];
}

function conflictFor(j) {
  // ¿Hay un ejercicio más importante, pendiente, que use los mismos músculos?
  const hit = DAY.map((d, k) => k).find(k => k !== j && !isDone(k) && logsFor(k).length === 0 && PRANK[DAY[k].prio] > PRANK[DAY[j].prio] && share(j, k).length > 0);
  return hit;
}

function guideFor(si) {
  const d = DAY[si], n = logsFor(si).length + 1, last = n === nS(si);
  if (d.type === 'comp') return { cls:'', g1:`Serie ${n} de ${nS(si)}: termina con 1-2 en el tanque`, g2:`Compuesto. No llegues al fallo en ninguna serie. Descansa 2-3 min.` };
  if (!last) return { cls:'', g1:`Serie ${n} de ${nS(si)}: deja 1-2 en reserva`, g2:`Aislado. Guarda el fallo para la última serie. Descansa 60-90 s.` };
  return { cls:'fail', g1:`Última serie: puedes llegar al fallo`, g2:`Aislado. Dalo todo, hasta que no salga una repetición más con buena técnica.` };
}

function feedback(si, rir) {
  const d = DAY[si], n = logsFor(si).length, last = n === nS(si), e = exOf(si), lg = logsFor(si)[n - 1];
  if (e.last && lg && lg.w > e.last.w) {
    if (lg.r < d.reps[0]) return { cls:'warn', t:'El salto de peso fue muy grande.', s:`No llegaste al mínimo del rango (${d.reps[0]}). Baja un poco el peso (2,5-5%) en la próxima serie.` };
    if (rir >= 3) return { cls:'warn', t:'El salto de peso quedó chico.', s:'Te sobraron 3 o más repeticiones. La próxima vez sube un poco más.' };
  }
  if (d.type === 'comp') {
    if (rir === 0) return { cls:'bad', t:'Llegaste al fallo en un compuesto.', s:'Descansa los 3 minutos completos. Si en la próxima no llegas al rango, baja 5% el peso. Aquí el fallo suma poco músculo y mucho cansancio para las series que vienen.' };
    if (rir >= 3) return { cls:'warn', t:'Te sobraron 3 o más repeticiones.', s:'En la próxima serie sube 2,5 kg o haz más repeticiones, hasta quedar a 1-2 del fallo.' };
    return { cls:'ok', t:'Justo en la zona: 1-2 en reserva.', s:'Así sumas estímulo sin quemar las series que siguen.' };
  }
  if (!last && rir === 0) return { cls:'warn', t:'Todavía no era la última serie.', s:'Guarda el fallo para el final y descansa 90 s antes de la próxima.' };
  if (last && rir >= 2) return { cls:'warn', t:'Era la última y te quedó margen.', s:'En la última serie de un aislado puedes apretar más. La próxima vez, dalo todo.' };
  if (last) return { cls:'ok', t:'Así se hace la última serie de un aislado.', s:'Cerca del fallo, sin perder la técnica.' };
  return { cls:'ok', t:'Bien, 1-2 en reserva.', s:'La última serie es la que puedes llevar al fallo.' };
}

function progressionNote(si) {
  const d = DAY[si], ls = logsFor(si), e = exOf(si);
  if (ls.length < nS(si)) return null;
  const l = ls[ls.length - 1], minRir = d.type === 'iso' ? 0 : 1;
  if (l.r >= d.reps[1] && l.rir >= minRir && l.rir <= 2) {
    const st = stepOf(e), w = Math.max(l.w + st, roundTo(l.w * 1.06, st));
    return `La última serie llegó al tope (${d.reps[1]}) con ${l.rir} en reserva. La próxima vez sube a ${fmt(toU(w))} ${S.unit} (+${Math.round((w / l.w - 1) * 100)}%): la última serie debería caer cerca de ${d.reps[0]}.`;
  }
  return null;
}

// ---------- Acciones ----------
function act(a, v) {
  const si = S.si;
  if (a === 'noop') return;
  switch (a) {
    case 'tab': S.tab = v; window.scrollTo(0, 0); break;
    case 'tags': S.tags = !S.tags; break;
    case 'pick': {
      const k = +v, id = DAY[si].alts[k];
      if (k === altIdx(si) && !S.busy[id]) { act('busy'); return; }   // tocar la elegida otra vez = está ocupada
      S.chosen[si] = true; delete S.busy[id]; S.alt[si] = k; S.draft = makeDraft(si); S.swap = null; S.showWhy = false; break;
    }
    case 'whyToggle': S.showWhy = !S.showWhy; break;
    case 'busy': {
      const id = exIdOf(si); S.busy[id] = true;
      const next = DAY[si].alts.findIndex(x => !S.busy[x]);
      if (next >= 0) { const from = EX[id].n; S.alt[si] = next; S.draft = makeDraft(si); S.swap = { from, to: exOf(si).n }; S.showWhy = true; }
      else S.swap = { none: true };
      break;
    }
    case 'free': { DAY[si].alts.forEach(x => delete S.busy[x]); S.swap = null; break; }
    case 'filler': {
      const j = +v; S.returnTo = si; S.si = j; S.swap = null; S.draft = makeDraft(j); S.showWhy = false; window.scrollTo(0, 0); break;
    }
    case 'back': {
      const r = S.returnTo; S.returnTo = null; DAY[r].alts.forEach(x => delete S.busy[x]); S.alt[r] = 0;
      S.si = r; S.draft = makeDraft(r); S.swap = null; window.scrollTo(0, 0); break;
    }
    case 'jump': {
      const j = +v; if (j === si) break;
      const c = conflictFor(j);
      if (c != null && !isDone(j)) {
        const m = share(j, c).filter(x => x !== 'front').map(x => MUS[x].toLowerCase());
        S.sheet = { title:`${DAY[j].name} antes de ${DAY[c].name}`, body:`Este ejercicio cansa ${m.join(' y ') || 'los mismos músculos'}, que vas a necesitar en ${DAY[c].name.toLowerCase()} (prioridad alta). Es posible que rindas menos ahí y no notes el progreso que esperas.`, foot:'Si igual lo haces, la app guarda el orden y ajusta la comparación con la vez anterior.', go:j };
      } else { S.si = j; S.draft = makeDraft(j); S.swap = null; S.showWhy = false; }
      break;
    }
    case 'sheetGo': { const j = S.sheet.go; S.sheet = null; S.si = j; S.draft = makeDraft(j); S.swap = null; S.showWhy = false; window.scrollTo(0, 0); break; }
    case 'sheetClose': S.sheet = null; break;
    case 'w': S.draft.w = Math.max(0, S.draft.w + (+v)); break;
    case 'r': S.draft.r = Math.max(0, S.draft.r + (+v)); break;
    case 'rir': S.draft.rir = +v; break;
    case 'log': {
      if (S.draft.rir == null) { S.msg = { cls:'info', t:'Falta el RIR.', s:'Anota en la casilla RIR cuántas repeticiones más podías hacer.' }; break; }
      if (!S.order.includes(si)) S.order.push(si);
      S.logs.push({ si, ex: exIdOf(si), w: S.draft.w, r: S.draft.r, rir: S.draft.rir });
      S.msg = feedback(si, S.draft.rir);
      const pn = progressionNote(si); if (pn) S.msg = { cls:'info', t:'Sube el peso la próxima vez.', s:pn };
      S.restLen = restSecs(si); S.restEnd = Date.now() + S.restLen * 1000;
      S.draft = makeDraft(si); S.swap = null;
      break;
    }
    case 'next': {
      S.msg = null; S.restEnd = null;
      if (S.returnTo != null) { act('back'); return; }
      const nx = DAY.map((d, j) => j).find(j => !isDone(j) && !cutSet().has(j));
      if (nx != null) { S.si = nx; S.draft = makeDraft(nx); S.showWhy = false; window.scrollTo(0, 0); }
      break;
    }
    case 'undo': { const l = S.logs.pop(); if (l && !logsFor(l.si).length) S.order = S.order.filter(x => x !== l.si); S.msg = null; S.restEnd = null; S.draft = makeDraft(si); break; }
    case 'skipRest': S.restEnd = null; break;
    case 'unit': S.unit = v; break;
    case 'min': S.minutes = S.minutes === +v ? null : +v; break;
    case 'reset': resetSession(); break;
    // --- editor de rutina ---
    case 'edOpen': S.ed = S.ed === +v ? null : +v; S.pick = null; break;
    case 'edMove': { const [i, d] = v.split(',').map(Number); move(DAY, i, d); if (S.ed === i) S.ed = i + d >= 0 && i + d < DAY.length ? i + d : i; resetSession(); break; }
    case 'edDel': { if (DAY.length > 1) { DAY.splice(+v, 1); S.ed = null; resetSession(); } break; }
    case 'edSets': { const d = DAY[S.ed]; d.sets = Math.min(8, Math.max(1, d.sets + (+v))); resetSession(); break; }
    case 'edLo': { const d = DAY[S.ed]; d.reps[0] = Math.max(1, Math.min(d.reps[1], d.reps[0] + (+v))); break; }
    case 'edHi': { const d = DAY[S.ed]; d.reps[1] = Math.max(d.reps[0], Math.min(30, d.reps[1] + (+v))); break; }
    case 'edPrio': DAY[S.ed].prio = v; break;
    case 'edType': DAY[S.ed].type = v; break;
    case 'altMove': { const [i, d] = v.split(',').map(Number); move(DAY[S.ed].alts, i, d); afterAltEdit(); break; }
    case 'altDel': { const a = DAY[S.ed].alts; if (a.length > 1) { a.splice(+v, 1); afterAltEdit(); } break; }
    case 'addSet': S.extra = S.extra || {}; S.extra[si] = (S.extra[si] || 0) + 1; S.draft = makeDraft(si); break;
    case 'delSetAt': {
      const i = +v, l = logsFor(si)[i];
      if (l) { S.logs.splice(S.logs.indexOf(l), 1); if (!logsFor(si).length) S.order = S.order.filter(x => x !== si); }
      if (nS(si) > 1) { S.extra = S.extra || {}; S.extra[si] = (S.extra[si] || 0) - 1; }
      S.swiped = null; S.msg = null; S.draft = makeDraft(si); break;
    }
    case 'delSet': if (nS(si) > logsFor(si).length && nS(si) > 1) { S.extra = S.extra || {}; S.extra[si] = (S.extra[si] || 0) - 1; } break;
    case 'prioSheet': S.prioSheet = true; break;
    case 'prioClose': S.prioSheet = false; break;
    case 'altSheet': S.ed = si; S.altSheet = true; break;
    case 'altSheetClose': S.altSheet = false; break;
    case 'pickOpen': S.pick = v; S.q = ''; break;
    case 'pickClose': S.pick = null; break;
    case 'pickEx': {
      const e = EX[v];
      if (S.pick === 'new') {
        DAY.push({ name: e.n.split(' ').slice(0, 2).join(' '), sets: 3, reps: e.s.length ? [8,10] : [12,15], prio: e.s.length ? 'alta' : 'baja', type: e.s.length ? 'comp' : 'iso', alts: [v] });
        S.ed = DAY.length - 1;
        S.pick = null; resetSession(); break;
      } else if (DAY[S.ed].alts.length < MAXALT && !DAY[S.ed].alts.includes(v)) DAY[S.ed].alts.push(v);
      S.pick = null; afterAltEdit(); break;
    }
  }
  render();
}

function viewSemana() {
  const now = weekly(false), proj = weekly(true);
  const keys = Object.keys(META);
  const maxV = 18;
  const ratio = k => proj[k] / META[k][0];
  const behindK = [...keys].sort((a,b)=>ratio(a)-ratio(b)).slice(0,1);
  const bars = keys.map(k => {
    const [lo, hi] = META[k], b = proj[k] < lo;
    return `<div class="bar-row ${b && behindK.includes(k) ? 'behind' : ''}">
      <div class="bar-top"><span class="m">${MUS[k]}</span><span class="v">${fmt(now[k])}<span class="muted small"> / ${lo}-${hi}${proj[k] > now[k] ? ` · al cerrar hoy ${fmt(proj[k])}` : ''}</span></span></div>
      <div class="bar"><span class="zone" style="left:${lo/maxV*100}%;width:${(hi-lo)/maxV*100}%"></span><span class="proj" style="width:${Math.min(proj[k],maxV)/maxV*100}%"></span><span class="fill" style="width:${Math.min(now[k],maxV)/maxV*100}%"></span></div></div>`;
  }).join('');

  // Día 4
  const def = keys.map(k => ({ k, d: META[k][0] - proj[k], r: proj[k] / META[k][0] })).filter(x => x.d > 0.5).sort((a,b)=>a.r-b.r).slice(0,5);
  const d4 = def.length ? def.map((x,i)=>`<div class="d4-row"><span class="i">${i+1}</span><div><div style="font-weight:600">${D4LIB[x.k]}</div><div class="small muted">${MUS[x.k]}: faltan ${fmt(x.d)} series</div></div><span class="s">${Math.min(4, Math.max(2, Math.round(x.d)))} series</span></div>`).join('')
    : `<p class="small">No falta nada: segunda dosis liviana de tren superior (1 press, 1 remo, 1 lateral, 1 de brazos, 2-3 series cada uno).</p>`;

  return `
    <div><span class="eyebrow">Semana del 20 al 26 de noviembre</span><h1>Series duras por músculo</h1></div>
    <p class="small muted">Hecho: día 2 (lunes) y día 3 (miércoles, recortado). Hoy jueves: día 1. Lo que registres en Hoy se suma aquí al instante.</p>
    <section class="card">
      <div class="legend"><span><i style="background:var(--accent)"></i>Hecho</span><span><i style="background:var(--accent-soft);outline:1px dashed var(--accent)"></i>Si terminas hoy</span><span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>Meta</span></div>
      <div class="bars">${bars}</div>
      ${tag('no saber cuántas series duras llevas por músculo')}
    </section>
    <section class="card">
      <div><span class="eyebrow">Cómo se cuenta</span><h3>No todas las series valen lo mismo</h3></div>
      <p class="small">Una serie suma <b>1</b> al músculo principal y <b>0,5</b> a los que ayudan. Una serie de press de banca suma 1 a pecho y 0,5 a tríceps. Por eso, si recortas tríceps un día de press, no quedas en cero.</p>
      ${tag('tratar una serie de curl igual que una de dominadas')}
    </section>
    <section class="card">
      <div><span class="eyebrow">Día 4 de rescate · sábado</span><h3>Completa lo que va atrasado</h3></div>
      <div class="d4">${d4}</div>
      <p class="small muted">Se calcula con lo que llevarías al terminar hoy. Si recortas algo, aparece aquí.</p>
      ${tag('que un músculo pase dos semanas sin trabajarse por saltarte un día')}
    </section>`;
}

function viewGuia() {
  return `
    <div><span class="eyebrow">Guía de esfuerzo</span><h1>Qué tan cerca del fallo</h1></div>
    <p>El fallo es cuando ya no sale ni una repetición más con buena técnica. Llegar ahí en cada serie no te hace crecer más: te cansa mucho más, te obliga a descansar más y baja el rendimiento de las series que siguen.</p>
    <section class="card">
      <div><span class="eyebrow">La pregunta después de cada serie</span><h3>¿Cuántas más podías hacer?</h3></div>
      <div class="scale">
        <div class="scale-row"><span class="k">3+</span><span>Fue fácil. Sube el peso o haz más repeticiones.</span></div>
        <div class="scale-row hl"><span class="k">2</span><span>Zona buena para compuestos.</span></div>
        <div class="scale-row hl"><span class="k">1</span><span>Zona buena para casi todo.</span></div>
        <div class="scale-row fl"><span class="k">0</span><span>Fallo. Solo en la última serie de un aislado.</span></div>
      </div>
      <p class="small muted">A esto se le llama RIR (repeticiones en reserva). En la app solo tocas el número.</p>
    </section>
    <section class="rule">
      <div class="c"><span class="eyebrow">Compuestos</span><span class="big">1-2 en reserva</span><span class="small">Sentadilla, press, remo, dominadas, peso muerto. Nunca al fallo, ni en la última serie. Descansa 2-3 min.</span></div>
      <div class="a"><span class="eyebrow">Aislados</span><span class="big">Fallo al final</span><span class="small">Laterales, curl, tríceps, pantorrillas. 1-2 en reserva hasta la última serie; en esa, dalo todo. Descansa 60-90 s.</span></div>
    </section>
    <section class="card">
      <h3>Por qué no fallar en la sentadilla</h3>
      <ul class="plain small">
        <li>Mueve mucho peso y muchos músculos a la vez: el fallo cansa todo el cuerpo, no solo la pierna.</li>
        <li>Quedarte a 1-2 del fallo da casi el mismo estímulo con mucho menos cansancio.</li>
        <li>Si fallas en la primera serie, la segunda y la tercera salen peor, y terminas con menos trabajo total.</li>
        <li>Con la técnica rota y peso alto, aumenta el riesgo de lesión.</li>
      </ul>
      <p class="small muted">En un aislado como el curl el peso es bajo y el cansancio queda en un solo músculo, por eso ahí sí conviene apretar al final.</p>
    </section>
    <section class="card">
      <h3>Cómo subir de peso</h3>
      <ul class="plain small">
        <li>Cada serie busca quedar a 1-2 del fallo. Por el cansancio, las repeticiones bajan de serie en serie (por ejemplo 10, 9, 8). Es normal.</li>
        <li>Subes el peso cuando la <b>última</b> serie llega al tope del rango con 1-2 en reserva. No hace falta que todas lleguen al tope.</li>
        <li>El salto es de 5-8% (o el mínimo que permita el equipo). Con el peso nuevo, la última serie cae cerca del mínimo del rango.</li>
        <li>La sesión siguiente valida el salto: si te sobran 3 o más, fue chico y subes más; si no llegas al mínimo, fue grande y bajas un poco.</li>
        <li>En compuestos descansa 2-3 min para que las reps caigan menos entre series.</li>
      </ul>
      <p class="small muted">Si en una serie no llegas al rango, lo mejor es descansar más. Bajar el peso y seguir (serie descendente) también vale. Cada 5-6 semanas, una semana liviana.</p>
    </section>
    ${tag('entrenar todo al fallo por no saber que hay una mejor forma')}`;
}

function pickerHtml() {
  const used = S.pick === 'new' ? [] : DAY[S.ed].alts;
  const ref = S.pick === 'new' ? null : EX[DAY[S.ed].alts[0]];
  const q = (S.q || '').toLowerCase();
  let list = Object.entries(EX).filter(([id, e]) => !used.includes(id) && (!q || e.n.toLowerCase().includes(q) || e.eq.toLowerCase().includes(q) || e.p.some(m => MUS[m].toLowerCase().includes(q))));
  if (ref) list.sort((a, b) => (b[1].p[0] === ref.p[0]) - (a[1].p[0] === ref.p[0]));
  return list.slice(0, 12).map(([id, e]) => `<button class="alt" data-a="pickEx" data-v="${id}"><span class="letter">+</span><span style="min-width:0"><span class="name">${e.n}</span><br><span class="sub">${e.eq} · ${e.p.map(m=>MUS[m]).join(', ')}${e.s.length ? ` (+ ${e.s.map(m=>MUS[m].toLowerCase()).join(', ')})` : ''}</span></span>${ref && e.p[0] === ref.p[0] ? '<span class="state free">Mismo músculo</span>' : '<span></span>'}</button>`).join('') || '<p class="small muted">No hay coincidencias.</p>';
}

const PRIO_TXT = { alta: 'Compuesto pesado. Se protege: nunca se recorta si falta tiempo.', media: 'Compuesto liviano. Se recorta solo si no alcanza con sacar los de prioridad baja.', baja: 'Aislado. Es lo primero que se recorta si falta tiempo; los compuestos ya lo trabajan de forma indirecta.' };
const prioSvg = lvl => { const n = { alta: 3, media: 2, baja: 1 }[lvl]; return `<svg viewBox="0 0 18 16" aria-hidden="true">${[0,1,2].map(i => `<rect x="${i*6+1}" y="${12 - i*5}" width="4" height="${4 + i*5}" rx="1" fill="currentColor" opacity="${i < n ? 1 : .25}"/>`).join('')}</svg>`; };
const prioIcon = lvl => `<button class="pico ${lvl}" data-a="prioSheet" aria-label="Prioridad ${lvl}">${prioSvg(lvl)}</button>`;
const LET = 'ABCD', MAXALT = 4;
const altRows = d => d.alts.map((a, k) => `<div class="alt"><span class="letter">${LET[k]}</span><span style="min-width:0"><span class="name">${EX[a].n}</span><br><span class="sub">${EX[a].eq} · ${EX[a].p.map(m=>MUS[m]).join(', ')}</span></span>
        <span class="ed-move"><button data-a="altMove" data-v="${k},-1" aria-label="Subir" ${k===0?'disabled':''}>↑</button><button data-a="altMove" data-v="${k},1" aria-label="Bajar" ${k===d.alts.length-1?'disabled':''}>↓</button><button data-a="altDel" data-v="${k}" aria-label="Quitar" ${d.alts.length===1?'disabled':''}>✕</button></span></div>`).join('');
function viewRutina() {
  const slots = DAY.map((d, i) => {
    const open = S.ed === i;
    const head = `<div class="ed-head">
        <button class="ed-title" data-a="edOpen" data-v="${i}"><span class="num ed-n">${i+1}</span><span style="min-width:0"><b>${d.name}</b><br><span class="small muted">${d.sets}×${d.reps[0]}-${d.reps[1]} · ${d.alts.map(a => EX[a].n).join(' / ')}</span></span></button>
        <span class="ed-move"><button data-a="edMove" data-v="${i},-1" aria-label="Subir" ${i===0?'disabled':''}>↑</button><button data-a="edMove" data-v="${i},1" aria-label="Bajar" ${i===DAY.length-1?'disabled':''}>↓</button></span>
      </div>`;
    if (!open) return `<section class="card ed">${head}</section>`;
    const alts = altRows(d);
    const seg = (act, cur, opts) => `<div class="seg">${opts.map(([v,l]) => `<button class="${cur===v?'on':''}" data-a="${act}" data-v="${v}">${l}</button>`).join('')}</div>`;
    const step = (lab, act, val) => `<div class="stepper"><span class="lab">${lab}</span><div class="ctl"><button data-a="${act}" data-v="-1">−</button><span class="v">${val}</span><button data-a="${act}" data-v="1">+</button></div></div>`;
    return `<section class="card ed open">${head}
      <label class="small muted" for="edName">Nombre del slot</label>
      <input id="edName" class="txt" data-in="edName" value="${d.name.replace(/"/g,'&quot;')}">
      <div class="steppers ed3">${step('Series','edSets',d.sets)}${step('Reps mín.','edLo',d.reps[0])}${step('Reps máx.','edHi',d.reps[1])}</div>
      <div class="ed-field"><span class="small muted">Prioridad (qué se recorta primero si falta tiempo)</span>${seg('edPrio', d.prio, [['alta','Alta'],['media','Media'],['baja','Baja']])}</div>
      <div class="ed-field"><span class="small muted">Tipo (define qué tan cerca del fallo ir)</span>${seg('edType', d.type, [['comp','Compuesto'],['iso','Aislado']])}</div>
      <div class="ed-field"><span class="small muted">Alternativas, en orden de preferencia</span><div class="alts">${alts}</div>
      ${d.alts.length < MAXALT ? `<button class="btn ghost block" data-a="pickOpen" data-v="alt">+ Agregar alternativa ${LET[d.alts.length]}</button>` : ''}</div>
      ${tag('armar tu rutina a tu manera, con plan B y C listos antes de llegar al gimnasio')}
      <button class="btn danger block" data-a="edDel" data-v="${i}" ${DAY.length===1?'disabled':''}>Eliminar slot</button>
    </section>`;
  }).join('');
  return `
    <div class="days">${['Día 1','Día 2','Día 3','Día 4'].map((d,i)=>`<span class="day ${i===0?'on':''}">${d}</span>`).join('')}</div>
    <p class="small muted">Los ejercicios de aquí son un ejemplo. En la app real partes en blanco y armas tus días. Al editar, la sesión de ejemplo se reinicia.</p>
    ${slots}
    <button class="btn primary block" data-a="pickOpen" data-v="new">+ Agregar slot</button>
`;
}

const ICONS = {
  rutina:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  hoy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>',
  semana:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  guia:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};

function render() {
  const views = { hoy: viewHoy, semana: viewSemana, guia: viewGuia, rutina: viewRutina };
  const r = document.getElementById('root');
  r.innerHTML = `<main class="app ${S.tags ? '' : 'hide-tags'}">
    <header class="top">
      <div><span class="eyebrow">Jueves 23 nov · Día 1</span><h1>${S.tab==='hoy'?'Pecho, hombro, tríceps':S.tab==='semana'?'Tu semana':S.tab==='rutina'?'Tu rutina':'Guía'}</h1></div>
      
    </header>
    ${views[S.tab]()}
  </main>
  <nav class="tabs"><div class="tabs-in">
    ${[['hoy','Entrenar'],['semana','Semana'],['rutina','Rutina'],['guia','Esfuerzo']].map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-v="${k}">${ICONS[k]}${l}</button>`).join('')}
  </div></nav>
  ${S.prioSheet ? `<div class="sheet-bg" data-a="prioClose"><div class="sheet" data-a="noop">
    <span class="eyebrow">${DAY[S.si].name}</span><h2>Prioridad ${DAY[S.si].prio}</h2>
    <div class="plegend">${['alta','media','baja'].map(k => `<div class="${k === DAY[S.si].prio ? 'cur' : ''}"><span class="pico ${k}">${prioSvg(k)}</span><span><b>${k[0].toUpperCase() + k.slice(1)}.</b> ${PRIO_TXT[k]}</span></div>`).join('')}</div>
    <button class="btn primary block" data-a="prioClose">Entendido</button>
  </div></div>` : ''}
  ${S.altSheet && !S.pick ? `<div class="sheet-bg" data-a="altSheetClose"><div class="sheet" data-a="noop">
    <span class="eyebrow">Opciones de ${DAY[S.ed].name.toLowerCase()}</span><h2>Ordena tus opciones</h2>
    <p class="small muted">La de arriba es tu primera opción y la que sale elegida al iniciar.</p>
    <div class="alts">${altRows(DAY[S.ed])}</div>
    ${DAY[S.ed].alts.length < MAXALT ? `<button class="btn ghost block" data-a="pickOpen" data-v="alt">+ Agregar otra opción</button>` : ''}
    <button class="btn primary block" data-a="altSheetClose">Listo</button>
  </div></div>` : ''}
${S.pick ? `<div class="sheet-bg" data-a="pickClose"><div class="sheet pick" data-a="noop">
      <span class="eyebrow">${S.pick === 'new' ? 'Nuevo slot' : `Opción ${LET[DAY[S.ed].alts.length]} para ${DAY[S.ed].name}`}</span>
      <h2>Elige un ejercicio</h2>
      ${S.pick !== 'new' ? '<p class="small muted">Arriba salen los que trabajan el mismo músculo principal.</p>' : ''}
      <input id="pickQ" class="txt" data-in="q" placeholder="Busca por nombre, equipo o músculo" value="${S.q||''}">
      <div class="alts pick-list" id="pickList">${pickerHtml()}</div>
      <button class="btn ghost block" data-a="pickClose">Cancelar</button>
    </div></div>` : ''}
  ${S.sheet ? `<div class="sheet-bg" data-a="sheetClose"><div class="sheet" data-a="noop">
    <span class="eyebrow">Ojo con el orden</span><h2>${S.sheet.title}</h2><p>${S.sheet.body}</p><p class="small muted">${S.sheet.foot}</p>
    ${tag('cambiar el orden sin saber que afecta el rendimiento')}
    <div class="btn-row"><button class="btn ghost" data-a="sheetClose">Mantener orden</button><button class="btn primary" data-a="sheetGo">Hacerlo igual</button></div>
  </div></div>` : ''}`;
}

// deslizar una serie a la izquierda muestra "Eliminar"
let swX = null, swRow = null;
document.addEventListener('pointerdown', ev => { const r = ev.target.closest('.sl-swipe'); swX = ev.clientX; swRow = r ? +r.dataset.row : null; });
document.addEventListener('pointerup', ev => {
  if (swX == null) return; const dx = ev.clientX - swX; swX = null;
  if (swRow != null && dx < -30) { S.swiped = swRow; render(); return; }
  if (S.swiped != null && dx > 30) { S.swiped = null; render(); return; }
  if (S.swiped != null && Math.abs(dx) < 5 && !ev.target.closest('.sl-del')) { S.swiped = null; render(); }
});
document.addEventListener('change', ev => {
  const t = ev.target; if (!t.dataset || t.dataset.set == null) return;
  const i = +t.dataset.set, f = t.dataset.f, raw = parseFloat(String(t.value).replace(',', '.')), v = f === 'w' ? fromU(raw) : raw;
  if (isNaN(v)) return;
  const si = S.si, l = logsFor(si)[i];
  if (l) l[f] = v;
  else if (i === logsFor(si).length) S.draft[f] = v;
  else { const k = `${si}-${i}`; S.pre[k] = { ...(S.pre[k] || {}), [f]: v }; }
  render();
});
document.addEventListener('input', ev => {
  const k = ev.target.dataset && ev.target.dataset.in; if (!k) return;
  if (k === 'edName') { DAY[S.ed].name = ev.target.value; }
  if (k === 'q') { S.q = ev.target.value; const l = document.getElementById('pickList'); if (l) l.innerHTML = pickerHtml(); }
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  act(b.dataset.a, b.dataset.v);
});
setInterval(() => {
  if (!S.restEnd) return;
  const el = document.getElementById('restT'); if (!el) return;
  const left = Math.max(0, Math.round((S.restEnd - Date.now())/1000));
  el.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
}, 1000);
S.draft = makeDraft(0);
render();
</script>
