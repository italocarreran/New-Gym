<title>Slot · App de gimnasio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: una columna tipo app de celular (máx. 480px), barra de pestañas fija abajo, todo operable con el pulgar */
:root {
  --bg: #EEF1F5;
  --surface: #FFFFFF;
  --surface-2: #E4E9F0;
  --ink: #131820;
  --muted: #5A6472;
  --line: #D5DCE5;
  --accent: #1E4FD8;
  --accent-soft: #DCE5FB;
  --accent-ink: #FFFFFF;
  --ok: #1D8048;
  --ok-soft: #DDF1E5;
  --warn: #9A6410;
  --warn-soft: #FBEFD9;
  --bad: #B8322A;
  --bad-soft: #F8E0DE;
  --tag: #6B4FC4;
  --tag-soft: #ECE6FA;
  --mus: #C0392B; --mus-0: #F2D3CF; --mus-off: #DCE1E8; --mus-dim: #BFC7D2; --heat-0: #F3A188; --heat-1: #B3241A;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1015; --surface: #161A21; --surface-2: #20262F; --ink: #E8ECF2; --muted: #96A0AD; --line: #2A313B;
    --accent: #7096FF; --accent-soft: #1C2A4D; --accent-ink: #0B1020;
    --ok: #4CC683; --ok-soft: #143222; --warn: #E8AE4C; --warn-soft: #3A2C12; --bad: #F2766B; --bad-soft: #3D1A18;
    --tag: #B39DFF; --tag-soft: #2A2245; color-scheme: dark;
    --mus: #F0675B; --mus-0: #3C2523; --mus-off: #262C35; --mus-dim: #3A434F; --heat-0: #F3A188; --heat-1: #C42A1F;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1015; --surface: #161A21; --surface-2: #20262F; --ink: #E8ECF2; --muted: #96A0AD; --line: #2A313B;
  --accent: #7096FF; --accent-soft: #1C2A4D; --accent-ink: #0B1020;
  --ok: #4CC683; --ok-soft: #143222; --warn: #E8AE4C; --warn-soft: #3A2C12; --bad: #F2766B; --bad-soft: #3D1A18;
  --tag: #B39DFF; --tag-soft: #2A2245; color-scheme: dark;
  --mus: #F0675B; --mus-0: #3C2523; --mus-off: #262C35; --mus-dim: #3A434F; --heat-0: #F3A188; --heat-1: #C42A1F;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1; }
h2 { font-size: 22px; line-height: 1.05; }
h3 { font-size: 18px; }
p { margin: 0; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* encabezado */
.top { position: sticky; top: 0; z-index: 12; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -12px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; padding: 10px max(16px, env(safe-area-inset-left, 0px)) 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
.cur-card { scroll-margin-top: 96px; }
.top-l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.top { --hp: 0; }
.top .eyebrow { display: block; overflow: hidden; max-height: calc(16px * (1 - var(--hp))); opacity: calc(1 - var(--hp) * 1.4); }
.top h1 { font-size: calc(22px - 5px * var(--hp)); }
.clock { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.clock { display: flex; align-items: center; gap: 6px; }
.clock b { color: var(--ink); font-weight: 600; font-size: 15px; font-family: var(--display); letter-spacing: .02em; min-width: 34px; }
.sw { width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; padding: 0; flex: none; }
.sw.on { background: var(--surface-2); color: var(--ink); }
.sw svg { width: 10px; height: 10px; fill: currentColor; }
.top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.toggle { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
.toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.toggle[aria-pressed="true"] .dot { background: var(--tag); }

/* nota de "qué problema resuelve" */
.why-tag { display: flex; gap: 8px; align-items: flex-start; background: var(--tag-soft); color: var(--tag); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; font-weight: 500; }
.why-tag b { font-weight: 700; white-space: nowrap; }
.hide-tags .why-tag { display: none; }

/* tira de la sesión */
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.chip-slot { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 4px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.chip-slot .n { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1; }
.chip-slot .l { font-size: 10px; line-height: 1.15; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-slot.cur { border-color: var(--accent); background: var(--accent-soft); }
.chip-slot.done { background: var(--ok-soft); border-color: transparent; }
.chip-slot.done .n { color: var(--ok); }
.chip-slot.cut { opacity: .45; text-decoration: line-through; }
.prio { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; }
.prio.alta { background: var(--accent); color: var(--accent-ink); }
.prio.media { background: var(--accent-soft); color: var(--accent); }
.prio.baja { background: var(--surface-2); color: var(--muted); }

/* tarjeta principal */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.fold-btn { display: flex; align-items: center; gap: 3px; min-width: 0; flex: 1; background: none; border: 0; padding: 0; text-align: left; color: inherit; cursor: pointer; }
.fold-chev { display: inline-block; font-size: 17px; margin-left: -2px; line-height: 1; color: var(--muted); transition: transform .15s; }
.fold-chev.open { transform: rotate(90deg); }
.note.ord-note { flex-direction: row; align-items: center; gap: 10px; }
.ord-note > div { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.ok-btn { flex: none; padding: 6px 14px; border-radius: 8px; border: 1px solid currentColor; background: transparent; color: inherit; font-weight: 600; font-size: 13px; cursor: pointer; }
.slot-head { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.card.dragging { position: relative; z-index: 14; box-shadow: 0 14px 34px rgba(10, 20, 40, .28); opacity: .96; transition: none; }
.drop-before { box-shadow: 0 -4px 0 0 var(--accent); }
.drop-after { box-shadow: 0 4px 0 0 var(--accent); }
.fold-card, .cur-card.folded { padding-block: 12px; gap: 2px; }
.fold-card { cursor: pointer; }
.fold-card.done .slot-line { color: var(--ok); }
.fold-card.cut { opacity: .5; }
.fold-sub { display: block; width: 100%; margin-top: 2px; padding: 0 0 0 17px; background: none; border: 0; text-align: left; font-size: 12.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.fold-sum { display: flex; flex-direction: column; gap: 2px; width: 100%; margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); text-align: left; font-size: 13px; color: var(--ink); cursor: pointer; }
.fold-sum .muted { font-size: 12px; }
.slot-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.slot-line { font-size: 18px; min-width: 0; }
.slot-type { font-family: var(--body); font-size: 13px; font-weight: 500; }
.pico { border: none; background: var(--surface-2); border-radius: 8px; width: 34px; height: 30px; display: grid; place-items: center; padding: 0; flex-shrink: 0; }
.pico svg { width: 18px; height: 16px; }
.pico.alta { color: var(--bad); background: var(--bad-soft); }
.pico.media { color: var(--warn); background: var(--warn-soft); }
.pico.baja { color: var(--muted); }
.plegend { display: flex; flex-direction: column; gap: 8px; }
.plegend div { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 10px; align-items: center; font-size: 13.5px; }
.plegend div.cur { font-weight: 600; }
.slot-head .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.target { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1; text-align: right; white-space: nowrap; }
.target small { display: block; font-family: var(--body); font-size: 11px; font-weight: 500; color: var(--muted); }

.alts { display: flex; flex-direction: column; gap: 6px; }
.alt { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; background: var(--surface); text-align: left; width: 100%; }
.alt .letter { font-family: var(--display); font-weight: 700; font-size: 20px; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); }
.alt.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.alt.on .letter { background: var(--accent); color: var(--accent-ink); }
.alt.busy { opacity: .55; }
.setlist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cells { display: grid; grid-template-columns: 1.15fr 1fr .9fr; gap: 3px; }
.cellw { display: flex; align-items: center; gap: 3px; min-width: 0; }
.cellw .u { font-size: 10px; color: var(--muted); font-weight: 500; }
.unit-sw { display: inline-flex; justify-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; cursor: pointer; font: inherit; }
.unit-sw span { border: none; background: transparent; border-radius: 5px; padding: 2px 8px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: none; letter-spacing: 0; }
.unit-sw span.on { background: var(--accent); color: var(--accent-ink); }
.cell { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 2px; text-align: center; font-family: var(--display); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cell::placeholder { color: var(--muted); opacity: .6; }
.cell:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.sl-row.cur .cell { border-color: var(--accent); }
.sl-row.done .cell { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.sl-row { display: grid; grid-template-columns: 28px minmax(0,1fr) 60px; gap: 4px; row-gap: 2px; align-items: center; padding: 8px 8px; border-top: 1px solid var(--line); font-size: 13.5px; }
.sl-row:first-child { border-top: none; }
.sl-row .num { font-family: var(--display); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sl-row small { display: block; font-size: 11px; color: var(--muted); }
.antes { align-self: stretch; margin: -8px -8px -8px 2px; padding: 0 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--surface-2); border-left: 1px solid var(--line); font-size: 11px; line-height: 1.3; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.antes b { font-family: var(--display); font-size: 14px; font-weight: 600; color: var(--ink); }
.sl-h .antes { margin-block: -6px; font-size: 10px; }
.chk { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--line); background: var(--surface); color: var(--muted); font-family: var(--display); font-weight: 700; font-size: 13px; display: grid; place-items: center; padding: 0; }
.chk.cur { border-color: var(--accent); color: var(--accent); }
.chk.on { background: var(--ok); border-color: var(--ok); color: var(--surface); font-size: 15px; }
.chk:disabled { opacity: .5; cursor: default; }
.sl-add { display: flex; padding: 0 8px; border-top: 1px solid var(--line); }
.sl-add { justify-content: space-between; }
.sl-add .drop-now { color: var(--muted); }
.sl-add button { border: none; background: transparent; color: var(--accent); font-weight: 600; font-size: 11.5px; padding: 5px 2px; }
.sl-swipe { position: relative; overflow: hidden; border-top: 1px solid var(--line); }
.sl-swipe .sl-row { border-top: none; background: var(--surface); position: relative; z-index: 1; transition: transform .2s ease; touch-action: pan-y; }
.sl-swipe .sl-row.cur { background: var(--accent-soft); }
.sl-swipe.open .sl-row { transform: translateX(-84px); }
.sl-swipe .u, .sl-swipe .antes { user-select: none; -webkit-user-select: none; }
.sl-del { position: absolute; top: 0; bottom: 0; right: 0; width: 84px; border: none; background: var(--bad); color: #fff; font-weight: 600; font-size: 13px; }
.sl-drop { padding-block: 4px 6px; border-top: 1px dashed var(--line); background: var(--surface-2); }
.sl-drop .cell { font-size: 14px; padding: 4px 2px; }
.drop-ar { text-align: center; color: var(--muted); font-size: 15px; }
.drop-t { align-self: center; font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; text-align: center; }
.drop-x { justify-self: end; border: 0; background: transparent; color: var(--muted); font-size: 13px; width: 28px; height: 28px; }
.sl-dropadd { display: flex; padding: 0 8px; border-top: 1px dashed var(--line); }
.sl-dropadd button { border: none; background: transparent; color: var(--muted); font-weight: 600; font-size: 11.5px; padding: 5px 2px; }
.bi-link { display: flex; justify-content: center; align-items: center; gap: 8px; margin: -12px 0; min-height: 24px; }
.bi-link button { border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
.bi-link:not(.on) button { opacity: .7; }
.bi-link.on { justify-content: space-between; padding: 4px 10px; margin: -14px 0; border-left: 3px solid var(--accent); border-right: 3px solid var(--accent); background: var(--accent-soft); }
.bi-link.on .bi-tag { font-size: 11px; font-weight: 700; color: var(--accent); }
.bi-link.on button { color: var(--accent); text-decoration: underline; padding: 2px 0; }
.card.bi-a { border-color: var(--accent); border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; border-width: 1px 3px 1px 3px; }
.card.bi-b { border-color: var(--accent); border-top-left-radius: 4px; border-top-right-radius: 4px; border-width: 1px 3px 1px 3px; }
.sl-foot { font-size: 11.5px; color: var(--muted); margin-top: -4px; }
.sl-h { background: var(--surface-2); font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-block: 6px; }
.sl-row.cur { background: var(--accent-soft); }
.sl-row.cur .num:last-child { color: var(--accent); font-size: 14px; }
.sl-row.done .num:last-child { color: var(--ok); }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.opt-top { display: flex; justify-content: space-between; align-items: center; }
.opt-l { font-family: var(--display); font-weight: 700; font-size: 13px; width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; background: var(--surface-2); }
.opt-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.opt-dot.taken { background: var(--bad); }
.opt-n { font-size: 12.5px; font-weight: 600; line-height: 1.2; }
.opt-s { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt-b { font-size: 10px; font-weight: 700; color: var(--bad); text-transform: uppercase; letter-spacing: .05em; }
.opt.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
.opt.on .opt-l { background: var(--accent); color: var(--accent-ink); }
.opt.busy { opacity: .6; }
.opts.mini { gap: 4px; }
.opt-more { justify-content: center; align-items: center; font-weight: 700; font-size: 16px; padding: 0 !important; color: var(--muted); }
.opts.mini .opt { flex-direction: row; align-items: center; gap: 5px; padding: 5px 6px; border-radius: 9px; }
.opts.mini .opt-top { order: 0; }
.opts.mini .opt-l { width: 16px; height: 16px; font-size: 11px; border-radius: 4px; }
.opts.mini .opt-dot, .opts.mini .opt-s, .opts.mini .opt-b { display: none; }
.opts.mini .opt-n { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.opt.busy .opt-n { text-decoration: line-through; }
.opts.mini .opt:not(.opt-more) { padding: 3px; display: block; }
.opt-pic { position: relative; display: grid; place-items: center; width: 100%; aspect-ratio: 3 / 2; border-radius: 6px; overflow: hidden; background: #fff; }
.opt-pic img { grid-area: 1 / 1; width: 100%; height: 100%; object-fit: cover; display: block; }
.opt-pic .f2 { opacity: 0; }
.cur-card .opt.on .opt-pic .f2 { animation: exflip 2.4s steps(1, end) infinite; }
@keyframes exflip { 0% { opacity: 0; } 50% { opacity: 1; } }
.opt-pic .opt-l { position: absolute; left: 3px; top: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.opt-pic .opt-n { padding: 4px; text-align: center; white-space: normal !important; color: #333; }
.opt.busy .opt-pic img { filter: grayscale(1); }
.opt-info { position: absolute; right: 3px; top: 3px; width: 22px; height: 20px; border-radius: 6px; display: grid; place-items: center; background: rgba(150,150,155,.45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); color: #fff; cursor: pointer; }
.opt-info svg { fill: currentColor; display: block; }
.opts.mini .opt-info { width: 18px; height: 16px; right: 2px; top: 2px; }
.exi { max-height: 85vh; overflow-y: auto; }
.exi-pics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.exi-pics img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 10px; background: #fff; display: block; }
.exi-h { font-family: var(--display); font-size: 15px; margin: 4px 0 -4px; }
.exi-l { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.4; }
.exi-l.ojo li::marker { color: var(--bad); }
.opt-cap { margin: -6px 0 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt-cap b { color: var(--accent); }
.alt.busy .name { text-decoration: line-through; }
.alt .name { font-weight: 600; font-size: 14.5px; }
.alt .sub { font-size: 12px; color: var(--muted); }
.state { font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
.state.free { background: var(--ok-soft); color: var(--ok); }
.state.taken { background: var(--bad-soft); color: var(--bad); }

.explain { background: var(--surface-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
.explain .row { display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 8px; }
.explain .k { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 2px; }

.btn { border: none; border-radius: 12px; padding: 13px 14px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface-2); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.block { width: 100%; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.last { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.last .val { font-family: var(--display); font-size: 20px; font-weight: 600; }
.note { border-radius: 10px; padding: 9px 11px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }

// técnica de cada ejercicio (se abre con los tres puntitos de la foto)
const TEC = {
  banca:{ como:['Acuéstate con los ojos bajo la barra y toma la barra un poco más ancho que los hombros.','Junta las escápulas y bájalas; deja un arco natural en la espalda baja.','Baja controlado hasta tocar la parte baja del pecho, con los codos a unos 45° del cuerpo.','Empuja hacia arriba y un poco hacia atrás, hasta estirar los brazos.'], ojo:['No rebotes la barra en el pecho.','Glúteos y pies siempre apoyados.','Muñecas rectas, la barra sobre el talón de la mano.','Con peso alto, pide a alguien que te asista.'] },
  mancPlana:{ como:['Siéntate con las mancuernas sobre los muslos y acuéstate llevándolas al pecho.','Junta las escápulas y apoya bien los pies.','Baja hasta que los codos queden un poco bajo el banco, con las palmas mirando a los pies.','Empuja hacia arriba juntando las mancuernas sin chocarlas.'], ojo:['Codos a unos 45°, no abiertos en cruz.','Baja lento: la mancuerna da más recorrido que la barra.','Al terminar, bájalas al pecho y siéntate; no las sueltes hacia los lados.'] },
  smith:{ como:['Ajusta el banco para que la barra baje a la parte baja del pecho.','Toma la barra un poco más ancho que los hombros y destrábala girando las muñecas.','Baja controlado hasta rozar el pecho.','Empuja hasta estirar los brazos.'], ojo:['Revisa dónde están los seguros antes de empezar.','Escápulas juntas, igual que en barra libre.','La barra guiada no corrige una mala posición del banco.'] },
  incl:{ como:['Banco a 30°. Siéntate y lleva las mancuernas a los hombros.','Junta las escápulas y apoya la espalda completa.','Baja hasta la altura del pecho alto, codos un poco bajo el banco.','Empuja hacia arriba juntando las mancuernas sin chocarlas.'], ojo:['Más de 30-40° de inclinación ya trabaja sobre todo el hombro.','No despegues los glúteos del asiento.','Baja controlado, sin rebotar.'] },
  inclSmith:{ como:['Banco a 30° bajo la barra, de modo que baje a la parte alta del pecho.','Toma la barra un poco más ancho que los hombros.','Baja controlado hasta rozar el pecho alto.','Empuja hasta estirar los brazos.'], ojo:['Revisa los seguros antes de empezar.','Si la barra cae en el cuello o en la panza, mueve el banco.'] },
  flexPeso:{ como:['Manos un poco más anchas que los hombros, cuerpo recto de cabeza a talones.','Con el disco apoyado en la espalda alta, baja hasta casi tocar el suelo con el pecho.','Empuja el suelo hasta estirar los brazos.'], ojo:['Abdomen y glúteos apretados: la cadera no se cae ni se sube.','Codos a unos 45°, no abiertos en cruz.','Si se te cae la técnica, saca el disco.'] },
  cruces:{ como:['Poleas a la altura de los hombros o un poco más arriba. Un paso adelante.','Brazos abiertos con los codos un poco doblados, que no cambian durante el movimiento.','Junta las manos frente al pecho en arco, como abrazando un árbol.','Vuelve lento hasta sentir el estiramiento del pecho.'], ojo:['No conviertas el movimiento en un press doblando los codos.','El torso no se mueve.','Peso que puedas controlar en la vuelta.'] },
  pecdeck:{ como:['Ajusta el asiento para que las manijas queden a la altura del pecho.','Espalda pegada al respaldo y codos un poco doblados.','Junta las manos frente al pecho sin chocar las placas.','Vuelve lento hasta sentir el estiramiento.'], ojo:['No despegues la espalda ni los hombros del respaldo.','No dejes que el peso caiga de golpe.'] },
  aperturas:{ como:['Acostado, mancuernas arriba del pecho con las palmas enfrentadas.','Codos un poco doblados, fijos durante todo el movimiento.','Abre los brazos en arco hasta sentir el estiramiento del pecho.','Cierra en el mismo arco hasta juntar las mancuernas arriba.'], ojo:['No bajes más allá de la línea del hombro.','Peso liviano: el estiramiento abajo carga mucho el hombro.'] },
  latMan:{ como:['De pie, mancuernas a los costados y torso un poco inclinado hacia adelante.','Sube los brazos hacia los lados con los codos un poco doblados.','Para a la altura de los hombros, como si vaciaras un jarro.','Baja lento.'], ojo:['No balancees el cuerpo para subir.','Los codos van un poco por delante de las manos.','No subas los hombros hacia las orejas.'] },
  latPolea:{ como:['Polea baja. Párate de lado y toma el agarre con la mano más lejana.','Cable por delante del cuerpo.','Sube el brazo hacia el lado hasta la altura del hombro.','Baja lento sin dejar que el peso toque.'], ojo:['El cuerpo no se inclina para ayudar.','Codo un poco doblado y fijo.'] },
  latMaq:{ como:['Ajusta el asiento para que los hombros queden alineados con el eje de la máquina.','Codos contra los rodillos.','Sube hasta la altura del hombro.','Baja lento.'], ojo:['Empuja con los codos, no con las manos.','No subas los hombros hacia las orejas.'] },
  pressHom:{ como:['Sentado con respaldo casi vertical, mancuernas a la altura de los hombros.','Palmas hacia adelante y codos un poco por delante del cuerpo.','Empuja hacia arriba hasta casi estirar los brazos.','Baja hasta que las mancuernas lleguen a la altura de las orejas.'], ojo:['No arquees la espalda baja: mantenla pegada al respaldo.','No choques las mancuernas arriba.'] },
  pressHomMaq:{ como:['Ajusta el asiento para que las manijas queden a la altura de los hombros.','Espalda pegada al respaldo.','Empuja hasta casi estirar los brazos.','Baja controlado.'], ojo:['No arquees la espalda baja.','No bloquees los codos de golpe arriba.'] },
  arnold:{ como:['Sentado, mancuernas frente a la cara con las palmas mirándote.','Mientras subes, abre los codos y gira las palmas hacia adelante.','Termina arriba con las palmas hacia adelante.','Baja deshaciendo el giro.'], ojo:['El giro es suave y continuo, no en dos tiempos.','Usa menos peso que en el press normal.'] },
  triPolea:{ como:['Polea alta con cuerda o barra. Párate cerca, torso un poco inclinado.','Codos pegados al cuerpo.','Estira los brazos hacia abajo hasta extenderlos por completo.','Vuelve lento hasta que los antebrazos queden paralelos al suelo o un poco más arriba.'], ojo:['Solo se mueve el antebrazo: los codos no se van adelante.','No ayudes con el peso del cuerpo.'] },
  fondos:{ como:['En la máquina asistida, rodillas sobre la plataforma y manos en las barras.','Cuerpo vertical para cargar más el tríceps.','Baja hasta que los codos queden a 90°.','Empuja hasta estirar los brazos.'], ojo:['No bajes más si te molesta el hombro.','Más contrapeso = más fácil.'] },
  frances:{ como:['Acostado en el banco, barra Z arriba con los brazos estirados.','Codos fijos apuntando al techo.','Baja la barra hacia la frente doblando solo los codos.','Sube hasta estirar los brazos.'], ojo:['Los codos no se abren hacia los lados.','Baja lento y con poco peso al principio: cuida los codos.'] },
  sentadilla:{ como:['Barra sobre la espalda alta, pies al ancho de hombros.','Respira, aprieta el abdomen y baja como sentándote atrás.','Baja hasta que el muslo quede paralelo al suelo o un poco más.','Sube empujando el suelo con todo el pie.'], ojo:['Rodillas en la dirección de la punta de los pies.','Espalda neutra; no te redondees abajo.','Usa los seguros del rack.'] },
  prensa:{ como:['Espalda completa contra el respaldo, pies al ancho de hombros en la plataforma.','Quita los seguros y baja hasta que las rodillas queden a 90° o un poco más.','Empuja con todo el pie sin bloquear las rodillas arriba.'], ojo:['No despegues la espalda baja del respaldo.','No bloquees las rodillas.'] },
  remoBarra:{ como:['Toma la barra al ancho de hombros e inclínate con la espalda neutra, casi paralela al suelo.','Rodillas un poco dobladas.','Lleva la barra al ombligo juntando las escápulas.','Baja controlado.'], ojo:['Espalda neutra todo el tiempo.','No te enderezas para subir la barra.'] },
  dominadas:{ como:['Toma la barra un poco más ancho que los hombros.','Cuelga con los brazos estirados.','Sube llevando el pecho hacia la barra hasta pasar el mentón.','Baja completo.'], ojo:['Sin balanceo.','Si no llegas a 6, usa la máquina asistida.'] },
  curlZ:{ como:['De pie, barra Z con las palmas hacia adelante.','Codos quietos al costado.','Sube doblando solo los codos.','Baja lento hasta estirar los brazos.'], ojo:['No balancees el cuerpo.','Los codos no se van adelante.'] },
  facePull:{ como:['Polea a la altura de la cara con cuerda.','Toma la cuerda con las palmas hacia abajo y da un paso atrás.','Tira hacia la frente abriendo los codos y separando las manos.','Vuelve lento.'], ojo:['Peso liviano.','Los codos quedan a la altura de los hombros o más arriba.'] },
  pantorrilla:{ como:['Hombros bajo las almohadillas y punta de pies en el borde.','Baja el talón hasta estirar la pantorrilla.','Pausa de un segundo abajo.','Sube en punta de pies lo más alto posible.'], ojo:['No rebotes abajo.','Rodillas estiradas pero sin bloquear.'] }
};

function exInfoSheet(id) {
  const x = EX[id], t = TEC[id] || { como: [x.tec], ojo: [] };
  const mus = [...x.p.map(m => `<b>${MUS[m]}</b>`), ...x.s.map(m => MUS[m])].join(' · ');
  return `<div class="sheet-bg" data-a="exInfoClose"><div class="sheet exi" data-a="noop">
    <span class="eyebrow">${x.eq}</span><h2>${x.n}</h2>
    ${IMG[id] ? `<div class="exi-pics"><img src="${IMG[id][0]}" alt=""><img src="${IMG[id][1]}" alt=""></div>` : ''}
    <p class="small muted">${mus}</p>
    <h3 class="exi-h">Cómo se hace</h3><ol class="exi-l">${t.como.map(c => `<li>${c}</li>`).join('')}</ol>
    ${t.ojo.length ? `<h3 class="exi-h">Cosas que cuidar</h3><ul class="exi-l ojo">${t.ojo.map(c => `<li>${c}</li>`).join('')}</ul>` : ''}
    <button class="btn primary block" data-a="exInfoClose">Entendido</button>
  </div></div>`;
}

    return { why: 'peso', w, reps: descend, from: L.w, pct: Math.round((w / L.w - 1) * 100) };
  }
  // mismo peso: suma una rep donde sobró reserva
  const reps = Array.from({length: n}, (_, i) => {
    const base = lr[i] ?? lr[k], ri = rr[i] ?? rr[k];
    return Math.min(hi, Math.max(base, base + (ri >= 3 ? 2 : ri >= 2 ? 1 : 0)));
  });
  return { why: 'rep', w: L.w, reps };
}
function target(si, i) { const p = plan(si); return { w: p.w, r: p.reps[i] ?? p.reps[p.reps.length - 1], why: p.why }; }
const defRir = (si, i) => DAY[si].type === 'iso' && i === nS(si) - 1 ? 0 : 2;
function makeDraft(si) {
  const n = logsFor(si).length, prev = logsFor(si).slice(-1)[0], t = target(si, n);
  const w = prev ? prev.w : t.w;
  const r = t.r;
  const pre = S.pre[`${si}-${n}`] || {};
  return { w: pre.w ?? w, r: pre.r ?? r, rir: pre.rir ?? defRir(si, n) };
}

function weekly(includePlan) {
  const t = { ...BASE };
  const add = (e, k) => { e.p.forEach(m => t[m] += k); e.s.forEach(m => t[m] += k * 0.5); };
  S.logs.forEach(l => add(EX[l.ex], 1));
  if (includePlan) DAY.forEach((d, si) => {
    if (cutSet().has(si)) return;
    const left = nS(si) - logsFor(si).length; if (left > 0) add(exOf(si), left);
  });
  return t;
}

function timePlan() {
  const pending = DAY.map((d, si) => si).filter(si => !isDone(si));
  const rows = pending.map(si => ({ si, mins: slotMins(si, nS(si) - logsFor(si).length) }));
  const cut = new Set();
  if (S.minutes != null) {
    let total = rows.reduce((a, r) => a + r.mins, 0);
    const order = [...rows].filter(r => logsFor(r.si).length === 0 && r.si !== S.si)
      .sort((a, b) => PRANK[DAY[a.si].prio] - PRANK[DAY[b.si].prio] || b.si - a.si);
    for (const r of order) { if (total <= S.minutes) break; if (DAY[r.si].prio === 'alta') break; cut.add(r.si); total -= r.mins; }
  }
  return { rows, cut };
}
const cutSet = () => timePlan().cut;

function findFiller(si) {
  const behind = weekly(false);
  return DAY.map((d, j) => j).filter(j => j !== si && !isDone(j) && DAY[j].type === 'iso' && logsFor(j).length === 0 && share(j, si).length === 0)
    .sort((a, b) => (behind[exOf(a).p[0]] / (META[exOf(a).p[0]]?.[0] || 1)) - (behind[exOf(b).p[0]] / (META[exOf(b).p[0]]?.[0] || 1)))[0];
}

function conflictFor(j) {
  // ¿Hay un ejercicio más importante, pendiente, que use los mismos músculos?
  const hit = DAY.map((d, k) => k).find(k => k !== j && !isDone(k) && logsFor(k).length === 0 && PRANK[DAY[k].prio] > PRANK[DAY[j].prio] && share(j, k).length > 0);
  return hit;
}

function guideFor(si) {
  const d = DAY[si], n = logsFor(si).length + 1, last = n === nS(si);
  if (d.type === 'comp') return { cls:'', g1:`Serie ${n} de ${nS(si)}: termina con 1-2 en el tanque`, g2:`Compuesto. No llegues al fallo en ninguna serie. Descansa 2-3 min.` };
  if (!last) return { cls:'', g1:`Serie ${n} de ${nS(si)}: deja 1-2 en reserva`, g2:`Aislado. Guarda el fallo para la última serie. Descansa 60-90 s.` };
  return { cls:'fail', g1:`Última serie: puedes llegar al fallo`, g2:`Aislado. Dalo todo, hasta que no salga una repetición más con buena técnica.` };
}

function feedback(si, rir) {
  const d = DAY[si], n = logsFor(si).length, last = n === nS(si), e = exOf(si), lg = logsFor(si)[n - 1];
  if (e.last && lg && lg.w > e.last.w) {
    if (lg.r < d.reps[0]) return { cls:'warn', t:'El salto de peso fue muy grande.', s:`No llegaste al mínimo del rango (${d.reps[0]}). Baja un poco el peso (2,5-5%) en la próxima serie.` };
    if (rir >= 3) return { cls:'warn', t:'El salto de peso quedó chico.', s:'Te sobraron 3 o más repeticiones. La próxima vez sube un poco más.' };
  }
  if (d.type === 'comp') {
    if (rir === 0) return { cls:'bad', t:'Llegaste al fallo en un compuesto.', s:'Descansa los 3 minutos completos. Si en la próxima no llegas al rango, baja 5% el peso. Aquí el fallo suma poco músculo y mucho cansancio para las series que vienen.' };
    if (rir >= 3) return { cls:'warn', t:'Te sobraron 3 o más repeticiones.', s:'En la próxima serie sube 2,5 kg o haz más repeticiones, hasta quedar a 1-2 del fallo.' };
    return { cls:'ok', t:'Justo en la zona: 1-2 en reserva.', s:'Así sumas estímulo sin quemar las series que siguen.' };
  }
  if (!last && rir === 0) return { cls:'warn', t:'Todavía no era la última serie.', s:'Guarda el fallo para el final y descansa 90 s antes de la próxima.' };
  if (last && rir >= 2) return { cls:'warn', t:'Era la última y te quedó margen.', s:'En la última serie de un aislado puedes apretar más. La próxima vez, dalo todo.' };
  if (last) return { cls:'ok', t:'Así se hace la última serie de un aislado.', s:'Cerca del fallo, sin perder la técnica.' };
  return { cls:'ok', t:'Bien, 1-2 en reserva.', s:'La última serie es la que puedes llevar al fallo.' };
}

function progressionNote(si) {
  const d = DAY[si], ls = logsFor(si), e = exOf(si);
  if (ls.length < nS(si)) return null;
  const l = ls[ls.length - 1], minRir = d.type === 'iso' ? 0 : 1;
  if (l.r >= d.reps[1] && l.rir >= minRir && l.rir <= 2) {
    const st = stepOf(e), w = Math.max(l.w + st, roundTo(l.w * 1.06, st));
    return `La última serie llegó al tope (${d.reps[1]}) con ${l.rir} en reserva. La próxima vez sube a ${fmt(toU(w))} ${S.unit} (+${Math.round((w / l.w - 1) * 100)}%): la última serie debería caer cerca de ${d.reps[0]}.`;
  }
  return null;
}

// ---------- Acciones ----------
function act(a, v) {
  const si = S.si;
  if (a === 'noop') return;
  switch (a) {
    case 'tab': S.tab = v; window.scrollTo(0, 0); break;
    case 'tags': S.tags = !S.tags; break;
    case 'pick': {
      const k = +v, id = DAY[si].alts[k];
      if (k === altIdx(si) && !S.busy[id]) { act('busy'); return; }   // tocar la elegida otra vez = está ocupada
      S.chosen[si] = true; delete S.busy[id]; S.alt[si] = k; S.draft = makeDraft(si); S.swap = null; S.showWhy = false; break;
    }
    case 'whyToggle': S.showWhy = !S.showWhy; break;
    case 'busy': {
      const id = exIdOf(si); S.busy[id] = true;
      const next = DAY[si].alts.findIndex(x => !S.busy[x]);
      if (next >= 0) { const from = EX[id].n; S.alt[si] = next; S.draft = makeDraft(si); S.swap = { from, to: exOf(si).n }; S.showWhy = true; }
      else S.swap = { none: true };
      break;
    }
    case 'free': { DAY[si].alts.forEach(x => delete S.busy[x]); S.swap = null; break; }
    case 'filler': {
      const j = +v; S.returnTo = si; S.si = j; S.swap = null; S.draft = makeDraft(j); S.showWhy = false; S.fold[j] = false; S.scrollCur = true; break;
    }
    case 'back': {
      const r = S.returnTo; S.returnTo = null; DAY[r].alts.forEach(x => delete S.busy[x]); S.alt[r] = 0;
      S.si = r; S.draft = makeDraft(r); S.swap = null; S.fold[r] = false; S.scrollCur = true; break;
    }
    case 'jump': {
      const j = +v; if (j === si) { S.fold[j] = false; break; }
      { S.si = j; S.fold[j] = false; S.draft = makeDraft(j); S.swap = null; S.showWhy = false; S.scrollCur = true; }
      break;
    }
    case 'sheetGo': { if (S.sheet.reorder) { S.view = S.sheet.reorder; S.sheet = null; break; } const j = S.sheet.go; S.sheet = null; S.si = j; S.fold[j] = false; S.draft = makeDraft(j); S.swap = null; S.showWhy = false; S.scrollCur = true; break; }
    case 'sheetClose': S.sheet = null; break;
    case 'w': S.draft.w = Math.max(0, S.draft.w + (+v)); break;
    case 'r': S.draft.r = Math.max(0, S.draft.r + (+v)); break;
    case 'rir': S.draft.rir = +v; break;
    case 'log': {
      if (S.draft.rir == null) { S.msg = { cls:'info', t:'Falta el RIR.', s:'Anota en la casilla RIR cuántas repeticiones más podías hacer.' }; break; }
      if (!S.order.includes(si)) S.order.push(si);
      S.logs.push({ si, ex: exIdOf(si), w: S.draft.w, r: S.draft.r, rir: S.draft.rir }); S.pulse = true; if (!S.startAt) S.startAt = Date.now();
      S.msg = feedback(si, S.draft.rir);
      const pn = progressionNote(si); if (pn) S.msg = { cls:'info', t:'Sube el peso la próxima vez.', s:pn };
      S.restLen = restSecs(si); S.restEnd = Date.now() + S.restLen * 1000;
      S.draft = makeDraft(si); S.swap = null;
      const pb = biPartner(si);
      if (pb != null && !isDone(pb) && !cutSet().has(pb)) {
        const fb = S.msg;
        if (biFirst(si)) { S.restEnd = null; S.msg = { cls:'info', t:`Biserie: pasa directo a ${DAY[pb].name.toLowerCase()}.`, s:`Sin descanso entre los dos. ${fb ? fb.t : ''}` }; }
        else S.msg = { cls:'info', t:`Vuelta lista. Descansa y vuelve a ${DAY[pb].name.toLowerCase()}.`, s:`${DAY[si].name}: ${fb ? fb.t : ''}` };
        S.si = pb; S.fold[pb] = false; S.draft = makeDraft(pb); S.scrollCur = true;
      }
      break;
    }
    case 'next': {
      S.msg = null; S.restEnd = null;
      if (S.returnTo != null) { act('back'); return; }
      const nx = viewOrder().find(j => !isDone(j) && !cutSet().has(j));
      if (nx != null) { S.si = nx; S.fold[nx] = false; S.draft = makeDraft(nx); S.showWhy = false; S.scrollCur = true; }
      break;
    }
    case 'undo': { let ix = -1; S.logs.forEach((x, k) => { if (x.si === si) ix = k; }); const l = ix >= 0 ? S.logs.splice(ix, 1)[0] : null; if (l && !logsFor(l.si).length) S.order = S.order.filter(x => x !== l.si); S.msg = null; S.restEnd = null; S.draft = makeDraft(si); break; }
    case 'skipRest': S.restEnd = null; break;
    case 'unit': S.unit = S.unit === 'kg' ? 'lb' : 'kg'; break;
    case 'min': S.minutes = S.minutes === +v ? null : +v; break;
    case 'reset': resetSession(); break;
    // --- editor de rutina ---
    case 'edOpen': S.ed = S.ed === +v ? null : +v; S.pick = null; break;
    case 'edMove': { const [i, d] = v.split(',').map(Number); move(DAY, i, d); if (S.ed === i) S.ed = i + d >= 0 && i + d < DAY.length ? i + d : i; resetSession(); break; }
    case 'edDel': { if (DAY.length > 1) { DAY.splice(+v, 1); S.ed = null; resetSession(); } break; }
    case 'edSets': { const d = DAY[S.ed]; d.sets = Math.min(8, Math.max(1, d.sets + (+v))); resetSession(); break; }
    case 'edLo': { const d = DAY[S.ed]; d.reps[0] = Math.max(1, Math.min(d.reps[1], d.reps[0] + (+v))); break; }
    case 'edHi': { const d = DAY[S.ed]; d.reps[1] = Math.max(d.reps[0], Math.min(30, d.reps[1] + (+v))); break; }
    case 'edPrio': DAY[S.ed].prio = v; break;
    case 'edType': DAY[S.ed].type = v; break;
    case 'altMove': { const [i, d] = v.split(',').map(Number); move(DAY[S.ed].alts, i, d); afterAltEdit(); break; }
    case 'altDel': { const a = DAY[S.ed].alts; if (a.length > 1) { a.splice(+v, 1); afterAltEdit(); } break; }
    case 'addSet': S.extra = S.extra || {}; S.extra[si] = (S.extra[si] || 0) + 1; S.draft = makeDraft(si); break;
    case 'delSetAt': {
      const i = +v, l = logsFor(si)[i];
      if (l) { S.logs.splice(S.logs.indexOf(l), 1); if (!logsFor(si).length) S.order = S.order.filter(x => x !== si); }
      if (nS(si) > 1) { S.extra = S.extra || {}; S.extra[si] = (S.extra[si] || 0) - 1; }
      S.swiped = null; S.msg = null; S.draft = makeDraft(si); break;
    }
    case 'delSet': if (nS(si) > logsFor(si).length && nS(si) > 1) { S.extra = S.extra || {}; S.extra[si] = (S.extra[si] || 0) - 1; } break;
    case 'prioSheet': S.prioSheet = true; break;
    case 'prioClose': S.prioSheet = false; break;
    case 'fold': S.fold[si] = !S.fold[si]; break;
    case 'orderOk': S.orderOk[si] = true; break;
    case 'conflictOk': S.conflictOk[si] = true; break;
    case 'bodyOpen': S.bodySheet = true; break;
    case 'sw':
      if (!S.startAt) S.startAt = Date.now();
      else if (S.pausedAt) { S.pausedTotal = (S.pausedTotal || 0) + Date.now() - S.pausedAt; S.pausedAt = null; }
      else S.pausedAt = Date.now();
      break;
    case 'bodyClose': S.bodySheet = false; break;
    case 'bodyMode': S.bodyMode = v; break;
    case 'altSheet': S.ed = si; S.altSheet = true; break;
    case 'altSheetClose': S.altSheet = false; break;
    case 'exInfo': S.exInfo = v; break;
    case 'biOn': { const [a, b] = v.split(',').map(Number); Object.keys(S.bi).forEach(k => { const [x, y] = k.split('-').map(Number); if ([x, y].some(z => z === a || z === b)) delete S.bi[k]; }); S.bi[biKey(a, b)] = true; S.fold[a] = false; S.fold[b] = false; break; }
    case 'biOff': delete S.bi[v]; break;
    case 'dropAdd': { const ls = logsFor(si), l = ls[ls.length - 1]; if (!l) break; l.drops = l.drops || []; const base = l.drops.length ? l.drops[l.drops.length - 1].w : l.w; l.drops.push({ w: dropW(base), r: null }); if (S.restEnd) S.restEnd = Date.now() + S.restLen * 1000; break; }
    case 'dropNow': { if (isDone(si)) break; const n = logsFor(si).length; act('log'); if (logsFor(si).length === n) return; if (S.si !== si) { S.si = si; S.draft = makeDraft(si); S.msg = null; S.scrollCur = false; } act('dropAdd'); return; }
    case 'dropDel': { const [i, k] = v.split(',').map(Number), l = logsFor(si)[i]; if (l && l.drops) l.drops.splice(k, 1); break; }
    case 'exInfoClose': S.exInfo = null; break;
    case 'pickOpen': S.pick = v; S.q = ''; break;
    case 'pickClose': S.pick = null; break;
    case 'pickEx': {
      const e = EX[v];
      if (S.pick === 'new') {
        DAY.push({ name: e.n.split(' ').slice(0, 2).join(' '), sets: 3, reps: e.s.length ? [8,10] : [12,15], prio: e.s.length ? 'alta' : 'baja', type: e.s.length ? 'comp' : 'iso', alts: [v] });
        S.ed = DAY.length - 1;
        S.pick = null; resetSession(); break;
      } else if (DAY[S.ed].alts.length < MAXALT && !DAY[S.ed].alts.includes(v)) DAY[S.ed].alts.push(v);
      S.pick = null; afterAltEdit(); break;
    }
  }
  render();
}

// ---------- Vistas ----------
const tag = () => '';
const ord = n => `${n}º`;

function foldedCard(j) {
  unitSlot = j;
  const x = DAY[j], ex = exOf(j), lg = logsFor(j), dn = isDone(j), ct = cutSet().has(j);
  const st = dn ? `✓ ${lg.map(l=>`${fmt(toU(l.w))}×${l.r}`).join(', ')}` : ct ? 'Se recorta hoy' : lg.length ? `${lg.length}/${nS(j)} series · ${lg.map(l=>`${fmt(toU(l.w))}×${l.r}`).join(', ')}` : `${nS(j)} series · ${x.reps[0]}-${x.reps[1]} reps`;
  return `<section class="card fold-card ${dn?'done':''} ${ct?'cut':''} ${biPartner(j) != null ? (biFirst(j) ? 'bi-a' : 'bi-b') : ''}" data-slot="${j}" data-a="fold">
      <div class="slot-head">
        <button class="fold-btn" data-a="fold" aria-expanded="false"><span class="fold-chev" aria-hidden="true">›</span><h2 class="slot-line">Slot ${j+1}: ${x.name} <span class="muted slot-type">· ${x.type==='comp'?'Compuesto':'Aislado'}</span></h2></button>
        ${prioIcon(x.prio)}
      </div>
      <button class="fold-sub" data-a="fold"><span>${ex.n}</span><span class="muted"> · ${st}</span></button>
    </section>`;
}

function biLink(a, b) {
  if (S.bi[biKey(a, b)]) return `<div class="bi-link on"><span class="bi-tag">⇅ Biserie · sin descanso entre los dos</span><button data-a="biOff" data-v="${biKey(a, b)}">Separar</button></div>`;
  return `<div class="bi-link"><button data-a="biOn" data-v="${a},${b}" aria-label="Hacer ${DAY[a].name} y ${DAY[b].name} en biserie">⇅ Unir en biserie</button></div>`;
}
function viewHoy() {
  return `
    ${S.returnTo != null ? `<div class="banner"><span>Haciendo esto mientras esperas <b>${DAY[S.returnTo].name.toLowerCase()}</b>.</span><button class="btn" data-a="back">Se liberó</button></div>` : ''}
    ${viewOrder().map((j, k, v) => (k ? biLink(v[k - 1], j) : '') + (S.fold[j] ? foldedCard(j) : slotCard(j))).join('')}${(unitSlot = null, '')}
    <button class="btn ghost block" data-a="reset">Reiniciar el ejemplo</button>`;
}

function slotCard(si) {
  unitSlot = si;
  const act0 = si === S.si, DR = act0 ? S.draft : makeDraft(si);
  const d = DAY[si], e = exOf(si), ls = logsFor(si), done = isDone(si), cut = cutSet();
  const p = pos(si), filler = findFiller(si);
  const allBusy = d.alts.every(x => S.busy[x]);

  const strip = DAY.map((x, j) => `<button class="chip-slot ${j===si?'cur':''} ${isDone(j)?'done':''} ${cut.has(j)?'cut':''}" data-a="jump" data-v="${j}" aria-label="${x.name}">
      <span class="n">${isDone(j) ? '✓' : j+1}</span><span class="l">${x.name}</span></button>`).join('');

  const alts = d.alts.map((id, k) => {
    const x = EX[id], on = k === altIdx(si), b = !!S.busy[id];
    return `<button class="opt ${on?'on':''} ${b?'busy':''}" data-a="pick" data-v="${k}" aria-pressed="${on}" aria-label="${LET[k]}: ${x.n}">
      <span class="opt-pic">${IMG[id] ? `<img src="${IMG[id][0]}" alt=""><img class="f2" src="${IMG[id][1]}" alt="">` : `<span class="opt-n">${SHORT[id] || x.n}</span>`}<span class="opt-l">${LET[k]}</span><span class="opt-info" role="button" tabindex="0" data-a="exInfo" data-v="${id}" aria-label="Técnica de ${x.n}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="2" cy="6" r="1.4"/><circle cx="6" cy="6" r="1.4"/><circle cx="10" cy="6" r="1.4"/></svg></span></span>
      <span class="opt-s">${x.last ? `${fmt(x.last.w)} kg` : 'Nuevo'}</span>
      ${b ? '<span class="opt-b">Ocupado</span>' : ''}</button>`;
  }).join('');

  let swapHtml = '';
  if (S.swap && S.swap.none) {
    swapHtml = `<div class="note warn flash"><b>Las tres opciones están ocupadas.</b>${filler != null
      ? `<span>No esperes parado: haz ${DAY[filler].name.toLowerCase()} (${exOf(filler).n.toLowerCase()}) mientras se libera. No cansa ${muscles(si).filter(m=>m!=='front').map(m=>MUS[m].toLowerCase()).join(' ni ')}.</span>`
      : `<span>No queda un aislado que no interfiera. Descansa un poco más o pasa al siguiente compuesto.</span>`}</div>
      ${filler != null ? `<div class="btn-row"><button class="btn primary" data-a="filler" data-v="${filler}">Hacer ${DAY[filler].name.toLowerCase()}</button><button class="btn ghost" data-a="free">Se liberó una</button></div>` : ''}
      ${tag('esperar turno sin saber qué hacer mientras tanto')}`;
  } else if (S.swap) {
    swapHtml = `<div class="note info flash"><b>Cambiado: ${S.swap.to}.</b><span>Cuenta igual para la rutina. ${S.swap.from} quedó marcado como ocupado.</span></div>`;
  }

  const chosen = true; // opciones siempre compactas, la A elegida y las series a la vista
  const restL = S.restEnd ? Math.max(0, Math.round((S.restEnd - Date.now())/1000)) : null;
  const msgH = S.msg ? `<div class="note ${S.msg.cls} flash"><b>${S.msg.t}</b><span>${S.msg.s}</span></div>` : '';
  const actions = isDone(si)
    ? `${msgH}<div><button class="btn primary block" data-a="next">${S.returnTo != null ? `Volver a ${DAY[S.returnTo].name.toLowerCase()}` : 'Siguiente ejercicio'}</button></div>`
    : `${restL != null ? `<div class="rest"><span><span class="small">Descanso</span><br><span class="t" id="restT">${Math.floor(restL/60)}:${String(restL%60).padStart(2,'0')}</span></span><button data-a="skipRest">Saltar</button></div>` : ''}${msgH}
`;
  const cf = !done && !ls.length && !S.conflictOk[si] ? conflictFor(si) : null;
  const conflictWarn = cf != null ? (() => { const m = share(si, cf).filter(x => x !== 'front').map(x => MUS[x].toLowerCase()); return `<div class="note warn ord-note"><div><b>Ojo: ${d.name.toLowerCase()} antes de ${DAY[cf].name.toLowerCase()}.</b><span>Cansa ${m.join(' y ') || 'los mismos músculos'}, que necesitas en ${DAY[cf].name.toLowerCase()} (prioridad alta). Puedes rendir menos ahí.</span></div><button class="ok-btn" data-a="conflictOk">OK</button></div>`; })() : '';
  const ordChanged = e.last && e.last.pos !== p;
  const orderShort = ordChanged ? ` Hoy va de ${ord(p)} (antes ${ord(e.last.pos)}): ${p > e.last.pos ? 'es normal rendir algo menos' : 'es normal rendir algo más'}.` : '';

    if (c) {
      const m = ex.p[0], kept = DAY.map((dd,k)=>k).filter(k=>k!==r.si && !tp.cut.has(k) && !isDone(k));
      const indirect = kept.reduce((a,k)=>a + (exOf(k).p.includes(m)?nS(k)-logsFor(k).length:0) + (exOf(k).s.includes(m)?(nS(k)-logsFor(k).length)*0.5:0), 0) + S.logs.reduce((a,l)=>a+(EX[l.ex].p.includes(m)?1:EX[l.ex].s.includes(m)?0.5:0),0);

function viewSemana() {
  const now = weekly(false), proj = weekly(true);
  const keys = Object.keys(META);
  const maxV = 18;
  const ratio = k => proj[k] / META[k][0];
  const behindK = [...keys].sort((a,b)=>ratio(a)-ratio(b)).slice(0,1);
  const bars = keys.map(k => {
    const [lo, hi] = META[k], b = proj[k] < lo;
    return `<div class="bar-row ${b && behindK.includes(k) ? 'behind' : ''}">
      <div class="bar-top"><span class="m">${MUS[k]}</span><span class="v">${fmt(now[k])}<span class="muted small"> / ${lo}-${hi}${proj[k] > now[k] ? ` · al cerrar hoy ${fmt(proj[k])}` : ''}</span></span></div>
      <div class="bar"><span class="zone" style="left:${lo/maxV*100}%;width:${(hi-lo)/maxV*100}%"></span><span class="proj" style="width:${Math.min(proj[k],maxV)/maxV*100}%"></span><span class="fill" style="width:${Math.min(now[k],maxV)/maxV*100}%"></span></div></div>`;
  }).join('');

  // Día 4
  const def = keys.map(k => ({ k, d: META[k][0] - proj[k], r: proj[k] / META[k][0] })).filter(x => x.d > 0.5).sort((a,b)=>a.r-b.r).slice(0,5);
  const d4 = def.length ? def.map((x,i)=>`<div class="d4-row"><span class="i">${i+1}</span><div><div style="font-weight:600">${D4LIB[x.k]}</div><div class="small muted">${MUS[x.k]}: faltan ${fmt(x.d)} series</div></div><span class="s">${Math.min(4, Math.max(2, Math.round(x.d)))} series</span></div>`).join('')
    : `<p class="small">No falta nada: segunda dosis liviana de tren superior (1 press, 1 remo, 1 lateral, 1 de brazos, 2-3 series cada uno).</p>`;

  return `
    <div><span class="eyebrow">Semana del 20 al 26 de noviembre</span><h1>Series duras por músculo</h1></div>
    <p class="small muted">Hecho: día 2 (lunes) y día 3 (miércoles, recortado). Hoy jueves: día 1. Lo que registres en Hoy se suma aquí al instante.</p>
    <section class="card">
      <div class="legend"><span><i style="background:var(--accent)"></i>Hecho</span><span><i style="background:var(--accent-soft);outline:1px dashed var(--accent)"></i>Si terminas hoy</span><span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>Meta</span></div>
      <div class="bars">${bars}</div>

    <section class="card">
      <div><span class="eyebrow">Cómo se cuenta</span><h3>No todas las series valen lo mismo</h3></div>
      <p class="small">Una serie suma <b>1</b> al músculo principal y <b>0,5</b> a los que ayudan. Una serie de press de banca suma 1 a pecho y 0,5 a tríceps. Por eso, si recortas tríceps un día de press, no quedas en cero.</p>
      ${tag('tratar una serie de curl igual que una de dominadas')}
    </section>
    <section class="card">
      <div><span class="eyebrow">Día 4 de rescate · sábado</span><h3>Completa lo que va atrasado</h3></div>
      <div class="d4">${d4}</div>
      <p class="small muted">Se calcula con lo que llevarías al terminar hoy. Si recortas algo, aparece aquí.</p>

}

      <div class="a"><span class="eyebrow">Aislados</span><span class="big">Fallo al final</span><span class="small">Laterales, curl, tríceps, pantorrillas. 1-2 en reserva hasta la última serie; en esa, dalo todo. Descansa 60-90 s.</span></div>

function pickerHtml() {
  const used = S.pick === 'new' ? [] : DAY[S.ed].alts;

  let list = Object.entries(EX).filter(([id, e]) => !used.includes(id) && (!q || e.n.toLowerCase().includes(q) || e.eq.toLowerCase().includes(q) || e.p.some(m => MUS[m].toLowerCase().includes(q))));
  if (ref) list.sort((a, b) => (b[1].p[0] === ref.p[0]) - (a[1].p[0] === ref.p[0]));

// Muñeco de músculos: se pinta según lo que llevas hoy (o en la semana)
function bodyLevels(mode) {
  const lv = {};
  if (mode === 'semana') {
    const w = weekly(false);
    Object.keys(META).forEach(m => lv[m] = { v: Math.min(1, w[m] / META[m][0]), a: w[m], b: META[m][0] });
    lv.front = lv.lat ? { ...lv.lat, v: lv.pecho.v } : null;
    return lv;
  }
  const plan = {}, done = {};
  const add = (t, e, k) => { e.p.forEach(m => t[m] = (t[m] || 0) + k); e.s.forEach(m => t[m] = (t[m] || 0) + k * 0.5); };
  const cut = cutSet();
  DAY.forEach((d, si) => { if (!cut.has(si) || logsFor(si).length) add(plan, exOf(si), Math.max(nS(si), logsFor(si).length)); });
  S.logs.forEach(l => add(done, EX[l.ex], 1));
  Object.keys(plan).forEach(m => lv[m] = { v: Math.min(1, (done[m] || 0) / plan[m]), a: done[m] || 0, b: plan[m] });
  return lv;
}
// Muñeco de músculos (frente y espalda). Se define la mitad derecha (x ≥ 50) y se espeja.
// Cada región tiene un músculo; REGION_GRUPO dice qué grupo de la app la pinta.
const closedPath = pts => {
  const n = pts.length, P = i => pts[(i + n) % n];
  let d = `M${P(0)[0]},${P(0)[1]}`;
  for (let i = 0; i < n; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d + 'Z';
};
const openPath = pts => closedPath(pts).replace(/C[^C]*$/, '').replace(/Z$/, '');

// fill(grupo) → color o null (piel). part: 'front' | 'back' | undefined (ambas).
function bodyFigure(fill, part, cls = 'bodyfig') {
  const color = r => { for (const g of REGION_GRUPO[r] || []) { const c = fill(g); if (c) return c; } return null; };
  const one = (list, lines, back) => {
    // los músculos que tocan van al final, para que su borde marcado quede encima de los vecinos
    const regs = [...list].sort((a, b) => !!color(a[0]) - !!color(b[0])).map(([r, pts]) => { const c = color(r); return [pts, mirror(pts)].map(q => `<path class="m${c ? ' on' : ''}" data-r="${r}" d="${closedPath(q)}" fill="${c || 'var(--fig-skin)'}"/>`).join(''); }).join('');
    const ln = lines.map(pts => [pts, mirror(pts)].map(q => `<path class="ln" d="${openPath(q)}"/>`).join('')).join('');
    const ears = [EAR, mirror(EAR)].map(q => `<path class="sk" d="${closedPath(q)}"/>`).join('');
    const neck = back ? '' : `<path class="ln" d="M50,36 L50,57.6"/>`;
    return `<path class="sk" d="${SIL}"/>${regs}${ln}${neck}${ears}<path class="sk" d="${HEAD}"/>`;
  };
  const f = one(FRONT, FRONT_LINES, false), b = one(BACK, BACK_LINES, true);
  if (part) return `<svg class="${cls}" viewBox="-1 -1 102 214" aria-hidden="true">${part === 'front' ? f : b}</svg>`;
  return `<svg class="${cls}" viewBox="-1 -1 216 214" aria-hidden="true"><g>${f}</g><g transform="translate(114,0)">${b}</g></svg>`;
}
function bodySvg(lv, part) {
  // músculo que toca: borde rojo desde el inicio; el relleno pasa de piel a rojo según el avance
  return bodyFigure(m => { const x = lv[m]; return x ? `color-mix(in srgb, var(--heat-1) ${Math.round(x.v * 100)}%, var(--fig-skin))` : null; }, part);
}
function clockTxt() {
  const fm = sec => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  const cut = cutSet();
  const left = Math.round(DAY.reduce((a, d, si) => a + (isDone(si) || cut.has(si) ? 0 : slotMins(si, nS(si) - logsFor(si).length)), 0));
  const run = S.startAt && !S.pausedAt;
  const btn = `<button class="sw ${run ? 'on' : ''}" data-a="sw" aria-label="${run ? 'Pausar cronómetro' : 'Iniciar cronómetro'}">${run ? '<svg viewBox="0 0 10 10"><rect x="2" y="1.5" width="2" height="7" rx=".5"/><rect x="6" y="1.5" width="2" height="7" rx=".5"/></svg>' : '<svg viewBox="0 0 10 10"><path d="M2.5 1.5v7l6-3.5z"/></svg>'}</button>`;
  return `${btn}<b class="sw-t" id="swT">${fm(swElapsed())}</b><span> · ${!S.startAt ? `rutina de ~${left} min` : left ? `faltan ~${left} min` : 'terminada'}</span>`;
}
const swElapsed = () => !S.startAt ? 0 : Math.max(0, Math.round(((S.pausedAt || Date.now()) - S.startAt - (S.pausedTotal || 0)) / 1000));
function bodyFab() {
  const total = DAY.reduce((a, d, si) => a + (cutSet().has(si) && !logsFor(si).length ? 0 : Math.max(nS(si), logsFor(si).length)), 0);

}

  S.pulse = false;
  setHp();
  if (S.scrollCur) { S.scrollCur = false; const c = r.querySelector('.cur-card'); if (c) c.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
}

// deslizar una serie a la izquierda muestra "Eliminar": la fila sigue al dedo y al soltar se abre o se cierra
const SW_W = 84;
let swX = null, swY = 0, swRow = null, swEl = null, swBase = 0, swDrag = false;
document.addEventListener('pointerdown', ev => {
  const r = ev.target.closest('.sl-swipe'); swX = ev.clientX; swY = ev.clientY; swDrag = false;
  swRow = r ? `${r.closest("[data-slot]").dataset.slot}-${r.dataset.row}` : null;
  swEl = r ? r.querySelector('.sl-row') : null; swBase = r && r.classList.contains('open') ? -SW_W : 0;
});
document.addEventListener('pointermove', ev => {
  if (swX == null || !swEl) return;
  const dx = ev.clientX - swX, dy = ev.clientY - swY;
  if (!swDrag) { if (Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(dy)) return; swDrag = true; swEl.style.transition = 'none'; }
  let x = swBase + dx;
  if (x < -SW_W) x = -SW_W - (-SW_W - x) * 0.3; // resistencia más allá del botón
  if (x > 0) x = 0;
  swEl.style.transform = `translateX(${x}px)`;
});
document.addEventListener('pointerup', ev => {
  if (swX == null) return; const dx = ev.clientX - swX; swX = null;
  if (swDrag && swEl) {
    const x = swBase + dx, open = x < -SW_W / 2;
    swEl.style.transition = ''; swEl.style.transform = open ? `translateX(${-SW_W}px)` : '';
    const was = S.swiped; S.swiped = open ? swRow : (S.swiped === swRow ? null : S.swiped);
    swDrag = false; swEl = null; lp.suppress = true; setTimeout(() => { lp.suppress = false; }, 350);
    if (S.swiped !== was) setTimeout(render, 200);
    return;
  }
  swEl = null;
  if (S.swiped != null && Math.abs(dx) < 5 && !ev.target.closest('.sl-del')) { S.swiped = null; render(); }
});
document.addEventListener('pointercancel', () => { if (swEl) { swEl.style.transition = ''; swEl.style.transform = ''; } swX = null; swEl = null; swDrag = false; });
// al bajar, el encabezado achica el texto y agranda el muñeco (frente y espalda por separado)
let hpRaf = 0;
const setHp = () => { hpRaf = 0; const t = document.querySelector('.top'); if (t) t.style.setProperty('--hp', Math.min(1, Math.max(0, scrollY / 140)).toFixed(3)); };
addEventListener('scroll', () => { if (!hpRaf) hpRaf = requestAnimationFrame(setHp); }, { passive: true });

// mantener apretado el encabezado de un slot para moverlo
const lp = { timer: null, active: false, el: null, slot: null, y0: 0, x0: 0, target: null, suppress: false };
function lpEnd() { clearTimeout(lp.timer); lp.timer = null; document.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after')); }
document.addEventListener('pointerdown', ev => {
  const h = ev.target.closest('.slot-head'); const c = h && h.closest('[data-slot]'); if (!c || S.tab !== 'hoy') return;
  Object.assign(lp, { el: c, slot: +c.dataset.slot, y0: ev.clientY, x0: ev.clientX, active: false, target: null });
  lp.timer = setTimeout(() => { lp.active = true; c.classList.add('dragging'); if (navigator.vibrate) navigator.vibrate(15); }, 450);
});
document.addEventListener('pointermove', ev => {
  if (!lp.el) return;
  if (!lp.active) { if (Math.hypot(ev.clientX - lp.x0, ev.clientY - lp.y0) > 8) { lpEnd(); lp.el = null; } return; }
  ev.preventDefault();
  lp.el.style.transform = `translateY(${ev.clientY - lp.y0}px)`;
  if (ev.clientY < 110) scrollBy(0, -14); else if (ev.clientY > innerHeight - 90) scrollBy(0, 14);
  const cards = [...document.querySelectorAll('main [data-slot]')].filter(x => x !== lp.el);
  document.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
  let t = cards.find(x => { const r = x.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
  if (t) { t.classList.add('drop-before'); lp.target = { slot: +t.dataset.slot, after: false }; }
  else if (cards.length) { const l = cards[cards.length - 1]; l.classList.add('drop-after'); lp.target = { slot: +l.dataset.slot, after: true }; }
}, { passive: false });
document.addEventListener('touchmove', ev => { if (lp.active) ev.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', ev => { if (ev.target.closest('.slot-head')) ev.preventDefault(); });
const lpDrop = () => {
  const was = lp.active, el = lp.el, tg = lp.target, j = lp.slot; lpEnd(); lp.el = null; lp.active = false;
  if (!was) return; lp.suppress = true; setTimeout(() => { lp.suppress = false; }, 350);
  if (el) { el.classList.remove('dragging'); el.style.transform = ''; }
  if (!tg) { render(); return; }
  const oldV = viewOrder(), nv = oldV.filter(x => x !== j); let at = nv.indexOf(tg.slot) + (tg.after ? 1 : 0); nv.splice(at, 0, j);
  const c = reorderCheck(oldV, nv, j);
  if (c) {
    const m = share(c.lo, c.hi).filter(x => x !== 'front').map(x => MUS[x].toLowerCase());
    S.sheet = { title: `${DAY[c.lo].name} antes de ${DAY[c.hi].name}`, body: `${DAY[c.lo].name} cansa ${m.join(' y ') || 'los mismos músculos'}, que vas a necesitar en ${DAY[c.hi].name.toLowerCase()} (prioridad ${DAY[c.hi].prio}). Es posible que rindas menos ahí y no notes el progreso que esperas.`, foot: 'Si igual lo haces, la app guarda el orden y ajusta la comparación con la vez anterior.', reorder: nv };
  } else S.view = nv;
  render();
};
document.addEventListener('pointerup', lpDrop);
document.addEventListener('pointercancel', lpDrop);

// cada tarjeta abierta es su propio ejercicio: tocar dentro la vuelve la activa
function selSlot(ev) {
  const c = ev.target.closest && ev.target.closest('[data-slot]'); if (!c) return;
  const j = +c.dataset.slot; if (j === S.si) return;
  S.si = j; S.draft = makeDraft(j); S.swap = null; S.msg = null; S.showWhy = false;
}
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.drop != null) { selSlot(ev); const [i, k] = t.dataset.drop.split(',').map(Number), raw = parseFloat(String(t.value).replace(',', '.')); const l = logsFor(S.si)[i]; if (!isNaN(raw) && l && l.drops && l.drops[k]) l.drops[k][t.dataset.f] = t.dataset.f === 'w' ? fromU(raw) : raw; render(); return; }
  if (!t.dataset || t.dataset.set == null) return;
  selSlot(ev);
  const i = +t.dataset.set, f = t.dataset.f, raw = parseFloat(String(t.value).replace(',', '.')), v = f === 'w' ? fromU(raw) : raw;
  if (isNaN(v)) return;
  const si = S.si, l = logsFor(si)[i];
  if (l) l[f] = v;
  else if (i === logsFor(si).length) { S.draft[f] = v; const k = `${si}-${i}`; S.pre[k] = { ...(S.pre[k] || {}), [f]: v }; }
  else { const k = `${si}-${i}`; S.pre[k] = { ...(S.pre[k] || {}), [f]: v }; }
  render();
});
document.addEventListener('input', ev => {
  const k = ev.target.dataset && ev.target.dataset.in; if (!k) return;
  if (k === 'edName') { DAY[S.ed].name = ev.target.value; }
  if (k === 'q') { S.q = ev.target.value; const l = document.getElementById('pickList'); if (l) l.innerHTML = pickerHtml(); }
});
document.addEventListener('click', ev => {
  if (lp.suppress) { lp.suppress = false; ev.preventDefault(); return; }
  const b = ev.target.closest('[data-a]'); if (!b) return;
  selSlot(ev);
  act(b.dataset.a, b.dataset.v);
});
setInterval(() => {
  const ck = document.getElementById('swT'); if (ck && S.startAt && !S.pausedAt) { const e = swElapsed(); ck.textContent = `${Math.floor(e / 60)}:${String(e % 60).padStart(2, '0')}`; }
  if (!S.restEnd) return;
  const el = document.getElementById('restT'); if (!el) return;
  const left = Math.max(0, Math.round((S.restEnd - Date.now())/1000));
  el.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
}, 1000);
S.draft = makeDraft(0);
render();
</script>
