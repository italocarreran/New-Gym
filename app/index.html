}

const ICONS = {
  inicio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6"/></svg>',
  rutina:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  hoy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>',
  semana:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  guia:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};

function render() {
  if (S.pantalla) { document.getElementById('root').innerHTML = S.pantalla === 'login' ? viewLogin() : '<p style="padding:24px">Cargando…</p>'; return; }
  HOY = new Date(); HOY.setHours(0, 0, 0, 0);
  const views = { inicio: () => viewInicioApp() + cuentaCard(), hoy: viewHoy, semana: viewSemana, guia: viewGuia, rutina: viewRutina };
  const r = document.getElementById('root');
  const home = S.tab === 'hoy' && S.home;
  useDay(S.rut);
  const fab = home || S.tab === 'inicio' ? bodyFab('semana') : bodyFab(), clk = S.tab === 'inicio' ? `${HIST.filter(h => h.f.getMonth() === HOY.getMonth() && h.f.getFullYear() === HOY.getFullYear()).length} entrenamientos en ${MESES_L[HOY.getMonth()]}` : home ? `${RUT.length} rutina${RUT.length === 1 ? '' : 's'} en rotación` : clockTxt();
  useDay(S.tab === 'rutina' ? S.edRut : S.rut);
  r.innerHTML = `<main class="app ${S.tags ? '' : 'hide-tags'}">
    <header class="top">
      <div class="top-l"><span class="eyebrow">${fechaHoy()}${home || S.tab === 'inicio' ? '' : ` · Día ${S.rut + 1}`}</span><h1>${S.tab==='inicio'?'Inicio':S.tab==='hoy'?(home ? '¿Qué entrenas hoy?' : RUT[S.rut].name):S.tab==='semana'?'Tu semana':S.tab==='rutina'?'Tu rutina':'Guía'}</h1><span class="clock" id="clock">${clk}</span></div>
      ${fab}
    </header>
    ${views[S.tab]()}
  </main>
  <nav class="tabs"><div class="tabs-in">
    ${[['inicio','Inicio'],['hoy','Sesión'],['rutina','Editar'],['guia','Esfuerzo']].map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-v="${k}">${ICONS[k]}${l}</button>`).join('')}
  </div></nav>
  ${S.bodySheet ? (() => { useDay(S.rut); const h = bodySheet(); useDay(S.tab === 'rutina' ? S.edRut : S.rut); return h; })() : ''}
  ${S.exInfo ? exInfoSheet(S.exInfo) : ''}
  ${S.prioSheet ? `<div class="sheet-bg" data-a="prioClose"><div class="sheet" data-a="noop">
    <span class="eyebrow">${DAY[S.si].name}</span><h2>Prioridad ${DAY[S.si].prio}</h2>
    <div class="plegend">${['alta','media','baja'].map(k => `<div class="${k === DAY[S.si].prio ? 'cur' : ''}"><span class="pico ${k}">${prioSvg(k)}</span><span><b>${k[0].toUpperCase() + k.slice(1)}.</b> ${PRIO_TXT[k]}</span></div>`).join('')}</div>
    <button class="btn primary block" data-a="prioClose">Entendido</button>
  </div></div>` : ''}
  ${S.altSheet && !S.pick ? `<div class="sheet-bg" data-a="altSheetClose"><div class="sheet" data-a="noop">
    <span class="eyebrow">Opciones de ${DAY[S.ed].name.toLowerCase()}</span><h2>Ordena tus opciones</h2>
    <p class="small muted">La de arriba es tu primera opción y la que sale elegida al iniciar.</p>
    <div class="alts">${altRows(DAY[S.ed])}</div>
    ${DAY[S.ed].alts.length < MAXALT ? `<button class="btn ghost block" data-a="pickOpen" data-v="alt">+ Agregar otra opción</button>` : ''}
    <button class="btn primary block" data-a="altSheetClose">Listo</button>
  </div></div>` : ''}
${S.pick ? `<div class="sheet-bg" data-a="pickClose"><div class="sheet pick" data-a="noop">
      <span class="eyebrow">${S.pick === 'new' ? 'Nuevo slot' : S.pick === 'today' ? (S.insAfter != null ? `Después de ${DAY[S.insAfter].name.toLowerCase()}` : 'Al final de la rutina de hoy') : `Opción ${LET[DAY[S.ed].alts.length]} para ${DAY[S.ed].name}`}</span>
      <h2>${S.pick === 'today' ? 'Agregar ejercicio a hoy' : 'Elige un ejercicio'}</h2>
      ${S.pick === 'today' && S.insAfter != null ? `<div class="seg"><button class="${S.insBi ? '' : 'on'}" data-a="insBi" data-v="0">Solo agregar</button><button class="${S.insBi ? 'on' : ''}" data-a="insBi" data-v="1">⇅ En biserie con ${DAY[S.insAfter].name.toLowerCase()}</button></div>` : ''}
      ${S.pick !== 'new' && S.pick !== 'today' ? '<p class="small muted">Arriba salen los que trabajan el mismo músculo principal.</p>' : ''}
      <input id="pickQ" class="txt" data-in="q" placeholder="Busca por nombre, equipo o músculo" value="${S.q||''}">
      <div class="alts pick-list" id="pickList">${pickerHtml()}</div>
      <button class="btn ghost block" data-a="pickClose">Cancelar</button>
    </div></div>` : ''}
  ${S.sheet ? `<div class="sheet-bg" data-a="sheetClose"><div class="sheet" data-a="noop">
    <span class="eyebrow">Ojo con el orden</span><h2>${S.sheet.title}</h2><p>${S.sheet.body}</p><p class="small muted">${S.sheet.foot}</p>
    ${tag('cambiar el orden sin saber que afecta el rendimiento')}
    <div class="btn-row"><button class="btn ghost" data-a="sheetClose">Mantener orden</button><button class="btn primary" data-a="sheetGo">Hacerlo igual</button></div>
  </div></div>` : ''}`;
  S.pulse = false; S.restIn = false;
  if (S.focusName) { S.focusName = false; const n = document.getElementById('rutName'); if (n) { n.focus(); n.select(); } }
  setHp();
  { const wk = r.querySelector('.wk.sel'), c = wk && wk.parentElement; if (c) c.scrollLeft = wk.offsetLeft - c.offsetLeft - (c.clientWidth - wk.offsetWidth) / 2; }
  if (S.scrollCur) { S.scrollCur = false; const c = r.querySelector('.cur-card'); if (c) c.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
}

// deslizar una serie a la izquierda muestra "Eliminar": la fila sigue al dedo y al soltar se abre o se cierra
const SW_W = 84;
let swX = null, swY = 0, swRow = null, swEl = null, swBase = 0, swDrag = false;
document.addEventListener('pointerdown', ev => {
  const r = ev.target.closest('.sl-swipe'); swX = ev.clientX; swY = ev.clientY; swDrag = false;
  swRow = r ? `${r.closest("[data-slot]").dataset.slot}-${r.dataset.row}` : null;
  swEl = r ? r.querySelector('.sl-row') : null; swBase = r && r.classList.contains('open') ? -SW_W : 0;
});
document.addEventListener('pointermove', ev => {
  if (swX == null || !swEl) return;
  const dx = ev.clientX - swX, dy = ev.clientY - swY;
  if (!swDrag) { if (Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(dy)) return; swDrag = true; swEl.style.transition = 'none'; }
  let x = swBase + dx;
  if (x < -SW_W) x = -SW_W - (-SW_W - x) * 0.3; // resistencia más allá del botón
  if (x > 0) x = 0;
  swEl.style.transform = `translateX(${x}px)`;
});
document.addEventListener('pointerup', ev => {
  if (swX == null) return; const dx = ev.clientX - swX; swX = null;
  if (swDrag && swEl) {
    const x = swBase + dx, open = x < -SW_W / 2;
    swEl.style.transition = ''; swEl.style.transform = open ? `translateX(${-SW_W}px)` : '';
    const was = S.swiped; S.swiped = open ? swRow : (S.swiped === swRow ? null : S.swiped);
    swDrag = false; swEl = null; lp.suppress = true; setTimeout(() => { lp.suppress = false; }, 350);
    if (S.swiped !== was) setTimeout(render, 200);
    return;
  }
  swEl = null;
  if (S.swiped != null && Math.abs(dx) < 5 && !ev.target.closest('.sl-del')) { S.swiped = null; render(); }
});
document.addEventListener('pointercancel', () => { if (swEl) { swEl.style.transition = ''; swEl.style.transform = ''; } swX = null; swEl = null; swDrag = false; });
// al bajar, el encabezado achica el texto y agranda el muñeco (frente y espalda por separado)
let hpRaf = 0;
const setHp = () => { hpRaf = 0; const t = document.querySelector('.top'); if (t) t.style.setProperty('--hp', Math.min(1, Math.max(0, scrollY / 140)).toFixed(3)); };
addEventListener('scroll', () => { if (!hpRaf) hpRaf = requestAnimationFrame(setHp); }, { passive: true });

// mantener apretado el encabezado de un slot para moverlo
const lp = { timer: null, active: false, el: null, slot: null, y0: 0, x0: 0, target: null, suppress: false };
function lpEnd() { clearTimeout(lp.timer); lp.timer = null; document.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after')); }
document.addEventListener('pointerdown', ev => {
  const h = ev.target.closest('.slot-head'); const c = h && h.closest('[data-slot]'); if (!c || S.tab !== 'hoy') return;
  Object.assign(lp, { el: c, slot: +c.dataset.slot, y0: ev.clientY, x0: ev.clientX, active: false, target: null });
  lp.timer = setTimeout(() => { lp.active = true; c.classList.add('dragging'); if (navigator.vibrate) navigator.vibrate(15); }, 450);
});
document.addEventListener('pointermove', ev => {
  if (!lp.el) return;
  if (!lp.active) { if (Math.hypot(ev.clientX - lp.x0, ev.clientY - lp.y0) > 8) { lpEnd(); lp.el = null; } return; }
  ev.preventDefault();
  lp.el.style.transform = `translateY(${ev.clientY - lp.y0}px)`;
  if (ev.clientY < 110) scrollBy(0, -14); else if (ev.clientY > innerHeight - 90) scrollBy(0, 14);
  const cards = [...document.querySelectorAll('main [data-slot]')].filter(x => x !== lp.el);
  document.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
  let t = cards.find(x => { const r = x.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
  if (t) { t.classList.add('drop-before'); lp.target = { slot: +t.dataset.slot, after: false }; }
  else if (cards.length) { const l = cards[cards.length - 1]; l.classList.add('drop-after'); lp.target = { slot: +l.dataset.slot, after: true }; }
}, { passive: false });
document.addEventListener('touchmove', ev => { if (lp.active) ev.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', ev => { if (ev.target.closest('.slot-head')) ev.preventDefault(); });
const lpDrop = () => {
  const was = lp.active, el = lp.el, tg = lp.target, j = lp.slot; lpEnd(); lp.el = null; lp.active = false;
  if (!was) return; lp.suppress = true; setTimeout(() => { lp.suppress = false; }, 350);
  if (el) { el.classList.remove('dragging'); el.style.transform = ''; }
  if (!tg) { render(); return; }
  const oldV = viewOrder(), nv = oldV.filter(x => x !== j); let at = nv.indexOf(tg.slot) + (tg.after ? 1 : 0); nv.splice(at, 0, j);
  const c = reorderCheck(oldV, nv, j);
  if (c) {
    const m = share(c.lo, c.hi).filter(x => x !== 'front').map(x => MUS[x].toLowerCase());
    S.sheet = { title: `${DAY[c.lo].name} antes de ${DAY[c.hi].name}`, body: `${DAY[c.lo].name} cansa ${m.join(' y ') || 'los mismos músculos'}, que vas a necesitar en ${DAY[c.hi].name.toLowerCase()} (prioridad ${DAY[c.hi].prio}). Es posible que rindas menos ahí y no notes el progreso que esperas.`, foot: 'Si igual lo haces, la app guarda el orden y ajusta la comparación con la vez anterior.', reorder: nv };
  } else S.view = nv;
  render();
};
document.addEventListener('pointerup', lpDrop);
document.addEventListener('pointercancel', lpDrop);

// cada tarjeta abierta es su propio ejercicio: tocar dentro la vuelve la activa
function selSlot(ev) {
  const c = ev.target.closest && ev.target.closest('[data-slot]'); if (!c) return;
  const j = +c.dataset.slot; if (j === S.si) return;
  S.si = j; S.draft = makeDraft(j); S.swap = null; S.msg = null; S.showWhy = false;
}
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.drop != null) { selSlot(ev); const [i, k] = t.dataset.drop.split(',').map(Number), raw = parseFloat(String(t.value).replace(',', '.')); const l = logsFor(S.si)[i]; if (!isNaN(raw) && l && l.drops && l.drops[k]) { l.drops[k][t.dataset.f] = t.dataset.f === 'w' ? fromU(raw) : raw; cambiarDrop(S.si, l.drops[k]); } guardarTodo(); render(); return; }
  if (!t.dataset || t.dataset.set == null) return;
  selSlot(ev);
  const i = +t.dataset.set, f = t.dataset.f, raw = parseFloat(String(t.value).replace(',', '.')), v = f === 'w' ? fromU(raw) : raw;
  if (isNaN(v)) return;
  const si = S.si, l = logsFor(si)[i];
  if (l) { l[f] = v; cambiarSerie(si, l); }
  else if (i === logsFor(si).length) { S.draft[f] = v; const k = `${si}-${i}`; S.pre[k] = { ...(S.pre[k] || {}), [f]: v }; }
  else { const k = `${si}-${i}`; S.pre[k] = { ...(S.pre[k] || {}), [f]: v }; }
  guardarTodo();
  render();
});
document.addEventListener('input', ev => {
  const k = ev.target.dataset && ev.target.dataset.in; if (!k) return;
  if (k === 'edName') { DAY[S.ed].name = ev.target.value; }
  if (k === 'rutName') { RUT[S.edRut].name = ev.target.value; }
  if (k === 'edName' || k === 'rutName') guardarLuego();
  if (k === 'q') { S.q = ev.target.value; const l = document.getElementById('pickList'); if (l) l.innerHTML = pickerHtml(); }
});
document.addEventListener('click', ev => {
  if (lp.suppress) { lp.suppress = false; ev.preventDefault(); return; }
  const b = ev.target.closest('[data-a]'); if (!b) return;
  selSlot(ev);
  act(b.dataset.a, b.dataset.v);
});
setInterval(() => {
  const ck = document.getElementById('swT'); if (ck && S.startAt && !S.pausedAt) { const e = swElapsed(); ck.textContent = `${Math.floor(e / 60)}:${String(e % 60).padStart(2, '0')}`; }
  if (!S.restEnd) return;
  const el = document.getElementById('restT'); if (!el) return;
  const left = Math.max(0, Math.round((S.restEnd - Date.now())/1000));
  el.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  const bx = document.getElementById('restBox'); if (bx && S.restLen) { bx.style.setProperty('--p', Math.min(1, left / S.restLen).toFixed(3)); bx.classList.toggle('done', left === 0); }
}, 1000);
window.arrancarApp = arrancar;
</script>
<script type="module">
import { crearDatos } from './datos/index.js';
window.arrancarApp(crearDatos);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(e => console.warn('service worker', e));
</script>
