<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slot · App de gimnasio</title>
<meta name="theme-color" content="#EEF1F5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono-192.png">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: una columna tipo app de celular (máx. 480px), barra de pestañas fija abajo, todo operable con el pulgar */
:root {
  --bg: #EEF1F5;
  --surface: #FFFFFF;
  --surface-2: #E4E9F0;
  --ink: #131820;
  --muted: #5A6472;
  --line: #D5DCE5;
  --accent: #1E4FD8;
  --accent-soft: #DCE5FB;
  --accent-ink: #FFFFFF;
  --ok: #1D8048;
  --ok-soft: #DDF1E5;
  --warn: #9A6410;
  --warn-soft: #FBEFD9;
  --bad: #B8322A;
  --bad-soft: #F8E0DE;
  --tag: #6B4FC4;
  --tag-soft: #ECE6FA;
  --mus: #C0392B; --mus-0: #F2D3CF; --mus-off: #DCE1E8; --mus-dim: #BFC7D2; --heat-0: #F3A188; --heat-1: #B3241A;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
/* tema claro fijo (Italo 2026-11-25); el oscuro queda solo con data-theme="dark" */
:root[data-theme="dark"] {
  --bg: #0D1015; --surface: #161A21; --surface-2: #20262F; --ink: #E8ECF2; --muted: #96A0AD; --line: #2A313B;
  --accent: #7096FF; --accent-soft: #1C2A4D; --accent-ink: #0B1020;
  --ok: #4CC683; --ok-soft: #143222; --warn: #E8AE4C; --warn-soft: #3A2C12; --bad: #F2766B; --bad-soft: #3D1A18;
  --tag: #B39DFF; --tag-soft: #2A2245; color-scheme: dark;
  --mus: #F0675B; --mus-0: #3C2523; --mus-off: #262C35; --mus-dim: #3A434F; --heat-0: #F3A188; --heat-1: #C42A1F;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1; }
h2 { font-size: 22px; line-height: 1.05; }
h3 { font-size: 18px; }
p { margin: 0; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* encabezado */
.top { position: sticky; top: 0; z-index: 12; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -12px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; padding: 10px max(16px, env(safe-area-inset-left, 0px)) 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
.cur-card { scroll-margin-top: 96px; }
.top-l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.top { --hp: 0; }
.top .eyebrow { display: block; overflow: hidden; max-height: calc(16px * (1 - var(--hp))); opacity: calc(1 - var(--hp) * 1.4); }
.top h1 { font-size: calc(22px - 5px * var(--hp)); }
.clock { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.clock { display: flex; align-items: center; gap: 6px; }
.clock b { color: var(--ink); font-weight: 600; font-size: 15px; font-family: var(--display); letter-spacing: .02em; min-width: 34px; }
.sw { width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; padding: 0; flex: none; }
.sw.on { background: var(--surface-2); color: var(--ink); }
.sw svg { width: 10px; height: 10px; fill: currentColor; }
.top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.toggle { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
.toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.toggle[aria-pressed="true"] .dot { background: var(--tag); }

/* nota de "qué problema resuelve" */
.why-tag { display: flex; gap: 8px; align-items: flex-start; background: var(--tag-soft); color: var(--tag); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; font-weight: 500; }
.why-tag b { font-weight: 700; white-space: nowrap; }
.hide-tags .why-tag { display: none; }

/* tira de la sesión */
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.chip-slot { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 4px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.chip-slot .n { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1; }
.chip-slot .l { font-size: 10px; line-height: 1.15; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-slot.cur { border-color: var(--accent); background: var(--accent-soft); }
.chip-slot.done { background: var(--ok-soft); border-color: transparent; }
.chip-slot.done .n { color: var(--ok); }
.chip-slot.cut { opacity: .45; text-decoration: line-through; }
.prio { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; }
.prio.alta { background: var(--accent); color: var(--accent-ink); }
.prio.media { background: var(--accent-soft); color: var(--accent); }
.prio.baja { background: var(--surface-2); color: var(--muted); }

/* tarjeta principal */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.fold-btn { display: flex; align-items: center; gap: 3px; min-width: 0; flex: 1; background: none; border: 0; padding: 0; text-align: left; color: inherit; cursor: pointer; }
.fold-chev { display: inline-block; font-size: 17px; margin-left: -2px; line-height: 1; color: var(--muted); transition: transform .15s; }
.fold-chev.open { transform: rotate(90deg); }
.note.ord-note { flex-direction: row; align-items: center; gap: 10px; }
.ord-note > div { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.ok-btn { flex: none; padding: 6px 14px; border-radius: 8px; border: 1px solid currentColor; background: transparent; color: inherit; font-weight: 600; font-size: 13px; cursor: pointer; }
.slot-head { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.card.dragging { position: relative; z-index: 14; box-shadow: 0 14px 34px rgba(10, 20, 40, .28); opacity: .96; transition: none; }
.drop-before { box-shadow: 0 -4px 0 0 var(--accent); }
.drop-after { box-shadow: 0 4px 0 0 var(--accent); }
.fold-card, .cur-card.folded { padding-block: 12px; gap: 2px; }
.fold-card { cursor: pointer; }
.fold-card.done .slot-line { color: var(--ok); }
.fold-card.cut { opacity: .5; }
.fold-sub { display: block; width: 100%; margin-top: 2px; padding: 0 0 0 17px; background: none; border: 0; text-align: left; font-size: 12.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.fold-sum { display: flex; flex-direction: column; gap: 2px; width: 100%; margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); text-align: left; font-size: 13px; color: var(--ink); cursor: pointer; }
.fold-sum .muted { font-size: 12px; }
.slot-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.slot-line { font-size: 18px; min-width: 0; }
.slot-type { font-family: var(--body); font-size: 13px; font-weight: 500; }
.pico { border: none; background: var(--surface-2); border-radius: 8px; width: 34px; height: 30px; display: grid; place-items: center; padding: 0; flex-shrink: 0; }
.pico svg { width: 18px; height: 16px; }
.pico.alta { color: var(--bad); background: var(--bad-soft); }
.pico.media { color: var(--warn); background: var(--warn-soft); }
.pico.baja { color: var(--muted); }
.plegend { display: flex; flex-direction: column; gap: 8px; }
.plegend div { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 10px; align-items: center; font-size: 13.5px; }
.plegend div.cur { font-weight: 600; }
.slot-head .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.target { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1; text-align: right; white-space: nowrap; }
.target small { display: block; font-family: var(--body); font-size: 11px; font-weight: 500; color: var(--muted); }

.alts { display: flex; flex-direction: column; gap: 6px; }
.alt { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; background: var(--surface); text-align: left; width: 100%; }
.alt .letter { font-family: var(--display); font-weight: 700; font-size: 20px; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); }
.alt.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.alt.on .letter { background: var(--accent); color: var(--accent-ink); }
.alt.busy { opacity: .55; }
.setlist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cells { display: grid; grid-template-columns: 1.15fr 1fr .9fr; gap: 3px; }
.cellw { display: flex; align-items: center; gap: 3px; min-width: 0; }
.cellw .u { font-size: 10px; color: var(--muted); font-weight: 500; }
.unit-sw { display: inline-flex; justify-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; cursor: pointer; font: inherit; }
.unit-sw span { border: none; background: transparent; border-radius: 5px; padding: 2px 8px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: none; letter-spacing: 0; }
.unit-sw span.on { background: var(--accent); color: var(--accent-ink); }
.cell { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 2px; text-align: center; font-family: var(--display); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cell::placeholder { color: var(--muted); opacity: .6; }
.cell:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.sl-row.cur .cell { border-color: var(--accent); }
.sl-row.done .cell { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.sl-row { display: grid; grid-template-columns: 28px minmax(0,1fr) 60px; gap: 4px; row-gap: 2px; align-items: center; padding: 8px 8px; border-top: 1px solid var(--line); font-size: 13.5px; }
.sl-row:first-child { border-top: none; }
.sl-row .num { font-family: var(--display); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sl-row small { display: block; font-size: 11px; color: var(--muted); }
.antes { align-self: stretch; margin: -8px -8px -8px 2px; padding: 0 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--surface-2); border-left: 1px solid var(--line); font-size: 11px; line-height: 1.3; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.antes b { font-family: var(--display); font-size: 14px; font-weight: 600; color: var(--ink); }
.sl-h .antes { margin-block: -6px; font-size: 10px; }
.chk { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--line); background: var(--surface); color: var(--muted); font-family: var(--display); font-weight: 700; font-size: 13px; display: grid; place-items: center; padding: 0; }
.chk.cur { border-color: var(--accent); color: var(--accent); }
.chk.on { background: var(--ok); border-color: var(--ok); color: var(--surface); font-size: 15px; }
.chk:disabled { opacity: .5; cursor: default; }
.sl-add { display: flex; padding: 0 8px; border-top: 1px solid var(--line); }
.sl-add { justify-content: space-between; }
.sl-add .drop-now { color: var(--muted); }
.sl-add button { border: none; background: transparent; color: var(--accent); font-weight: 600; font-size: 11.5px; padding: 5px 2px; }
.sl-swipe { position: relative; overflow: hidden; border-top: 1px solid var(--line); }
.sl-swipe .sl-row { border-top: none; background: var(--surface); position: relative; z-index: 1; transition: transform .2s ease; touch-action: pan-y; }
.sl-swipe .sl-row.cur { background: var(--accent-soft); }
.sl-swipe.open .sl-row { transform: translateX(-84px); }
.sl-swipe .u, .sl-swipe .antes { user-select: none; -webkit-user-select: none; }
.sl-del { position: absolute; top: 0; bottom: 0; right: 0; width: 84px; border: none; background: var(--bad); color: #fff; font-weight: 600; font-size: 13px; }
.sl-drop { padding-block: 4px 6px; border-top: 1px dashed var(--line); background: var(--surface-2); }
.sl-drop .cell { font-size: 14px; padding: 4px 2px; }
.drop-ar { text-align: center; color: var(--muted); font-size: 15px; }
.drop-t { align-self: center; font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; text-align: center; }
.drop-x { justify-self: end; border: 0; background: transparent; color: var(--muted); font-size: 13px; width: 28px; height: 28px; }
.sl-dropadd { display: flex; padding: 0 8px; border-top: 1px dashed var(--line); }
.sl-dropadd button { border: none; background: transparent; color: var(--muted); font-weight: 600; font-size: 11.5px; padding: 5px 2px; }
.bi-link { display: flex; justify-content: center; align-items: center; gap: 8px; margin: -12px 0; min-height: 24px; }
.bi-link button { border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
.bi-link:not(.on) button { opacity: .7; }
.bi-link { gap: 0; }
.bi-sep { color: var(--muted); opacity: .5; font-size: 11px; }
.bi-link.on { justify-content: space-between; padding: 4px 10px; margin: -14px 0; border-left: 3px solid var(--accent); border-right: 3px solid var(--accent); background: var(--accent-soft); }
.bi-link.on .bi-tag { font-size: 11px; font-weight: 700; color: var(--accent); }
.bi-link.on button { color: var(--accent); text-decoration: underline; padding: 2px 0; }
.card.bi-a { border-color: var(--accent); border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; border-width: 1px 3px 1px 3px; }
.card.bi-b { border-color: var(--accent); border-top-left-radius: 4px; border-top-right-radius: 4px; border-width: 1px 3px 1px 3px; }
.sl-foot { font-size: 11.5px; color: var(--muted); margin-top: -4px; }
.sl-h { background: var(--surface-2); font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-block: 6px; }
.sl-row.cur { background: var(--accent-soft); }
.sl-row.cur .num:last-child { color: var(--accent); font-size: 14px; }
.sl-row.done .num:last-child { color: var(--ok); }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.opt-top { display: flex; justify-content: space-between; align-items: center; }
.opt-l { font-family: var(--display); font-weight: 700; font-size: 13px; width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; background: var(--surface-2); }
.opt-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.opt-dot.taken { background: var(--bad); }
.opt-n { font-size: 12.5px; font-weight: 600; line-height: 1.2; }
.opt-s { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt-b { font-size: 10px; font-weight: 700; color: var(--bad); text-transform: uppercase; letter-spacing: .05em; }
.opt.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
.opt.on .opt-l { background: var(--accent); color: var(--accent-ink); }
.opt.busy { opacity: .6; }
.opts.mini { gap: 4px; }
.opt-more { grid-column: -2 / -1; justify-content: center; align-items: center; font-weight: 700; font-size: 16px; padding: 0 !important; color: var(--muted); }
.opts.mini .opt { flex-direction: row; align-items: center; gap: 5px; padding: 5px 6px; border-radius: 9px; }
.opts.mini .opt-top { order: 0; }
.opts.mini .opt-l { width: 16px; height: 16px; font-size: 11px; border-radius: 4px; }
.opts.mini .opt-dot, .opts.mini .opt-s, .opts.mini .opt-b { display: none; }
.opts.mini .opt-n { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.opt.busy .opt-n { text-decoration: line-through; }
.opts.mini .opt:not(.opt-more) { padding: 3px; display: block; }
.opt-pic { position: relative; display: grid; place-items: center; width: 100%; aspect-ratio: 3 / 2; border-radius: 6px; overflow: hidden; background: #fff; }
.opt-pic img { grid-area: 1 / 1; width: 100%; height: 100%; object-fit: cover; display: block; }
.opt-pic .f2 { opacity: 0; }
.cur-card .opt.on .opt-pic .f2 { animation: exflip 2.4s steps(1, end) infinite; }
@keyframes exflip { 0% { opacity: 0; } 50% { opacity: 1; } }
.opt-pic .opt-l { position: absolute; left: 3px; top: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.opt-pic .opt-n { padding: 4px; text-align: center; white-space: normal !important; color: #333; }
.opt.busy .opt-pic img { filter: grayscale(1); }
.opt-info { position: absolute; right: 3px; top: 3px; width: 22px; height: 20px; border-radius: 6px; display: grid; place-items: center; background: rgba(150,150,155,.45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); color: #fff; cursor: pointer; }
.opt-info svg { fill: currentColor; display: block; }
.opts.mini .opt-info { width: 18px; height: 16px; right: 2px; top: 2px; }
.exi { max-height: 85vh; overflow-y: auto; }
.exi-pics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.exi-pics img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 10px; background: #fff; display: block; }
.exi-h { font-family: var(--display); font-size: 15px; margin: 4px 0 -4px; }
.exi-l { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.4; }
.exi-l.ojo li::marker { color: var(--bad); }
.opt-cap { margin: -6px 0 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt-cap b { color: var(--accent); }
.alt.busy .name { text-decoration: line-through; }
.alt .name { font-weight: 600; font-size: 14.5px; }
.alt .sub { font-size: 12px; color: var(--muted); }
.state { font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
.state.free { background: var(--ok-soft); color: var(--ok); }
.state.taken { background: var(--bad-soft); color: var(--bad); }

.explain { background: var(--surface-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
.explain .row { display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 8px; }
.explain .k { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 2px; }

.btn { border: none; border-radius: 12px; padding: 13px 14px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface-2); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.block { width: 100%; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.last { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.last .val { font-family: var(--display); font-size: 20px; font-weight: 600; }
.note { border-radius: 10px; padding: 9px 11px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.ok { background: var(--ok-soft); color: var(--ok); }
.note.info { background: var(--accent-soft); color: var(--accent); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note b { font-weight: 700; }

/* registro */
.log { display: flex; flex-direction: column; gap: 12px; }

.steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stepper { border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }

.stepper .v { font-family: var(--display); font-size: 30px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.rir { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rir button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.rir button .big { font-family: var(--display); font-size: 22px; font-weight: 700; line-height: 1; }
.rir button .tiny { font-size: 10.5px; color: var(--muted); }
.rir button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.sets-done { display: flex; gap: 6px; flex-wrap: wrap; }
.set-pill { font-family: var(--display); font-size: 15px; font-weight: 600; background: var(--surface-2); border-radius: 8px; padding: 3px 8px; }
.set-pill.f { background: var(--bad-soft); color: var(--bad); }

.rest { position: relative; overflow: hidden; display: flex; align-items: center; gap: 8px; background: var(--surface-2); color: var(--ink); border-radius: 10px; padding: 6px 8px 6px 12px; font-size: 12.5px; }
.rest::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(100% * var(--p, 0)); background: var(--accent-soft); transition: width 1s linear; z-index: 0; }
.rest > * { position: relative; z-index: 1; }
.rest-l { color: var(--muted); font-weight: 500; }
.rest .t { font-family: var(--display); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 38px; }
.rest.done .t { color: var(--ok); }
.rest-adj { display: inline-flex; gap: 4px; margin-left: auto; }
.rest-adj button { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 3px 7px; font-size: 11.5px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.rest-skip { border: 0; background: transparent; color: var(--accent); font-size: 12px; font-weight: 600; padding: 3px 4px; }
.rest.enter { animation: restIn .45s ease-out; }
@keyframes restIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.banner .btn { padding: 8px 10px; font-size: 13px; background: var(--warn); color: var(--surface); white-space: nowrap; }

/* tiempo */
.time-opts { display: flex; gap: 6px; flex-wrap: wrap; }
.time-opts button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.time-opts button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.plan-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); align-items: center; }
.plan-row:first-child { border-top: none; }
.plan-row .what { font-weight: 600; font-size: 14px; }
.plan-row .impact { font-size: 12.5px; color: var(--muted); }
.plan-row .tag-keep { color: var(--ok); font-weight: 600; font-size: 12px; }
.plan-row .tag-cut { color: var(--bad); font-weight: 600; font-size: 12px; }

/* semana */
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: flex; flex-direction: column; gap: 4px; }
.bar-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.bar-top .m { font-weight: 600; font-size: 14px; }
.bar-top .v { font-family: var(--display); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 14px; border-radius: 7px; background: var(--surface-2); overflow: hidden; }
.bar .zone { position: absolute; top: 0; bottom: 0; background: var(--ok-soft); border-left: 2px solid var(--ok); border-right: 2px solid var(--ok); }
.bar .proj { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 5px; background: var(--accent-soft); outline: 1px dashed var(--accent); outline-offset: -1px; }
.bar .fill { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 5px; background: var(--accent); }
.bar-row.behind .fill { background: var(--bad); }
.bar-row.behind .m::after { content: "Atrasado"; margin-left: 8px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--bad); background: var(--bad-soft); padding: 2px 6px; border-radius: 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 8px; border-radius: 3px; display: inline-block; }
.d4 { display: flex; flex-direction: column; }
.d4-row { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.d4-row:first-child { border-top: none; }
.d4-row .i { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--muted); }

/* guía */
.rule { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.rule .c { background: var(--accent-soft); }
.rule .a { background: var(--surface-2); }
.rule .big { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1; }
.scale { display: flex; flex-direction: column; gap: 4px; }
.scale-row { display: grid; grid-template-columns: 46px minmax(0,1fr); gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); font-size: 13.5px; }
.scale-row .k { font-family: var(--display); font-weight: 700; font-size: 20px; }
.scale-row.hl { background: var(--ok-soft); }
.scale-row.fl { background: var(--bad-soft); }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
details summary { cursor: pointer; font-weight: 600; font-size: 12px; color: var(--accent); }

details.det summary { color: var(--muted); font-weight: 500; font-size: 11.5px; }
details.det { margin-top: -4px; }
.det-sec { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
.det-sec p { margin: 0; }
.det-h { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.det .explain { font-size: 12px; padding: 10px; gap: 6px; }

/* hoja inferior */
.bodyfab { flex: none; padding: 0; background: transparent; border: 0; border-radius: 12px; display: flex; flex-direction: row; align-items: flex-end; gap: 6px; cursor: pointer; color: var(--ink); }
.bf-figs { display: flex; gap: calc(2px + 10px * var(--hp)); }
.bf-fig { display: block; }
.bf-fig svg { height: 76px; width: auto; display: block; }
.bodyfab { position: relative; }
.bodyfab .bf-t { order: -1; font-size: 10.5px; font-weight: 700; color: var(--muted); line-height: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bodyfab.pulse { animation: bfpulse .7s ease-out; }
@keyframes bfpulse { 0% { transform: scale(1); } 35% { transform: scale(1.08); } 100% { transform: scale(1); } }
/* muñeco: piel durazno con contorno café (modelo de Italo); el calor va de --heat-0 a --heat-1 */
.bodyfig { --fig-skin: #F6CBA8; --fig-line: #B5714A; }
.bodyfig .sk { fill: var(--fig-skin); stroke: var(--fig-line); stroke-width: .75; stroke-linejoin: round; }
.bodyfig .m { transition: fill .5s ease; stroke: var(--fig-line); stroke-width: .55; stroke-linejoin: round; }
.bodyfig .ln { fill: none; stroke: var(--fig-line); stroke-width: .55; stroke-linecap: round; }
.bf-fig .bodyfig .sk, .bf-fig .bodyfig .m, .bf-fig .bodyfig .ln { stroke-width: 1; }
.bodyfig .m.on { stroke: #D2604E; stroke-width: .8; }
.bf-fig .bodyfig .m.on { stroke-width: 1.5; }
.body-big svg { width: 100%; max-width: 340px; height: auto; display: block; margin: 0 auto; }
.mus-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; font-size: 12.5px; }
.mus-list > div { display: flex; justify-content: space-between; gap: 6px; border-bottom: 1px solid var(--line); padding: 3px 0; }
.mus-list .muted { font-variant-numeric: tabular-nums; }
.mus-scale { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); justify-content: center; }
.mus-scale i { display: inline-block; width: 80px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #F6CBA8, var(--heat-1)); border: 1px solid #D2604E; }
.mus-scale b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: #F6CBA8; border: 1px solid #B5714A; margin-left: 8px; }
.sheet-bg { position: fixed; inset: 0; background: rgba(5, 8, 12, .5); display: flex; align-items: flex-end; justify-content: center; z-index: 30; }
.sheet { background: var(--surface); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }

/* pestañas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 20; }
.tabs-in { width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
/* inicio: calendario de días entrenados */
.cal-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; }
.cal-dl { display: grid; grid-template-rows: 12px repeat(var(--nr), 18px) 30px; gap: 4px; font-size: 11px; color: var(--muted); line-height: 18px; white-space: nowrap; }
.cal-dl b { color: var(--ink); font-weight: 600; margin-right: 3px; }
.cal { display: grid; grid-template-rows: 12px repeat(var(--nr), 18px) 30px; grid-auto-flow: column; grid-auto-columns: 16px; gap: 4px; justify-content: space-between; }
.cal-mes { font-size: 9.5px; font-weight: 600; color: var(--muted); line-height: 12px; white-space: nowrap; overflow: visible; }
.cal-d { width: 16px; height: 18px; border: 0; border-radius: 3px; background: var(--surface-2); padding: 0; }
.cal-d.on { background: color-mix(in srgb, var(--accent) var(--q, 100%), var(--surface-2)); }
.cal-sc { align-self: end; width: 16px; border: 0; padding: 0; border-radius: 3px 3px 1px 1px; background: var(--ok); min-height: 2px; }
.cal-sc.mid { background: var(--warn); } .cal-sc.low { background: var(--bad); } .cal-sc.cur { opacity: .5; }
.cal-sc.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.cal-dl .sc { align-self: end; line-height: 12px; }
.cal-d.hoy { box-shadow: 0 0 0 1.5px var(--ink); }
.cal-d.fut { visibility: hidden; }
.cal-d.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.cal-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cal-stats div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; }
.cal-stats b { font-family: var(--display); font-size: 24px; line-height: 1.1; }
.cal-stats span { font-size: 11.5px; color: var(--muted); }
.cal-leg { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.cal-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.cump { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.cump-n { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; align-content: center; background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--surface-2) 0); position: relative; }
.cump-n::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--surface); }
.cump-n b, .cump-n span { position: relative; }
.cump-n b { font-family: var(--display); font-size: 28px; line-height: 1; }
.cump-n span { font-size: 9.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.cump-parts { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.cump-p { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px; }
.cump-p .bar { height: 8px; }
.cump-p .fill { top: 0; bottom: 0; border-radius: 4px; }
.cump-p .v { font-family: var(--display); font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.mus-row { display: grid; grid-template-columns: 104px minmax(0, 1fr) 76px; gap: 8px; align-items: center; font-size: 12.5px; }
.mus-row .m { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mus-row .bar { height: 10px; }
.mus-row .fill { top: 2px; bottom: 2px; border-radius: 3px; }
.mus-row .v { font-family: var(--display); font-size: 14px; font-weight: 600; text-align: right; white-space: nowrap; }
.mus-row .v .muted { font-size: 12px; }
.mus-row.behind .fill { background: var(--bad); }
.mus-row.midm .fill { background: var(--warn); } .mus-row.okm .fill { background: var(--ok); }
.mus-sc { display: flex; flex-direction: column; gap: 7px; }
.mus-sc .cump-p { grid-template-columns: 112px minmax(0, 1fr) 58px; }
.mus-sc .cump-p .v { text-align: right; }
.fill.mid { background: var(--warn); } .fill.low { background: var(--bad); } .fill.okc { background: var(--ok); }
.wks { display: flex; gap: 4px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 4px; scrollbar-width: none; }
.wks::-webkit-scrollbar { display: none; }
.wk { flex: none; scroll-snap-align: center; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 1px 7px; display: inline-flex; align-items: baseline; gap: 4px; font-size: 10.5px; line-height: 16px; color: var(--muted); white-space: nowrap; }
.wk b { font-family: var(--display); font-size: 12.5px; color: var(--ok); }
.wk b.mid { color: var(--warn); } .wk b.low { color: var(--bad); }
.wk.rng { background: var(--accent-soft); border-color: transparent; }
.wk.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; color: var(--ink); }
.wk i { font-style: normal; color: var(--accent); }
.info-i { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--muted); background: none; color: var(--muted); font-family: Georgia, serif; font-style: italic; font-weight: 700; font-size: 11px; line-height: 1; padding: 0; vertical-align: 4px; margin-left: 4px; }
.cump-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cump-top .seg { flex: none; width: 150px; padding: 3px; }
.cump-top .seg button { padding: 5px 2px; font-size: 12px; }
.cump-how { font-size: 12px; color: var(--muted); }
.cump-how summary { color: var(--accent); font-size: 12px; }
.cal-det { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.ed { gap: 10px; }
.ed-head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; }
.ed-title { border: none; background: none; padding: 0; text-align: left; display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 10px; align-items: center; }
.ed-n { font-size: 24px; font-weight: 700; color: var(--accent); }
.ed-move { display: inline-flex; gap: 4px; }
.ed-move button { width: 34px; height: 34px; border: none; border-radius: 8px; background: var(--surface-2); font-weight: 700; }
.ed-move button:disabled { opacity: .3; cursor: default; }
.ed.open { border-color: var(--accent); }
.ed-field { display: flex; flex-direction: column; gap: 6px; }
.ed3 { grid-template-columns: repeat(3, 1fr); }
.ed3 .v { font-size: 24px; }
.ed3 .ctl { grid-template-columns: 30px minmax(0,1fr) 30px; }
.ed3 .ctl button { height: 34px; font-size: 18px; }
.txt { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 11px 12px; font: inherit; font-size: 16px; }
.txt:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; }
.seg button { border: none; background: transparent; border-radius: 7px; padding: 8px 4px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
button.day { cursor: pointer; }
.day.add { color: var(--accent); border-style: dashed; }
/* inicio de Rutina: elegir qué rutina hacer */
.rut-next { gap: 10px; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.rut-main { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; }
.rut-main h2 { font-size: 24px; }
.rut-fig svg { height: 70px; width: auto; display: block; }
.rut-exs { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rut-tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); vertical-align: 2px; margin-left: 4px; }
.rut-tag.ok { background: var(--ok-soft); color: var(--ok); }
.rut-list { display: flex; flex-direction: column; gap: 8px; }
.rut-item { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 8px 6px 4px; }
.rut-go { display: grid; grid-template-columns: 36px minmax(0,1fr); gap: 8px; align-items: center; border: 0; background: none; padding: 6px 0 6px 8px; text-align: left; min-width: 0; }
.rut-go b { display: block; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rut-n { font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--accent); text-align: center; line-height: 1; }
.rut-n small { display: block; font-family: var(--body); font-size: 9.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rut-ed { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 600; color: var(--accent); }
.rut-back { display: flex; justify-content: space-between; align-items: center; margin-bottom: -4px; }
.rut-back button { border: 0; background: none; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: 13px; }
.day { text-align: center; padding: 8px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 13px; color: var(--muted); }
.day.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sheet.pick { max-height: 85vh; overflow-y: auto; }
.btn:disabled { opacity: .4; cursor: default; }
.tabs button { border: none; background: transparent; border-radius: 10px; padding: 8px 4px; font-weight: 600; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button.on { color: var(--accent); background: var(--accent-soft); }

@media (prefers-reduced-motion: no-preference) {
  .flash { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: translateY(4px); opacity: .4; } to { transform: none; opacity: 1; } }
}

<div id="root"><p style="padding:24px;font-family:Inter,sans-serif">Cargando…</p></div>

<script src="config.js" onerror="window.GYM_CONFIG = null"></script>

<script>
// ---------- Datos ----------
// Catálogo real: app/catalogo.js (generado desde data/ por scripts/armar_catalogo.py)
const CAT = window.CATALOGO;

// Sobrecarga progresiva (progresión doble): +1 rep por serie hasta el tope del rango;
// si la vez anterior llegaste al tope en todas, sube el peso y vuelve al piso del rango.
// Regla de progresión:
// - Cada serie busca 1-2 en reserva; es normal que las reps bajen de serie en serie (10, 9, 8).
// - Se sube el peso cuando la ÚLTIMA serie llega al tope del rango con 1-2 en reserva (en aislados, hasta el fallo).
// - El salto es ~5-8% (o el salto mínimo del equipo); con el peso nuevo la última serie cae cerca del mínimo.
// - La sesión siguiente a un salto lo valida: 3+ en reserva = salto chico; bajo el mínimo = salto grande.
const stepOf = e => e.eq === 'Mancuernas' ? 2 : (e.eq === 'Sin máquina' ? 5 : 2.5);
const roundTo = (x, st) => Math.round(x / st) * st;
function plan(si) {
  const d = DAY[si], e = exOf(si), [lo, hi] = d.reps, n = nS(si);
  if (!e.last) return { why: 'nuevo', w: e.sugW ?? 0, reps: Array.from({length: n}, () => lo) };
  const L = e.last, lr = L.r, rr = L.rir || lr.map(() => 2), k = lr.length - 1, st = stepOf(e);
  const descend = Array.from({length: n}, (_, i) => Math.min(hi, lo + (n - 1 - i)));

  if (L.jump && lr.some(x => x < lo)) {
    const w = Math.max(st, Math.min(L.w - st, roundTo(L.w * 0.95, st)));
    return { why: 'grande', w, reps: descend, from: L.w };
  }
  if (L.jump && rr[k] >= 3) {

    return { why: 'chico', w, reps: descend, from: L.w };

function timePlan() {

  const cut = new Set();

    let total = rows.reduce((a, r) => a + r.mins, 0);
    const order = [...rows].filter(r => logsFor(r.si).length === 0 && r.si !== S.si)
      .sort((a, b) => PRANK[DAY[a.si].prio] - PRANK[DAY[b.si].prio] || b.si - a.si);
    for (const r of order) { if (total <= S.minutes) break; if (DAY[r.si].prio === 'alta') break; cut.add(r.si); total -= r.mins; }

async function recargarRegistro() {
  const sid = S.sesionId;
  await Promise.all(Object.keys(EX).map(async id => {
    const u = await DB.series.ultimaVez(id, { sinSesion: sid });
    const ss = u ? u.series.filter(x => !x.drop_de) : [];
    EX[id].last = ss.length ? { w: kgDe(ss[ss.length - 1].peso, ss[ss.length - 1].unidad) ?? 0, ws: ss.map(x => kgDe(x.peso, x.unidad) ?? 0), r: ss.map(x => x.reps ?? 0), rir: ss.map(x => x.rir ?? 2), pos: ss[0].posicion ?? null, jump: false } : null;
  }));
  const lunes = lunesDe(new Date()), desde = new Date(lunes); desde.setDate(desde.getDate() - 7 * 12);
  const ses = await DB.sesiones.listar({ desde: desde.toISOString() });
  const ser = await DB.series.entre(desde.toISOString(), new Date(Date.now() + 864e5).toISOString());
  const porSes = {};
  ser.forEach(x => { if (!x.drop_de) (porSes[x.sesion_id] = porSes[x.sesion_id] || []).push(x); });
  BASE = {};
  ser.forEach(x => {
    if (x.drop_de || x.sesion_id === sid || new Date(x.hecha_en) < lunes) return;
    const e = EX[x.ejercicio_id]; if (!e) return;
    e.p.forEach(m => BASE[m] = (BASE[m] || 0) + 1); e.s.forEach(m => BASE[m] = (BASE[m] || 0) + .5);
  });
  RUT.forEach(r => { r.last = null; });
  HIST = ses.filter(s => porSes[s.id]).map(s => {
    const k = RUT.findIndex(r => r.id === s.rutina_id), xs = porSes[s.id], f = new Date(s.inicio);
    if (k >= 0 && !RUT[k].last) RUT[k].last = fechaTxt(f);
    const bien = xs.filter(x => x.rir === 1 || x.rir === 2 || (x.rir === 0 && EX[x.ejercicio_id] && !EX[x.ejercicio_id].comp)).length;
    return { f, k, id: s.id, sd: setsRut(k) ? Math.min(1, xs.length / setsRut(k)) : 1, ri: bien / xs.length, ser: xs.map(x => ({ ex: x.ejercicio_id, rir: x.rir })) };
  }).sort((a, b) => a.f - b.f);
  const ult = [...HIST].reverse().find(h => h.k >= 0 && h.id !== sid);
  S.lastDone = ult ? ult.k : RUT.length - 1;
  // fotos de las rutinas: se piden para que el service worker las guarde y se vean sin señal
  RUT.forEach(r => r.slots.forEach(d => d.alts.forEach(a => (IMG[a] || []).forEach(src => { const im = new Image(); im.src = src; }))));
}

async function cargarRutinas() {
  const filas = await DB.rutinas.listar();
  RUT.length = 0; Object.keys(guardados).forEach(k => delete guardados[k]);
  filas.forEach(f => {
    const slots = (f.slots || []).map(d => ({ ...d, alts: (d.alts || []).filter(a => EX[a]) })).filter(d => d.alts.length);
    const r = { id: f.id, name: f.nombre, last: null, slots };
    RUT.push(r); guardados[r.id] = JSON.stringify(filaRut(r, RUT.length - 1));
  });
  if (!RUT.length) RUT.push({ id: nuevoId(), name: 'Día 1', last: null, slots: [] });
  const a = await DB.ajustes.leer();

}
function restaurarSesion() {
  let o = null; try { o = JSON.parse(localStorage.getItem(claveSes())); } catch { o = null; }
  if (!o) return;
  const k = RUT.findIndex(r => r.id === o.rutId), ult = o.lastAct || o.startAt || 0;
  // una sesión sin movimiento hace más de 12 horas se da por terminada
  if (k < 0 || Date.now() - ult > 12 * 3600e3) {
    if (o.sesionId) enCola(() => DB.sesiones.terminar(o.sesionId));
    try { localStorage.removeItem(claveSes()); } catch {}
    return;
  }
  SNAP.forEach(x => { if (x in o && o[x] !== undefined) S[x] = o[x]; });
  S.rut = k; S.tab = 'hoy';
}

async function entrarApp() {
  S.pantalla = 'cargando'; render();
  await cargarRutinas();
  restaurarSesion();
  await recargarRegistro();
  S.pantalla = null; useDay(S.rut); S.si = Math.min(S.si || 0, Math.max(0, DAY.length - 1)); S.draft = makeDraft(S.si);
  guardarTodo(); render();
}

  const strip = DAY.map((x, j) => `<button class="chip-slot ${j===si?'cur':''} ${isDone(j)?'done':''} ${cut.has(j)?'cut':''}" data-a="jump" data-v="${j}" aria-label="${x.name}">
      <span class="n">${isDone(j) ? '✓' : j+1}</span><span class="l">${x.name}</span></button>`).join('');

  const alts = d.alts.map((id, k) => {
    const x = EX[id], on = k === altIdx(si), b = !!S.busy[id];
    return `<button class="opt ${on?'on':''} ${b?'busy':''}" data-a="pick" data-v="${k}" aria-pressed="${on}" aria-label="${LET[k]}: ${x.n}">
      <span class="opt-pic">${IMG[id] ? `<img src="${IMG[id][0]}" alt=""><img class="f2" src="${IMG[id][1]}" alt="">` : `<span class="opt-n">${SHORT[id] || x.n}</span>`}<span class="opt-l">${LET[k]}</span><span class="opt-info" role="button" tabindex="0" data-a="exInfo" data-v="${id}" aria-label="Técnica de ${x.n}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="2" cy="6" r="1.4"/><circle cx="6" cy="6" r="1.4"/><circle cx="10" cy="6" r="1.4"/></svg></span></span>
      <span class="opt-s">${x.last ? `${fmt(x.last.w)} kg` : 'Nuevo'}</span>
      ${b ? '<span class="opt-b">Ocupado</span>' : ''}</button>`;
  }).join('');

  let swapHtml = '';
  if (S.swap && S.swap.none) {
    swapHtml = `<div class="note warn flash"><b>Las tres opciones están ocupadas.</b>${filler != null
      ? `<span>No esperes parado: haz ${DAY[filler].name.toLowerCase()} (${exOf(filler).n.toLowerCase()}) mientras se libera. No cansa ${muscles(si).filter(m=>m!=='front').map(m=>MUS[m].toLowerCase()).join(' ni ')}.</span>`
      : `<span>No queda un aislado que no interfiera. Descansa un poco más o pasa al siguiente compuesto.</span>`}</div>
      ${filler != null ? `<div class="btn-row"><button class="btn primary" data-a="filler" data-v="${filler}">Hacer ${DAY[filler].name.toLowerCase()}</button><button class="btn ghost" data-a="free">Se liberó una</button></div>` : ''}
      ${tag('esperar turno sin saber qué hacer mientras tanto')}`;
  } else if (S.swap) {
    swapHtml = `<div class="note info flash"><b>Cambiado: ${S.swap.to}.</b><span>Cuenta igual para la rutina. ${S.swap.from} quedó marcado como ocupado.</span></div>`;
  }

  const chosen = true; // opciones siempre compactas, la A elegida y las series a la vista
  const restL = S.restEnd ? Math.max(0, Math.round((S.restEnd - Date.now())/1000)) : null;
  const msgH = S.msg ? `<div class="note ${S.msg.cls} flash"><b>${S.msg.t}</b><span>${S.msg.s}</span></div>` : '';
  const actions = isDone(si)
    ? `${msgH}<div><button class="btn primary block" data-a="next">${S.returnTo != null ? `Volver a ${DAY[S.returnTo].name.toLowerCase()}` : 'Siguiente ejercicio'}</button></div>`
    : `${restL != null ? restHtml(restL) : ''}${msgH}
`;
  const cf = !done && !ls.length && !S.conflictOk[si] ? conflictFor(si) : null;
  const conflictWarn = cf != null ? (() => { const m = share(si, cf).filter(x => x !== 'front').map(x => MUS[x].toLowerCase()); return `<div class="note warn ord-note"><div><b>Ojo: ${d.name.toLowerCase()} antes de ${DAY[cf].name.toLowerCase()}.</b><span>Cansa ${m.join(' y ') || 'los mismos músculos'}, que necesitas en ${DAY[cf].name.toLowerCase()} (prioridad alta). Puedes rendir menos ahí.</span></div><button class="ok-btn" data-a="conflictOk">OK</button></div>`; })() : '';
  const ordChanged = e.last && e.last.pos != null && e.last.pos !== p;
  const orderShort = ordChanged ? ` Hoy va de ${ord(p)} (antes ${ord(e.last.pos)}): ${p > e.last.pos ? 'es normal rendir algo menos' : 'es normal rendir algo más'}.` : '';
  const orderWarn = ordChanged && !S.orderOk[si] ? `<div class="note warn ord-note"><div><b>La última vez lo hiciste de ${ord(e.last.pos)}, hoy va de ${ord(p)}.</b><span>${p > e.last.pos ? 'Llegas más cansado: es normal rendir algo menos. No es pérdida de fuerza.' : 'Llegas más fresco: es normal rendir algo más.'}</span></div><button class="ok-btn" data-a="orderOk">OK</button></div>` : '';

  const why = `<div class="explain">
      <div class="row"><span class="k">Por qué</span><span>${e.why}</span></div>
      <div class="row"><span class="k">Peso</span><span>${e.adj}</span></div>
      <div class="row"><span class="k">Técnica</span><span>${e.tec}</span></div>
      <div class="row"><span class="k">Cuenta</span><span>${e.p.map(m=>`${MUS[m]} 1`).concat(e.s.map(m=>`${MUS[m]} 0,5`)).join(' · ')} por serie</span></div>
    </div>`;

  const g = guideFor(si);
  const restLeft = S.restEnd ? Math.max(0, Math.round((S.restEnd - Date.now())/1000)) : null;

  const logPanel = done ? `<div class="note ok"><b>${d.name}: listo.</b><span>${ls.map(l=>`${fmt(l.w)}×${l.r}`).join(' · ')}</span></div>
      ${S.msg ? `<div class="note ${S.msg.cls}"><b>${S.msg.t}</b><span>${S.msg.s}</span></div>` : ''}
      <div class="btn-row"><button class="btn ghost" data-a="undo">Deshacer serie</button><button class="btn primary" data-a="next">${S.returnTo != null ? `Volver a ${DAY[S.returnTo].name.toLowerCase()}` : 'Siguiente ejercicio'}</button></div>`
    : `${ls.length ? `<div class="sets-done">${ls.map((l,i)=>`<span class="set-pill ${l.rir===0?'f':''}">${i+1}: ${fmt(l.w)}×${l.r} · ${l.rir===3?'3+':l.rir} RIR</span>`).join('')}</div>` : ''}
      ${restLeft != null ? restHtml(restLeft) : ''}
      ${S.msg ? `<div class="note ${S.msg.cls} flash"><b>${S.msg.t}</b><span>${S.msg.s}</span></div>` : ''}
      <div class="guide ${g.cls}"><span class="g1">${g.g1}</span><span class="g2">${g.g2}</span></div>
      ${tag(d.type==='comp' ? 'llegar al fallo en todo y necesitar descansos eternos' : 'no saber cuándo sí conviene llegar al fallo')}
      <div class="steppers">
        <div class="stepper"><span class="lab">Peso ${S.unit}</span><div class="ctl"><button data-a="w" data-v="-2.5" aria-label="Bajar peso">−</button><span class="v">${fmt(toU(S.draft.w))}</span><button data-a="w" data-v="2.5" aria-label="Subir peso">+</button></div></div>
        <div class="stepper"><span class="lab">Repeticiones</span><div class="ctl"><button data-a="r" data-v="-1" aria-label="Menos repeticiones">−</button><span class="v">${S.draft.r}</span><button data-a="r" data-v="1" aria-label="Más repeticiones">+</button></div></div>
      </div>
      <div><p class="small muted" style="margin-bottom:6px">¿Cuántas más podías hacer?</p>
      <div class="rir">${[[0,'Ninguna','fallo'],[1,'Una',''],[2,'Dos',''],[3,'3 o más','']].map(([v,l])=>`<button class="${S.draft.rir===v?'on':''}" data-a="rir" data-v="${v}"><span class="big">${v===3?'3+':v}</span><span class="tiny">${l}</span></button>`).join('')}</div></div>
      <button class="btn primary block" data-a="log">Registrar serie ${ls.length+1} de ${d.sets}</button>
      ${ls.length ? `<button class="btn ghost block" data-a="undo">Deshacer última</button>` : ''}`;

  const tp = timePlan();
  const wk = weekly(false);
  const timeRows = tp.rows.map(r => {
    const x = DAY[r.si], ex = exOf(r.si), c = tp.cut.has(r.si);
    let impact = `${Math.round(r.mins)} min`;
    if (c) {
      const m = ex.p[0], kept = DAY.map((dd,k)=>k).filter(k=>k!==r.si && !tp.cut.has(k) && !isDone(k));
      const indirect = kept.reduce((a,k)=>a + (exOf(k).p.includes(m)?nS(k)-logsFor(k).length:0) + (exOf(k).s.includes(m)?(nS(k)-logsFor(k).length)*0.5:0), 0) + S.logs.reduce((a,l)=>a+(EX[l.ex].p.includes(m)?1:EX[l.ex].s.includes(m)?0.5:0),0);
      impact = `−${x.sets} series de ${MUS[m].toLowerCase()}${indirect ? `, pero hoy igual sumas ${fmt(indirect)} con lo demás` : ''}. El día 4 lo recupera.`;
    }
    return `<div class="plan-row"><div><div class="what">${x.name} <span class="prio ${x.prio}">${x.prio}</span></div><div class="impact">${impact}</div></div><span class="${c?'tag-cut':'tag-keep'}">${c?'Recortar':'Hacer'}</span></div>`;
  }).join('');
  const totalMin = Math.round(tp.rows.filter(r=>!tp.cut.has(r.si)).reduce((a,r)=>a+r.mins,0));

  return `
    <section data-slot="${si}" class="card ${act0 ? 'cur-card' : ''} ${S.fold[si]?'folded':''} ${biPartner(si) != null ? (biFirst(si) ? 'bi-a' : 'bi-b') : ''}">
      <div class="slot-head">
        <button class="fold-btn" data-a="fold" aria-expanded="${!S.fold[si]}"><span class="fold-chev ${S.fold[si]?'':'open'}" aria-hidden="true">›</span><h2 class="slot-line">Slot ${si+1}: ${d.name} <span class="muted slot-type">· ${d.type==='comp'?'Compuesto':'Aislado'}</span></h2></button>
        ${prioIcon(d.prio)}
      </div>
      ${S.fold[si] ? `<button class="fold-sub" data-a="fold"><span>${e.n}</span><span class="muted"> · ${ls.length}/${nS(si)} series${ls.length ? ' · ' + ls.map(l=>`${fmt(toU(l.w))}×${l.r}`).join(', ') : ''}</span></button>` : `
      <div class="opts ${chosen ? 'mini' : ''}" style="grid-template-columns: repeat(${d.alts.length}, minmax(0,1fr)) ${d.alts.length < 3 ? `minmax(0,${3 - d.alts.length}fr)` : ''} 30px">${alts}<button class="opt opt-more" data-a="altSheet" aria-label="Editar opciones">⋯</button></div>
      <p class="opt-cap"><b>${LET[altIdx(si)]}</b> · ${e.n}</p>
      ${act0 ? swapHtml : ''}
      ${chosen ? `<div class="setlist">
        <div class="sl-row sl-h"><span></span><button class="unit-sw" data-a="unit" aria-label="Cambiar a ${S.unit==='kg'?'libras':'kilos'}"><span class="${S.unit==='kg'?'on':''}">kg</span><span class="${S.unit==='lb'?'on':''}">lb</span></button><span class="antes">Última vez</span></div>
        ${Array.from({length: nS(si)}, (_, i) => {
          const l = ls[i], prev = e.last && e.last.r[i] != null ? `<b>${fmt(toU(e.last.ws ? e.last.ws[i] : e.last.w))}×${e.last.r[i]}</b>${e.last.rir ? `${e.last.rir[i] === 3 ? '3+' : e.last.rir[i]} RIR` : ''}` : '–';
          const cur = i === ls.length;
          const lastIso = d.type === 'iso' && i === nS(si) - 1;
          return `<div class="sl-swipe ${S.swiped === `${si}-${i}` ? 'open' : ''}" data-row="${i}"><div class="sl-row ${l ? 'done' : ''} ${cur ? 'cur' : ''}"><button class="chk ${l ? 'on' : ''} ${cur ? 'cur' : ''}" data-a="${l ? (i === ls.length - 1 ? 'undo' : 'noop') : cur ? 'log' : 'noop'}" ${!l && !cur ? 'disabled' : ''} aria-label="Serie ${i+1} completa" aria-pressed="${!!l}">${l ? '✓' : i + 1}</button><span class="cells">${(() => {
            const pre = S.pre[`${si}-${i}`] || {};
            const w = l ? l.w : cur ? DR.w : pre.w ?? target(si, i).w, r = l ? l.r : cur ? DR.r : pre.r ?? target(si, i).r;
            const tg = target(si, i), ph = [toU(tg.w), tg.r];
            return `<label class="cellw"><input class="cell" inputmode="decimal" aria-label="Peso serie ${i+1}" data-set="${i}" data-f="w" value="${toU(w) ?? ''}" placeholder="${ph[0]}"><span class="u">${S.unit}</span></label><label class="cellw"><input class="cell" inputmode="numeric" aria-label="Repeticiones serie ${i+1}" data-set="${i}" data-f="r" value="${r ?? ''}" placeholder="${ph[1]}"><span class="u">reps</span></label><label class="cellw"><input class="cell" inputmode="numeric" aria-label="Repeticiones en reserva serie ${i+1}" data-set="${i}" data-f="rir" value="${(l ? l.rir : cur ? DR.rir : pre.rir ?? defRir(si, i)) ?? ''}" placeholder="${d.type === 'iso' && i === nS(si) - 1 ? '0' : '1-2'}"><span class="u">RIR</span></label>`;
          })()}</span><span class="antes">${prev}</span></div><button class="sl-del" data-a="delSetAt" data-v="${i}">Eliminar</button></div>${l ? (l.drops || []).map((dp, k) => `<div class="sl-row sl-drop"><span class="drop-ar" aria-hidden="true">↳</span><span class="cells"><label class="cellw"><input class="cell" inputmode="decimal" aria-label="Peso bajada ${k+1} de la serie ${i+1}" data-drop="${i},${k}" data-f="w" value="${toU(dp.w)}"><span class="u">${S.unit}</span></label><label class="cellw"><input class="cell" inputmode="numeric" aria-label="Repeticiones bajada ${k+1} de la serie ${i+1}" data-drop="${i},${k}" data-f="r" value="${dp.r ?? ''}" placeholder="–"><span class="u">reps</span></label><span class="drop-t">Bajada</span></span><button class="drop-x" data-a="dropDel" data-v="${i},${k}" aria-label="Quitar bajada">✕</button></div>`).join('') + (i === ls.length - 1 && act0 ? `<div class="sl-dropadd"><button data-a="dropAdd">↓ Bajar peso y seguir (drop set)</button></div>` : '') : ''}`;
        }).join('')}
        <div class="sl-add"><button data-a="addSet">+ Agregar serie</button>${act0 && !isDone(si) ? `<button class="drop-now" data-a="dropNow">↓ Drop set en la serie ${ls.length + 1}</button>` : ''}</div>
      </div>
      ${act0 ? actions : ''}
      <details class="det"><summary>Detalles</summary><div class="det-sec"><span class="det-h">Cómo progresar hoy</span><p>Rango ${d.reps[0]}-${d.reps[1]} reps, ${d.type === 'comp' ? '1-2 en reserva en cada serie' : '1-2 en reserva y la última al fallo'}.${orderShort} ${(() => { const pl = plan(si); return ({
          nuevo: 'Primera vez: parte liviano y busca el mínimo del rango.',
          rep: 'Mismo peso. Suma una repetición donde te sobró reserva. Que las reps bajen de serie en serie es normal.',
          peso: `La última serie llegó al tope con 1-2 en reserva: sube a ${fmt(toU(pl.w))} ${S.unit} (+${pl.pct}%). Hoy la última serie debería caer cerca de ${d.reps[0]}.`,
          chico: `La vez pasada, con ${fmt(toU(pl.from))} ${S.unit}, te sobraron 3 o más: el salto fue chico. Hoy sube a ${fmt(toU(pl.w))} ${S.unit}.`,
          grande: `La vez pasada, con ${fmt(toU(pl.from))} ${S.unit}, no llegaste al mínimo: el salto fue grande. Hoy baja a ${fmt(toU(pl.w))} ${S.unit}.`
        })[pl.why]; })()}${d.type === 'comp' ? ' Descansa 2-3 min entre series para que las reps caigan menos.' : ''}</p></div><div class="det-sec"><span class="det-h">¿Por qué ${e.n.toLowerCase()} es equivalente?</span>${why}</div></details>` : ''}`}
    </section>`;
}

// Pestaña Semana quitada (Italo, 2026-11-26): el volumen por músculo vive en Inicio › Por músculo.
// Queda sin uso; el "Día 4 de rescate" de aquí se puede mover a Inicio si se pide.
function viewSemana() {
  const now = weekly(false), proj = weekly(true);
  const keys = Object.keys(META);
  const maxV = 18;
  const ratio = k => proj[k] / META[k][0];
  const behindK = [...keys].sort((a,b)=>ratio(a)-ratio(b)).slice(0,1);
  const bars = keys.map(k => {
    const [lo, hi] = META[k], b = proj[k] < lo;
    return `<div class="bar-row ${b && behindK.includes(k) ? 'behind' : ''}">
      <div class="bar-top"><span class="m">${MUS[k]}</span><span class="v">${fmt(now[k])}<span class="muted small"> / ${lo}-${hi}${proj[k] > now[k] ? ` · al cerrar hoy ${fmt(proj[k])}` : ''}</span></span></div>
      <div class="bar"><span class="zone" style="left:${lo/maxV*100}%;width:${(hi-lo)/maxV*100}%"></span><span class="proj" style="width:${Math.min(proj[k],maxV)/maxV*100}%"></span><span class="fill" style="width:${Math.min(now[k],maxV)/maxV*100}%"></span></div></div>`;
  }).join('');

  // Día 4
  const def = keys.map(k => ({ k, d: META[k][0] - proj[k], r: proj[k] / META[k][0] })).filter(x => x.d > 0.5).sort((a,b)=>a.r-b.r).slice(0,5);
  const d4 = def.length ? def.map((x,i)=>`<div class="d4-row"><span class="i">${i+1}</span><div><div style="font-weight:600">${D4LIB[x.k]}</div><div class="small muted">${MUS[x.k]}: faltan ${fmt(x.d)} series</div></div><span class="s">${Math.min(4, Math.max(2, Math.round(x.d)))} series</span></div>`).join('')
    : `<p class="small">No falta nada: segunda dosis liviana de tren superior (1 press, 1 remo, 1 lateral, 1 de brazos, 2-3 series cada uno).</p>`;

  return `
    <div><span class="eyebrow">Semana del 20 al 26 de noviembre</span><h1>Series duras por músculo</h1></div>
    <p class="small muted">Hecho: día 2 (lunes) y día 3 (miércoles, recortado). Hoy jueves: día 1. Lo que registres en Hoy se suma aquí al instante.</p>
    <section class="card">
      <div class="legend"><span><i style="background:var(--accent)"></i>Hecho</span><span><i style="background:var(--accent-soft);outline:1px dashed var(--accent)"></i>Si terminas hoy</span><span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>Meta</span></div>
      <div class="bars">${bars}</div>
      ${tag('no saber cuántas series duras llevas por músculo')}
    </section>
    <section class="card">
      <div><span class="eyebrow">Cómo se cuenta</span><h3>No todas las series valen lo mismo</h3></div>
      <p class="small">Una serie suma <b>1</b> al músculo principal y <b>0,5</b> a los que ayudan. Una serie de press de banca suma 1 a pecho y 0,5 a tríceps. Por eso, si recortas tríceps un día de press, no quedas en cero.</p>
      ${tag('tratar una serie de curl igual que una de dominadas')}
    </section>
    <section class="card">
      <div><span class="eyebrow">Día 4 de rescate · sábado</span><h3>Completa lo que va atrasado</h3></div>
      <div class="d4">${d4}</div>
      <p class="small muted">Se calcula con lo que llevarías al terminar hoy. Si recortas algo, aparece aquí.</p>
      ${tag('que un músculo pase dos semanas sin trabajarse por saltarte un día')}
    </section>`;
}

function viewGuia() {
  return `
    <div><span class="eyebrow">Guía de esfuerzo</span><h1>Qué tan cerca del fallo</h1></div>
    <p>El fallo es cuando ya no sale ni una repetición más con buena técnica. Llegar ahí en cada serie no te hace crecer más: te cansa mucho más, te obliga a descansar más y baja el rendimiento de las series que siguen.</p>
    <section class="card">
      <div><span class="eyebrow">La pregunta después de cada serie</span><h3>¿Cuántas más podías hacer?</h3></div>
      <div class="scale">
        <div class="scale-row"><span class="k">3+</span><span>Fue fácil. Sube el peso o haz más repeticiones.</span></div>
        <div class="scale-row hl"><span class="k">2</span><span>Zona buena para compuestos.</span></div>
        <div class="scale-row hl"><span class="k">1</span><span>Zona buena para casi todo.</span></div>
        <div class="scale-row fl"><span class="k">0</span><span>Fallo. Solo en la última serie de un aislado.</span></div>
      </div>
      <p class="small muted">A esto se le llama RIR (repeticiones en reserva). En la app solo tocas el número.</p>
    </section>
    <section class="rule">
      <div class="c"><span class="eyebrow">Compuestos</span><span class="big">1-2 en reserva</span><span class="small">Sentadilla, press, remo, dominadas, peso muerto. Nunca al fallo, ni en la última serie. Descansa 2-3 min.</span></div>
      <div class="a"><span class="eyebrow">Aislados</span><span class="big">Fallo al final</span><span class="small">Laterales, curl, tríceps, pantorrillas. 1-2 en reserva hasta la última serie; en esa, dalo todo. Descansa 60-90 s.</span></div>
    </section>
    <section class="card">
      <h3>Por qué no fallar en la sentadilla</h3>
      <ul class="plain small">
        <li>Mueve mucho peso y muchos músculos a la vez: el fallo cansa todo el cuerpo, no solo la pierna.</li>
        <li>Quedarte a 1-2 del fallo da casi el mismo estímulo con mucho menos cansancio.</li>
        <li>Si fallas en la primera serie, la segunda y la tercera salen peor, y terminas con menos trabajo total.</li>
        <li>Con la técnica rota y peso alto, aumenta el riesgo de lesión.</li>
      </ul>
      <p class="small muted">En un aislado como el curl el peso es bajo y el cansancio queda en un solo músculo, por eso ahí sí conviene apretar al final.</p>
    </section>
    <section class="card">
      <h3>Cómo subir de peso</h3>
      <ul class="plain small">
        <li>Cada serie busca quedar a 1-2 del fallo. Por el cansancio, las repeticiones bajan de serie en serie (por ejemplo 10, 9, 8). Es normal.</li>
        <li>Subes el peso cuando la <b>última</b> serie llega al tope del rango con 1-2 en reserva. No hace falta que todas lleguen al tope.</li>
        <li>El salto es de 5-8% (o el mínimo que permita el equipo). Con el peso nuevo, la última serie cae cerca del mínimo del rango.</li>
        <li>La sesión siguiente valida el salto: si te sobran 3 o más, fue chico y subes más; si no llegas al mínimo, fue grande y bajas un poco.</li>
        <li>En compuestos descansa 2-3 min para que las reps caigan menos entre series.</li>
      </ul>
      <p class="small muted">Si en una serie no llegas al rango, lo mejor es descansar más. Bajar el peso y seguir (serie descendente) también vale. Cada 5-6 semanas, una semana liviana.</p>
    </section>
    ${tag('entrenar todo al fallo por no saber que hay una mejor forma')}`;
}

function pickerHtml() {
  const fresh = S.pick === 'new' || S.pick === 'today';
  const used = fresh ? [] : DAY[S.ed].alts;
  const ref = fresh ? null : EX[DAY[S.ed].alts[0]];
  const q = (S.q || '').toLowerCase();

// Muñeco de músculos: se pinta según lo que llevas hoy (o en la semana)
function bodyLevels(mode) {
  const lv = {};
  if (mode === 'semana') {
    const w = weekly(false);
    Object.keys(META).forEach(m => lv[m] = { v: Math.min(1, w[m] / META[m][0]), a: w[m], b: META[m][0] });
    lv.front = lv.lat ? { ...lv.lat, v: lv.pecho.v } : null;
    return lv;
  }
  const plan = {}, done = {};
  const add = (t, e, k) => { e.p.forEach(m => t[m] = (t[m] || 0) + k); e.s.forEach(m => t[m] = (t[m] || 0) + k * 0.5); };
  const cut = cutSet();
  DAY.forEach((d, si) => { if (!cut.has(si) || logsFor(si).length) add(plan, exOf(si), Math.max(nS(si), logsFor(si).length)); });
  S.logs.forEach(l => add(done, EX[l.ex], 1));
  Object.keys(plan).forEach(m => lv[m] = { v: Math.min(1, (done[m] || 0) / plan[m]), a: done[m] || 0, b: plan[m] });
  return lv;
}

// fill(grupo) → color o null (piel). part: 'front' | 'back' | undefined (ambas).
function bodyFigure(fill, part, cls = 'bodyfig') {
  const color = r => { for (const g of REGION_GRUPO[r] || []) { const c = fill(g); if (c) return c; } return null; };
  const one = (list, lines, back) => {
    // los músculos que tocan van al final, para que su borde marcado quede encima de los vecinos
    const regs = [...list].sort((a, b) => !!color(a[0]) - !!color(b[0])).map(([r, pts]) => { const c = color(r); return [pts, mirror(pts)].map(q => `<path class="m${c ? ' on' : ''}" data-r="${r}" d="${closedPath(q)}" fill="${c || 'var(--fig-skin)'}"/>`).join(''); }).join('');
    const ln = lines.map(pts => [pts, mirror(pts)].map(q => `<path class="ln" d="${openPath(q)}"/>`).join('')).join('');
    const ears = [EAR, mirror(EAR)].map(q => `<path class="sk" d="${closedPath(q)}"/>`).join('');
    const neck = back ? '' : `<path class="ln" d="M50,36 L50,57.6"/>`;
    return `<path class="sk" d="${SIL}"/>${regs}${ln}${neck}${ears}<path class="sk" d="${HEAD}"/>`;
  };
  const f = one(FRONT, FRONT_LINES, false), b = one(BACK, BACK_LINES, true);
  if (part) return `<svg class="${cls}" viewBox="-1 -1 102 214" aria-hidden="true">${part === 'front' ? f : b}</svg>`;
  return `<svg class="${cls}" viewBox="-1 -1 216 214" aria-hidden="true"><g>${f}</g><g transform="translate(114,0)">${b}</g></svg>`;
}
